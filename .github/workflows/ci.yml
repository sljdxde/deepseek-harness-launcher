name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: brew install ripgrep

      - name: Run regression tests
        run: ./scripts/test.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deepseek-Harness-Launcher-dmg
          path: dist/Deepseek Harness Launcher.dmg
          if-no-files-found: error

      - name: Write test summary
        if: always()
        run: |
          if [[ -f "dist/Deepseek Harness Launcher.dmg" ]]; then
            echo "## 回归测试通过" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- 测试命令：\`./scripts/test.sh\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- DMG：\`dist/Deepseek Harness Launcher.dmg\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 本次提交：\`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 回归测试失败" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "请查看上方工作流日志中的失败步骤。" >> "$GITHUB_STEP_SUMMARY"
          fi

  memory-gate:
    name: First-install memory gate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: brew install ripgrep

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-dsh-${{ hashFiles('Resources/dsh-runtime/package-lock.json') }}

      - name: Measure first-install peak RSS
        # 1792MB：这道门禁要抓的是「退回裸 npm install 全量解析（曾达约 3GB）」，
        # 不是卡死当前锁定树。当前锁文件 724 个包（dsh 0.2.2）实测峰值约 1.2GB；
        # 冷缓存首装（真实首次安装，瓶颈在网络）只有 190-220MB；启动器给 npm 的
        # 堆上限是 1536MB（npmMaxOldSpaceSizeMB）。门禁取 1792MB：高于实测峰值，
        # 也高于我们分配的堆上限，仍远低于裸解析的 3GB 量级。
        run: ./scripts/memory-bench.sh 1792

  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum

      # fetch-node BEFORE vet: the exe embeds the Node zip
      # (internal/selfinstall/assets/node.zip), and go:embed is a compile
      # error when the file is missing. fetch-node.ps1 syncs that copy
      # itself, so vet/test work without running the full build first.
      - name: Fetch bundled Node
        working-directory: windows
        shell: pwsh
        run: ./fetch-node.ps1 -Out build

      - name: Vet
        working-directory: windows
        run: go vet ./...

      - name: Test
        working-directory: windows
        run: go test ./...

      - name: Build
        working-directory: windows
        shell: pwsh
        run: ./build.ps1 -Out build/DHL.exe

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: Deepseek-Harness-Launcher-windows
          path: windows/build/DHL.exe
          if-no-files-found: error

  # 契约快照 + 版本锁（票 28）。对「实装 rc」与「最新 rc」各跑一次：
  # 宿主形状/版本一旦漂移就红，别等用户白屏才发现。
  #
  # 版本怎么取：
  #   * 实装 rc = contracts/host-baseline.json 的 hostVersion（由 --write 从本机实装宿主读出）
  #     —— CI 里直接读文件，不硬编码具体 rc 号；
  #   * 最新 rc = `npm view @deepseek-ai/dsh versions --json` 里最大的 `-rc.N` 预发布版。
  # 这里只 `npm pack` 下载宿主 tarball 解出 d.ts（不 npm install、不启动宿主），
  # 避免把整套运行时拉进 CI。
  contract:
    name: Contract check (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: installed-rc
            rc: baseline
          - label: latest-rc
            rc: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve rc version
        id: resolve
        run: |
          set -euo pipefail
          RC='${{ matrix.rc }}'
          if [ "$RC" = "baseline" ]; then
            RC="$(node -p "require('./Plugins/DSHClientUILauncher/contracts/host-baseline.json').hostVersion")"
          elif [ "$RC" = "latest" ]; then
            RC="$(npm view @deepseek-ai/dsh versions --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const all=JSON.parse(s);const rc=all.filter(v=>/-rc\.\d+$/.test(v)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));process.stdout.write(rc.at(-1)??all.at(-1))})')"
          fi
          echo "resolved=$RC" >> "$GITHUB_OUTPUT"
          echo "契约检查目标宿主版本：$RC"

      - name: Fetch host type snapshots
        # 只下载并解包宿主 tarball 里的 d.ts，不安装依赖、不运行宿主。
        run: |
          set -euo pipefail
          RC='${{ steps.resolve.outputs.resolved }}'
          HOST="$RUNNER_TEMP/host"; PKGS="$RUNNER_TEMP/pkgs"
          mkdir -p "$HOST" "$PKGS"
          for pkg in dsh-client-ui-layout dsh-client-ui-sidebar dsh-client-ui-slots; do
            npm pack "@deepseek-ai/$pkg@$RC" --pack-destination "$PKGS" >/dev/null
            tar -xzf "$PKGS"/deepseek-ai-"$pkg"-*.tgz -C "$PKGS"
            rm -rf "$HOST/$pkg"; mv "$PKGS/package" "$HOST/$pkg"
          done

      - name: Contract snapshot check
        run: |
          node Plugins/DSHClientUILauncher/tools/contract-snapshot.mjs --check \
            --layout-from "$RUNNER_TEMP/host/dsh-client-ui-layout" \
            --sidebar-from "$RUNNER_TEMP/host/dsh-client-ui-sidebar" \
            --slots-from "$RUNNER_TEMP/host/dsh-client-ui-slots"

      - name: Version lock (host = baseline = package)
        # 三方不一致即红：latest-rc 若与基线不同，说明新 rc 需要跟进 baseline 与声明。
        run: |
          node Plugins/DSHClientUILauncher/tools/check-host-version.mjs \
            --host-version '${{ steps.resolve.outputs.resolved }}'
