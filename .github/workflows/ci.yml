name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: brew install ripgrep

      - name: Run regression tests
        run: ./scripts/test.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deepseek-Harness-Launcher-dmg
          path: dist/Deepseek Harness Launcher.dmg
          if-no-files-found: error

      - name: Write test summary
        if: always()
        run: |
          if [[ -f "dist/Deepseek Harness Launcher.dmg" ]]; then
            echo "## 回归测试通过" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- 测试命令：\`./scripts/test.sh\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- DMG：\`dist/Deepseek Harness Launcher.dmg\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 本次提交：\`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 回归测试失败" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "请查看上方工作流日志中的失败步骤。" >> "$GITHUB_STEP_SUMMARY"
          fi

  memory-gate:
    name: First-install memory gate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: brew install ripgrep

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-dsh-${{ hashFiles('Resources/dsh-runtime/package-lock.json') }}

      - name: Measure first-install peak RSS
        # 1792MB：这道门禁要抓的是「退回裸 npm install 全量解析（曾达约 3GB）」，
        # 不是卡死当前锁定树。当前锁文件 724 个包（dsh 0.2.2）实测峰值约 1.2GB；
        # 冷缓存首装（真实首次安装，瓶颈在网络）只有 190-220MB；启动器给 npm 的
        # 堆上限是 1536MB（npmMaxOldSpaceSizeMB）。门禁取 1792MB：高于实测峰值，
        # 也高于我们分配的堆上限，仍远低于裸解析的 3GB 量级。
        run: ./scripts/memory-bench.sh 1792

  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum

      # fetch-node BEFORE vet: the exe embeds the Node zip
      # (internal/selfinstall/assets/node.zip), and go:embed is a compile
      # error when the file is missing. fetch-node.ps1 syncs that copy
      # itself, so vet/test work without running the full build first.
      - name: Fetch bundled Node
        working-directory: windows
        shell: pwsh
        run: ./fetch-node.ps1 -Out build

      - name: Vet
        working-directory: windows
        run: go vet ./...

      - name: Test
        working-directory: windows
        run: go test ./...

      - name: Build
        working-directory: windows
        shell: pwsh
        run: ./build.ps1 -Out build/DHL.exe

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: Deepseek-Harness-Launcher-windows
          path: windows/build/DHL.exe
          if-no-files-found: error
