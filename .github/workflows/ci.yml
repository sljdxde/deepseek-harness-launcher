name: CI

on:
  push:
    branches:
      - main          # 暂时只跑 main；其他分支 push 不触发，避免消耗 runner
  workflow_dispatch:  # 需要时可在任意分支手动触发

# 同一分支连续推送只保留最新一次，避免排队烧机器
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 生成物与测试纪律（retro 2026-11-22）：比 regression 快得多，先跑，失败早于打包。
  # 覆盖三类真实事故：合并残留冲突标记、生成块同名顶层符号、BUILD_STAMP 漂移；
  # 以及 CODING_STANDARDS §1「禁止源码文本断言」（文件级放行需写明理由）。
  guards:
    name: Guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generated-region guard
        run: node scripts/check-generated.mjs

      - name: Test-assertion guard
        run: node scripts/check-tests.mjs

  regression:
    name: Regression
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Install test dependencies
        run: brew install ripgrep

      - name: Run regression tests
        run: ./scripts/test.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deepseek-Harness-Launcher-dmg
          path: dist/Deepseek Harness Launcher.dmg
          if-no-files-found: error

      - name: Write test summary
        if: always()
        run: |
          if [[ -f "dist/Deepseek Harness Launcher.dmg" ]]; then
            echo "## 回归测试通过" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- 测试命令：\`./scripts/test.sh\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- DMG：\`dist/Deepseek Harness Launcher.dmg\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 本次提交：\`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 回归测试失败" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "请查看上方工作流日志中的失败步骤。" >> "$GITHUB_STEP_SUMMARY"
          fi

  memory-gate:
    name: First-install memory gate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: brew install ripgrep

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-dsh-${{ hashFiles('Resources/dsh-runtime/package-lock.json') }}

      - name: Measure first-install peak RSS
        # 1792MB：这道门禁要抓的是「退回裸 npm install 全量解析（曾达约 3GB）」，
        # 不是卡死当前锁定树。当前锁文件 724 个包（dsh 0.2.2）实测峰值约 1.2GB；
        # 冷缓存首装（真实首次安装，瓶颈在网络）只有 190-220MB；启动器给 npm 的
        # 堆上限是 1536MB（npmMaxOldSpaceSizeMB）。门禁取 1792MB：高于实测峰值，
        # 也高于我们分配的堆上限，仍远低于裸解析的 3GB 量级。
        run: ./scripts/memory-bench.sh 1792

  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum

      # fetch-node BEFORE vet: the exe embeds the Node zip
      # (internal/selfinstall/assets/node.zip), and go:embed is a compile
      # error when the file is missing. fetch-node.ps1 syncs that copy
      # itself, so vet/test work without running the full build first.
      - name: Fetch bundled Node
        working-directory: windows
        shell: pwsh
        run: ./fetch-node.ps1 -Out build

      - name: Vet
        working-directory: windows
        run: go vet ./...

      - name: Test
        working-directory: windows
        run: go test ./...

      - name: Build
        working-directory: windows
        shell: pwsh
        run: ./build.ps1 -Out build/DHL.exe

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: Deepseek-Harness-Launcher-windows
          path: windows/build/DHL.exe
          if-no-files-found: error

  # 契约快照 + 版本锁（票 28）。对「实装 rc」与「最新 rc」各跑一次：
  # 宿主形状/版本一旦漂移就红，别等用户白屏才发现。
  #
  # 版本怎么取：
  #   * 实装 rc = contracts/host-baseline.json 的 hostVersion（由 --write 从本机实装宿主读出）
  #     —— CI 里直接读文件，不硬编码具体 rc 号；
  #   * 最新 rc = `npm view @deepseek-ai/dsh versions --json` 里最大的 `-rc.N` 预发布版。
  # 这里只 `npm pack` 下载宿主 tarball 解出 d.ts（不 npm install、不启动宿主），
  # 避免把整套运行时拉进 CI。
  contract:
    name: Contract check (${{ matrix.label }})
    # latest-rc 是「提示跟进支持区间」的信息位：挂了不挡合并，但会在 PR 上留红点
    continue-on-error: ${{ matrix.label == 'latest-rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: installed-rc
            rc: baseline
          - label: latest-rc
            rc: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Host gate (resolve + fetch + contract + version lock)
        id: resolve
        run: ./scripts/ci-host-gate.sh ${{ matrix.rc }}

  # 分发清单 + 端到端 canary（票 36）。
  # 一条 canary 覆盖「接管 / 不接管」两条路：正常基线 → 断言 v17 外壳渲染且无横幅；
  # 变异基线（版本漂移）→ 断言 HostGuard 横幅出现且原生 UI 保留。脚本是**离线桩**：
  # 驱动真实的 lib/guard.js + lib/bootstrap.js + lib/shell-render.js，不启真宿主、不联网，
  # 因此可在 ubuntu 上稳定跑；真宿主链路仍由 scripts/verify-shell-standalone.sh 覆盖。
  #
  # 对两个 rc 版本各跑一遍（与 contract job 同一套取版本口径，见该 job 顶部注释）：
  #   * installed-rc = contracts/host-baseline.json 的 hostVersion（读文件，不硬编码）；
  #   * latest-rc    = `npm view @deepseek-ai/dsh versions --json` 里最大的 `-rc.N` 预发布版。
  # 本 job 同时跑 contract --check + 版本锁 + canary，把「宿主形状 / 版本 / 接管路径」三道闸
  # 绑在同一目标 rc 上；canary 传 --host-version 让"基线接管"在 host=新 rc 时同样成立
  # （支持区间 >=0.2.2-rc.4 <0.3.0）。
  canary:
    name: Canary (${{ matrix.label }})
    # latest-rc 是「提示跟进支持区间」的信息位：挂了不挡合并，但会在 PR 上留红点
    continue-on-error: ${{ matrix.label == 'latest-rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: installed-rc
            rc: baseline
          - label: latest-rc
            rc: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Host gate (resolve + fetch + contract + version lock)
        id: resolve
        run: ./scripts/ci-host-gate.sh ${{ matrix.rc }}

      - name: Offline canary (takeover / no-takeover)
        run: |
          node Plugins/DSHClientUILauncher/scripts/canary.mjs \
            --mode both --host-version '${{ steps.resolve.outputs.resolved }}'

  # 真机 canary（A3）：只有配置了仓库变量 DSH_BIN 的 self-hosted macOS runner 才跑。
  # 没配 DSH_BIN 时整个 job 跳过；即便误触发，canary --real 也会因缺 DSH_BIN exit 3（不假装成功）。
  # 断言语义：从 DSH_BIN 起一个独立 dsh（临时 DSH_HOME），root 渲染成 v17 外壳、无 HostGuard 横幅。
  real-canary:
    name: Real-host canary (DSH_BIN)
    if: ${{ vars.DSH_BIN != '' }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Real host canary (takeover on real dsh)
        env:
          DSH_BIN: ${{ vars.DSH_BIN }}
        run: node Plugins/DSHClientUILauncher/scripts/canary.mjs --real
