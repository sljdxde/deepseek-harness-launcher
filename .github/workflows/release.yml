name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  regression:
    name: Regression gate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install test dependencies
        run: brew install ripgrep

      - name: Run regression tests
        run: ./scripts/test.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-DMG
          path: dist/Deepseek Harness Launcher.dmg
          if-no-files-found: error

      - name: Write test summary
        if: always()
        run: |
          if [[ -f "dist/Deepseek Harness Launcher.dmg" ]]; then
            echo "## 发布回归测试通过" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- DMG：\`dist/Deepseek Harness Launcher.dmg\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 接下来只有测试通过才会进入发布步骤。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 发布回归测试失败" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Release 已被阻止，不会创建或更新。" >> "$GITHUB_STEP_SUMMARY"
          fi

  memory-gate:
    name: First-install memory gate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install test dependencies
        run: brew install ripgrep

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-dsh-${{ hashFiles('Resources/dsh-runtime/package-lock.json') }}

      - name: Measure first-install peak RSS
        # 1792MB：与 ci.yml 同一口径（当前锁文件 724 个包实测约 1.2GB，堆上限 1536MB）。
        run: ./scripts/memory-bench.sh 1792

  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum

      # fetch-node BEFORE vet/build: the exe embeds the Node zip
      # (internal/selfinstall/assets/node.zip) and build.ps1 refuses to run
      # without build\node.zip. fetch-node.ps1 syncs the embed copy itself.
      - name: Fetch the bundled Node runtime
        working-directory: windows
        shell: pwsh
        run: ./fetch-node.ps1 -Out build

      - name: Vet and test
        working-directory: windows
        run: |
          go vet ./...
          go test ./...

      - name: Build the launcher
        working-directory: windows
        shell: pwsh
        run: ./build.ps1 -Out build/DHL.exe

      - name: Package the portable ZIP
        working-directory: windows
        shell: pwsh
        run: |
          # Select-String 是按行匹配的，而 plist 里 <key> 与 <string> 分在两行，
          # 所以必须整文件读入再做多行正则（之前用 Select-String 直接报
          # "Cannot index into a null array"）。
          $ver = [regex]::Match((Get-Content -Raw ..\Resources\Info.plist), 'CFBundleShortVersionString</key>\s*<string>([^<]+)</string>').Groups[1].Value
          if (-not $ver) { throw 'cannot read CFBundleShortVersionString from Resources/Info.plist' }
          $stage = "build\portable"
          New-Item $stage -ItemType Directory -Force | Out-Null
          Copy-Item build\DHL.exe $stage
          Copy-Item build\node $stage -Recurse
          Copy-Item ..\README.md $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "build\DHL-windows-$ver.zip" -Force
          Copy-Item build\DHL.exe build\DHL-windows-amd64.exe
          Write-Host "packaged $ver"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-Windows
          path: |
            windows/build/DHL-windows-amd64.exe
            windows/build/DHL-windows-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [regression, memory-gate, windows]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: Release-DMG
          path: dist/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: Release-Windows
          path: windows-dist/

      - name: Resolve tag
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches bundle version
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # ubuntu 上没有 PlistBuddy，用 python3 标准库读 plist（Info.plist 为 XML 格式）。
          VERSION="$(python3 -c "import plistlib; print(plistlib.load(open('Resources/Info.plist','rb'))['CFBundleShortVersionString'])")"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $TAG does not match bundle version $VERSION. Official releases must tag the exact x.y.z version (no test iteration suffix); see AGENTS.md."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          DMG="dist/Deepseek Harness Launcher.dmg"
          # Windows 产物由 download-artifact 落在 windows-dist/（见上一步），
          # 文件名固定为 amd64.exe + DHL-windows-<ver>.zip。之前这里引用了从未
          # 定义过的 $WINEXE/$WINZIP，set -u 会让发布步骤直接失败。
          WINEXE="windows-dist/DHL-windows-amd64.exe"
          WINZIP="$(ls windows-dist/DHL-windows-*.zip | head -1)"
          test -f "$WINEXE"
          test -f "$WINZIP"
          NOTES=$(printf '## Deepseek Harness Launcher v%s\n\n已通过 GitHub Actions 回归测试后自动发布。\n' "${TAG#v}")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Deepseek Harness Launcher v${TAG#v}" --notes "$NOTES" --target "${GITHUB_SHA}"
            gh release upload "$TAG" "$DMG" "$WINEXE" "$WINZIP" --clobber
          else
            gh release create "$TAG" "$DMG" "$WINEXE" "$WINZIP" --title "Deepseek Harness Launcher v${TAG#v}" --notes "$NOTES" --target "${GITHUB_SHA}"
          fi
