<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dsh · 新界面融合版（现有外壳 + 工作台密度）</title>
<style>
/* ---------- tokens ---------- */
:root{
  --rail:56px; --side:272px; --dock-w:384px; --status:26px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --r-xs:6px; --r-sm:8px; --r:10px; --r-md:12px; --r-lg:14px; --r-xl:18px;
  --ease:cubic-bezier(.32,.72,0,1);
  --fast:.12s; --mid:.18s;
  --pad:16px; --gap:10px;
  --shadow:0 18px 44px rgba(24,20,12,.16),0 2px 6px rgba(24,20,12,.08);
}
html[data-theme="light"]{
  --bg:#f4f1e9; --bg2:#eeeae0; --panel:#faf8f3; --surface:#fffdf8; --surface2:#f1ede3; --surface3:#e6e1d3;
  --line:rgba(27,28,25,.10); --line2:rgba(27,28,25,.18);
  --ink:#1b1c19; --ink2:#4c4d46; --ink3:#6b6a60; --ink4:#928f84;
  --accent:#3a55c8; --accent-soft:rgba(58,85,200,.10); --on-accent:#fff;
  --amber:#96601a; --amber-soft:rgba(150,96,26,.12);
  --green:#2c7458; --green-soft:rgba(44,116,88,.12);
  --red:#ab3f36; --red-soft:rgba(171,63,54,.12);
  --code-bg:#f6f2e8; --diff-add:#e9f3ea; --diff-add-ink:#256244; --diff-del:#fbecea; --diff-del-ink:#9c4338;
  --hover:rgba(27,28,25,.055); --hover2:rgba(27,28,25,.09);
  --tip:#2c2c2e; --tip-ink:#fff;
}
html[data-theme="dark"]{
  --bg:#121316; --bg2:#15171a; --panel:#17191e; --surface:#1b1d21; --surface2:#22252a; --surface3:#2b2e34;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --ink:#edebe3; --ink2:#b0aea4; --ink3:#8f8d84; --ink4:#767469;
  --accent:#93a8ff; --accent-soft:rgba(147,168,255,.13); --on-accent:#101216;
  --amber:#e0a76a; --amber-soft:rgba(224,167,106,.14);
  --green:#5ec9a6; --green-soft:rgba(94,201,166,.14);
  --red:#f18c81; --red-soft:rgba(241,140,129,.14);
  --code-bg:#14161a; --diff-add:rgba(94,201,166,.10); --diff-add-ink:#7fd8b8; --diff-del:rgba(241,140,129,.10); --diff-del-ink:#f0a79e;
  --hover:rgba(255,255,255,.06); --hover2:rgba(255,255,255,.10);
  --tip:#33363c; --tip-ink:#f4f2ec;
  --shadow:0 22px 52px rgba(0,0,0,.52),0 2px 8px rgba(0,0,0,.38);
}
html[data-density="compact"]{ --pad:10px; --gap:6px; }

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink3)}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:16px;height:16px;flex:0 0 auto;stroke-width:1.7}

/* ---------- app grid ---------- */
.app{display:grid;grid-template-columns:var(--rail) var(--side) minmax(0,1fr) var(--dock-w);height:calc(100vh - var(--status))}
.app.nodock{grid-template-columns:var(--rail) var(--side) minmax(0,1fr) 0}
.app.noside{grid-template-columns:var(--rail) 0 minmax(0,1fr) var(--dock-w)}

/* ---------- rail ---------- */
.rail{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;overflow:visible;z-index:30}
.rail .spacer{flex:1}
.rail-btn{width:38px;height:38px;border-radius:var(--r);color:var(--ink3);display:grid;place-items:center;position:relative;transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
.rail-btn:hover{background:var(--hover);color:var(--ink)}
.rail-btn.on{background:var(--surface3);color:var(--ink)}
.rail-btn.on::before{content:"";position:absolute;left:-9px;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--accent)}
.rail-btn svg.ic{width:19px;height:19px}
.rail-badge{position:absolute;top:4px;right:4px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--on-accent);font:9px/15px var(--font-mono);text-align:center;padding:0 3px}
.rail-tip{position:absolute;left:calc(100% + 9px);top:50%;transform:translateY(-50%) translateX(-3px);padding:4px 8px;border-radius:var(--r-xs);background:var(--tip);color:var(--tip-ink);font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;z-index:90;transition:opacity var(--fast) var(--ease),transform var(--fast) var(--ease);box-shadow:0 8px 22px rgba(0,0,0,.26)}
.rail-btn:hover .rail-tip,.rail-btn:focus-visible .rail-tip{opacity:1;transform:translateY(-50%)}
.rail-sep{width:22px;height:1px;background:var(--line);margin:6px 0}
.rail-logo{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-bottom:8px;flex:0 0 auto}
.rail-logo svg.ic{width:17px;height:17px;stroke-width:2}
.rail-av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:600;margin-top:4px}

/* ---------- side ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;overflow:hidden}
.side-h{display:flex;align-items:center;gap:8px;padding:12px 12px 6px 16px;min-height:44px}
.side-h h2{font-size:13.5px;font-weight:600;letter-spacing:.2px}
.side-h .cnt{font:11px/1 var(--font-mono);color:var(--ink3);padding:3px 5px;border-radius:var(--r-xs);background:var(--surface2)}
.side-h .icon-btn{margin-left:auto}
.side-scroll{padding:0 8px 12px;overflow-y:auto;overscroll-behavior:contain}
.side-scroll::-webkit-scrollbar{width:8px}
.side-scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px;border:2px solid transparent;background-clip:content-box}
.side-foot{border-top:1px solid var(--line);padding:8px 12px;display:grid;gap:6px;background:var(--panel)}
.icon-btn{width:26px;height:26px;border-radius:var(--r-xs);display:grid;place-items:center;color:var(--ink3);transition:background var(--fast) var(--ease),color var(--fast) var(--ease);flex:0 0 auto}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg.ic{width:15px;height:15px}

.sec{margin-top:12px}
.sec-h{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.4px}
.sec-h .kbd{margin-left:auto}
.sec-h .n{font:11px/1 var(--font-mono);color:var(--ink4)}
.sec-h button{color:var(--ink3);display:grid;place-items:center;width:20px;height:20px;border-radius:5px}
.sec-h button:hover{background:var(--hover);color:var(--ink)}

/* 需要你 */
.need-wrap{margin:4px 0 6px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.need-h{display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:11.5px;font-weight:600;color:var(--ink2);width:100%;text-align:left}
.need-h:hover{background:var(--hover)}
.need-h .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:0 0 auto}
.need-h .n{margin-left:auto;font:11px/1 var(--font-mono);color:var(--amber);background:var(--amber-soft);padding:2px 5px;border-radius:5px}
.need-row{display:grid;grid-template-columns:12px minmax(0,1fr);gap:6px;padding:7px 9px 8px;border-top:1px solid var(--line);width:100%;text-align:left;align-items:start}
.need-row:hover{background:var(--hover)}
.need-row .bd{width:5px;height:5px;border-radius:50%;background:var(--amber);margin-top:6px}
.need-row .t{font-size:12.5px;line-height:1.45;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.need-row .s{font-size:11px;color:var(--ink3);margin-top:1px;display:flex;gap:5px;align-items:center}
.need-acts{grid-column:2;display:flex;gap:4px;margin-top:5px}

/* workspace */
.ws{margin:1px 0}
.ws-row{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:var(--r-sm);width:100%;text-align:left;color:var(--ink2)}
.ws-row:hover{background:var(--hover);color:var(--ink)}
.ws-row .caret{transition:transform var(--fast) var(--ease);color:var(--ink4)}
.ws-row.open .caret{transform:rotate(90deg)}
.ws-row .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-row .n{font:10.5px/1 var(--font-mono);color:var(--ink4)}
.ws-row .more{margin-left:auto;opacity:0}
.ws-row:hover .more,.ws-row:focus-within .more{opacity:1}
.ws-dirs{padding:2px 8px 6px 26px;display:grid;gap:2px}
.ws-dir{font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:5px;align-items:center}
.ws-dir svg.ic{width:12px;height:12px;color:var(--ink4)}

.chat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 6px;padding:6px 8px 6px 10px;border-radius:var(--r-sm);width:100%;text-align:left;position:relative}
.chat-row:hover{background:var(--hover)}
.chat-row.on{background:var(--surface3)}
.chat-row.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent)}
.chat-row .t{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-row .m{font:10.5px/1.4 var(--font-mono);color:var(--ink4);white-space:nowrap;display:flex;align-items:center;gap:3px}
.pin{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;color:var(--ink4);opacity:0;transition:opacity var(--fast) var(--ease),background var(--fast) var(--ease),color var(--fast) var(--ease)}
.pin svg.ic{width:12px;height:12px}
.chat-row:hover .pin,.pin:focus-visible{opacity:1}
.pin.on{opacity:1;color:var(--accent)}
.pin:hover{background:var(--hover2);color:var(--accent)}
.chat-row .git{display:flex;gap:4px;font:10px/1 var(--font-mono);grid-column:1;margin-top:1px}
.git-add{color:var(--green)} .git-del{color:var(--red)}
.chat-row .sub{grid-column:1;font-size:10.5px;color:var(--ink4);display:flex;gap:6px;align-items:center;margin-top:1px}

.side-new{display:flex;align-items:center;gap:7px;width:100%;padding:7px 9px;margin:4px 0 2px;border:1px dashed var(--line2);border-radius:var(--r-sm);color:var(--ink2);font-size:12.5px}
.side-new:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.side-new .kbd{margin-left:auto}

.kbd{font:10.5px/1 var(--font-mono);color:var(--ink3);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:3px 5px;white-space:nowrap}
.chip .kbd{background:transparent;border-color:transparent;padding:0 0 0 2px;color:var(--ink4)}

.stack{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3)}
.stack .ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface3) 0);display:grid;place-items:center;font:9px/1 var(--font-mono);color:var(--ink2);position:relative}
.stack .ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--panel)}
.stack .ring b{position:relative;z-index:1;font-weight:600}
.stack .lbl{display:grid;line-height:1.25}
.stack .lbl b{font-size:11.5px;font-weight:500;color:var(--ink2)}
.stack .lbl span{font:10px/1.2 var(--font-mono);color:var(--ink4)}

/* ---------- main ---------- */
.main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;background:var(--bg);overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);min-height:46px;background:var(--bg);flex-wrap:nowrap;overflow:hidden}
.topbar .ttl{font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch;display:flex;gap:6px;align-items:center;min-width:0;flex:0 1 auto}
.topbar .ttl .sep{color:var(--ink4)}
.topbar .crumb{color:var(--ink3);font-weight:400;white-space:nowrap;flex:0 0 auto}
.topbar .tl-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink2);font-size:11.5px;white-space:nowrap;transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),color var(--fast) var(--ease)}
.chip:hover{border-color:var(--line2);color:var(--ink);background:var(--surface2)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip svg.ic{width:14px;height:14px}
.chip.demo{background:var(--amber-soft);border-color:transparent;color:var(--amber);font-size:11px}
.chip.git{font-family:var(--font-mono);font-size:11px;gap:6px}

/* page */
.page{overflow-y:auto;padding:calc(var(--pad) + 6px) var(--pad) 24px;scrollbar-gutter:stable}
.page::-webkit-scrollbar{width:10px}
.page::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:3px solid transparent;background-clip:content-box}
.page-h{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.page-h h1{font-size:20px;font-weight:600;letter-spacing:-.2px}
.page-h p{font-size:12.5px;color:var(--ink3);max-width:62ch;margin-bottom:2px}
.page-h .acts{margin-left:auto;display:flex;gap:6px}

.btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink2);font-size:12px;white-space:nowrap;transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),color var(--fast) var(--ease)}
.btn:hover{background:var(--surface2);color:var(--ink);border-color:var(--line2)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:24px;padding:0 8px;font-size:11.5px;border-radius:var(--r-xs)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg.ic{width:14px;height:14px}
.btn.danger{color:var(--red)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px}
.card.dashed{border-style:dashed;border-color:var(--line2);background:transparent}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.col-h{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink2);margin:6px 0 8px}
.col-h .dot{width:6px;height:6px;border-radius:50%}
.col-h .n{font:11px/1 var(--font-mono);color:var(--ink4);margin-left:2px}
.col-h.need .dot{background:var(--amber)} .col-h.run .dot{background:var(--accent)} .col-h.idle .dot{background:var(--line2)}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 10px;margin-bottom:8px;transition:border-color var(--fast) var(--ease)}
.mini:hover{border-color:var(--line2)}
.mini .t{font-size:12.5px;line-height:1.45}
.mini .s{font-size:11px;color:var(--ink3);display:flex;gap:5px;align-items:center;margin-top:2px;flex-wrap:wrap}
.mini .s svg.ic{width:12px;height:12px}
.mini .acts{display:flex;gap:4px;margin-top:7px}
.bar{height:4px;border-radius:2px;background:var(--surface3);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s var(--ease)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--surface2);color:var(--ink3);display:inline-flex;gap:3px;align-items:center}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.err{background:var(--red-soft);color:var(--red)}
.tag.wait{background:var(--amber-soft);color:var(--amber)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}

/* plugin cards */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:10px}
.pcard{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:9px;align-items:center;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);text-align:left;transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
.pcard:hover{border-color:var(--line2);background:var(--surface2)}
.pico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.pico.own{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pico svg.ic{width:17px;height:17px}
.pcard .nm{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;line-height:1.4}
.pcard .v{display:block;font-size:11px;color:var(--ink4);font-variant-numeric:tabular-nums;line-height:1.5}
.pcard .d{display:block;font-size:11px;color:var(--ink3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .go{color:var(--ink4)}
.pcard:hover .go{color:var(--accent)}
.ic.flip{transform:scaleX(-1)}

/* 更多：默认折叠，点标题展开 */
.sec-tog{display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px;border-radius:var(--r-xs);font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.4px;text-align:left;transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
.sec-tog:hover{background:var(--hover);color:var(--ink2)}
.sec-tog .caret{color:var(--ink4);transition:transform var(--fast) var(--ease)}
.sec-tog.open .caret{transform:rotate(90deg)}
.sec-tog .n{font:11px/1 var(--font-mono);color:var(--ink4);margin-left:2px}
.sec-tog .hint{margin-left:auto;font-size:10.5px;font-weight:400;letter-spacing:0;color:var(--ink3)}
.sec-empty{padding:3px 8px 9px;font-size:11px;color:var(--ink3)}

/* 目录选择 */
.dsel{display:grid;gap:6px;width:100%;max-width:460px;margin-top:4px;text-align:left}
.dsel .cap{font-size:11px;color:var(--ink3)}
.dsel-ws{display:flex;gap:6px;flex-wrap:wrap}
.dchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;color:var(--ink2);transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),color var(--fast) var(--ease)}
.dchip:hover{border-color:var(--line2);color:var(--ink)}
.dchip.on{border-color:transparent;background:var(--accent-soft);color:var(--accent);font-weight:500}
.dchip svg.ic{width:13px;height:13px}
.dchip .k{font:10px/1 var(--font-mono);opacity:.65}
.dlist{display:grid;gap:4px}
.drow{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:7px;align-items:center;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:12px;color:var(--ink2);width:100%;text-align:left;transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),color var(--fast) var(--ease)}
.drow:hover{border-color:var(--line2);color:var(--ink)}
.drow.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drow svg.ic{width:13px;height:13px}
.drow .p{font-family:var(--font-mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .k{font:10px/1 var(--font-mono);color:var(--ink4)}
.drow.on .k{color:var(--accent)}

/* 输入框上方的附件条 */
.attach{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 7px}
.atch{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 3px 0 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:11px;color:var(--ink2)}
.atch svg.ic{width:12px;height:12px;color:var(--ink4)}
.atch b{font:10.5px/1 var(--font-mono);font-weight:500}
.atch button{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:var(--ink4)}
.atch button:hover{background:var(--hover2);color:var(--ink)}
.atch button svg.ic{width:10px;height:10px}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:500}
.pill.dim{color:var(--ink3);background:transparent;border-style:dashed;cursor:default}
.pill.dim:hover{border-color:var(--line);color:var(--ink3)}

/* 插件详情 */
.phead{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.phead .pico{width:44px;height:44px;border-radius:12px}
.phead .pico svg.ic{width:22px;height:22px}
.phead h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.4}
.phead .meta{font:11.5px/1.6 var(--font-mono);color:var(--ink3);margin-top:3px;overflow-wrap:anywhere}
.phead .d{font-size:12px;color:var(--ink3);margin-top:3px}
.pdetail{display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:12px;align-items:start}
.slot{border:1px dashed var(--line2);border-radius:var(--r-lg);padding:12px}
.slot-h{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);margin-bottom:9px}
.slot-h .tag{margin-left:auto}
.pnote{font-size:11px;color:var(--ink3);margin-top:9px;line-height:1.6}
.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.botc{display:grid;gap:3px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);text-align:left;transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
.botc:hover{border-color:var(--line2);background:var(--surface2)}
.botc .n{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.botc .n svg.ic{width:13px;height:13px;color:var(--ink3)}
.botc .n .tag{margin-left:auto}
.botc .s{font-size:11px;color:var(--ink3)}
.botc .t{font:10.5px/1.45 var(--font-mono);color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 小菜单 / 行内输入 */
.mlist{display:grid;gap:2px}
.mitem{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:8px 9px;border-radius:var(--r-sm);font-size:12.5px;color:var(--ink2);text-align:left}
.mitem:hover{background:var(--hover);color:var(--ink)}
.mitem svg.ic{width:14px;height:14px;color:var(--ink3)}
.mitem .k{font:10.5px/1 var(--font-mono);color:var(--ink3)}
.mitem.danger{color:var(--red)}
.mitem.danger:hover{background:var(--red-soft)}
.mitem.danger svg.ic{color:var(--red)}
.fld{display:grid;gap:6px}
.fld label{font-size:11.5px;color:var(--ink3)}
.fld input{height:32px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:0 9px;font-size:12.5px;outline:none}
.fld input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (max-width:1080px){ .pdetail{grid-template-columns:minmax(0,1fr)} }

/* thread */
.thread-wrap{overflow-y:auto;padding:14px 0 8px;scrollbar-gutter:stable}
.thread-wrap::-webkit-scrollbar{width:10px}
.thread-wrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:3px solid transparent;background-clip:content-box}
.thread{max-width:740px;margin:0 auto;padding:0 20px;display:grid;gap:14px}
.turn{display:grid;gap:10px}
.msg-user{justify-self:end;max-width:82%;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 4px var(--r-lg);padding:9px 13px;font-size:13px;line-height:1.6}
.msg-user .stamp{font:10.5px/1 var(--font-mono);color:var(--ink4);margin-top:5px;text-align:right}
.msg-bot{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
.msg-bot>.who{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-top:1px;flex:0 0 auto}
.msg-bot>.who svg.ic{width:13px;height:13px;stroke-width:2}
.msg-bot .bd{min-width:0}
.msg-bot .hd{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);margin-bottom:4px}
.msg-bot .hd b{color:var(--ink2);font-weight:600;font-size:12px}
.msg-bot .tx{font-size:13px;line-height:1.68;color:var(--ink)}
.msg-bot .tx p+p{margin-top:8px}
.msg-bot .tx ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
.msg-bot .tx b{font-weight:600}
.msg-bot .tx code,.codec{font-family:var(--font-mono);font-size:11.5px;background:var(--code-bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}
.msg-acts{display:flex;gap:2px;margin-top:4px;opacity:0;transition:opacity var(--fast) var(--ease)}
.msg-bot:hover .msg-acts,.msg-acts:focus-within{opacity:1}

/* fold line */
.fold{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);padding:3px 7px;border-radius:var(--r-xs);margin:2px 0 2px -2px}
.fold:hover{background:var(--hover);color:var(--ink2)}
.fold svg.ic{width:12px;height:12px;transition:transform var(--fast) var(--ease)}
.fold.open svg.ic{transform:rotate(90deg)}
.fold .d{color:var(--ink4)}

/* tools */
.tools{margin:6px 0 2px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.tools-h{display:flex;align-items:center;gap:7px;padding:7px 10px;font-size:11.5px;color:var(--ink2);width:100%;text-align:left}
.tools-h:hover{background:var(--hover)}
.tools-h .n{color:var(--ink4);font-family:var(--font-mono);font-size:11px}
.tool-row{display:grid;grid-template-columns:18px 52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);font-size:11.5px}
.tool-row .k{color:var(--ink3);font-family:var(--font-mono);font-size:10.5px;text-transform:none}
.tool-row .c{font-family:var(--font-mono);font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-row .d{font:10.5px/1 var(--font-mono);color:var(--ink4)}
.tool-row svg.ic{width:13px;height:13px;color:var(--ink4)}
.tool-row.bad .c{color:var(--red)}

/* plan card */
.plan{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:11px 12px;margin:8px 0 0}
.plan-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.plan-h .kbd{margin-left:auto}
.plan-step{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;font-size:12.5px}
.plan-step .no{width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font:10px/1 var(--font-mono);color:var(--ink3)}
.plan-step.done .no{background:var(--green-soft);border-color:transparent;color:var(--green)}
.plan-step.doing .no{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.plan-step.doing .nm{color:var(--ink);font-weight:500}
.plan-step .nm{color:var(--ink2)}
.plan-step.next .nm{color:var(--ink3)}

/* bot cards: task / report / changed / approval */
.bcard{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;margin:2px 0}
.bcard-h{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
.bcard-h .who{color:var(--ink2);font-weight:600;white-space:nowrap;flex:0 0 auto}
.bcard-h .chg-sum{white-space:nowrap;flex:0 0 auto}
.bcard-h .r{margin-left:auto;display:flex;gap:5px;align-items:center}
.bcard-b{padding:11px 12px}
.bcard-b h4{font-size:13.5px;font-weight:600;margin-bottom:4px}
.bcard-b .sub{font-size:12px;color:var(--ink3)}
.report-tag{font:10px/1 var(--font-mono);letter-spacing:.6px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:3px 5px}
.prog-row{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px;color:var(--ink3)}
.prog-row .bar{flex:1;margin:0}
.crit{display:grid;gap:5px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.crit label{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:7px;align-items:center;font-size:12px;color:var(--ink2);cursor:pointer}
.crit input{appearance:none;width:13px;height:13px;border:1.5px solid var(--line2);border-radius:4px;display:grid;place-items:center;margin:0}
.crit input:checked{background:var(--accent);border-color:transparent}
.crit input:checked::after{content:"";width:6px;height:6px;border-radius:1px;background:var(--on-accent)}
.crit .who{font:10.5px/1 var(--font-mono);color:var(--ink4)}
.dyn{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);display:grid;gap:3px}
.dyn b{color:var(--ink4);font:10.5px/1 var(--font-mono);font-weight:500;letter-spacing:.4px}
.chg-row{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;font-size:11.5px;border-bottom:1px solid var(--line)}
.chg-row:last-child{border-bottom:0}
.chg-row .f{font-family:var(--font-mono);font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chg-row svg.ic{width:14px;height:14px;color:var(--ink4)}
.chg-sum{font:10.5px/1 var(--font-mono);color:var(--ink4)}
.appr{border:1px solid var(--amber-soft);background:linear-gradient(0deg,var(--amber-soft),var(--amber-soft)),var(--surface);border-radius:var(--r-lg);overflow:hidden}
.appr-h{display:flex;align-items:center;gap:7px;padding:8px 12px;font-size:11.5px;color:var(--amber);font-weight:600;border-bottom:1px solid var(--amber-soft)}
.appr-b{padding:11px 12px}
.appr-b .cmd{font-family:var(--font-mono);font-size:12px;background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;margin:7px 0;overflow-x:auto;white-space:pre;color:var(--ink)}
.appr-b .why{font-size:12px;color:var(--ink2);line-height:1.6}
.appr-b .hint{font-size:11px;color:var(--ink4);margin-top:8px}
.appr-acts{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}
.appr.done{background:var(--surface);border-color:var(--line)}
.appr.done .appr-h{color:var(--green);border-color:var(--line)}
.appr.done .appr-b .hint{margin-top:6px}

/* empty state */
.empty{display:grid;justify-items:center;gap:10px;place-content:center;min-height:100%;padding:24px;text-align:center}
.empty .plus{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty h2{font-size:20px;font-weight:600}
.empty p{font-size:12.5px;color:var(--ink3);max-width:40ch}
.starters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:5px;width:100%;max-width:440px}
.starter{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:12.5px;color:var(--ink2);text-align:left;transition:border-color var(--fast) var(--ease)}
.starter:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.starter svg.ic{width:15px;height:15px;color:var(--ink3)}
.starter:hover svg.ic{color:var(--accent)}
.hintline{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink4);flex-wrap:wrap;justify-content:center}

/* tabs */
.tabs{display:flex;align-items:center;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:5px;padding:9px 8px;font-size:12.5px;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap;transition:color var(--fast) var(--ease)}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tab .n{font:10px/1 var(--font-mono);background:var(--surface3);color:var(--ink3);border-radius:5px;padding:2px 4px}

/* composer */
.composer{padding:8px 14px 12px;border-top:1px solid var(--line);background:var(--bg)}
.cm-pills{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;color:var(--ink2)}
.pill:hover{border-color:var(--line2);color:var(--ink)}
.pill svg.ic{width:13px;height:13px}
.pill.warn{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.cm-box{border:1px solid var(--line2);border-radius:var(--r-lg);background:var(--surface);padding:9px 10px 8px;transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
.cm-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cm-box textarea{width:100%;border:0;background:transparent;resize:none;font-size:13px;line-height:1.55;min-height:40px;max-height:160px;outline:none;display:block;padding:2px 2px 6px}
.cm-box textarea::placeholder{color:var(--ink4)}
.cm-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cm-row .sep{width:1px;height:16px;background:var(--line)}
.cm-meta{margin-left:auto;display:flex;align-items:center;gap:8px;font:10.5px/1 var(--font-mono);color:var(--ink4)}
.send{width:30px;height:30px;border-radius:var(--r-sm);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transition:filter var(--fast) var(--ease),opacity var(--fast) var(--ease)}
.send svg.ic{width:16px;height:16px;stroke-width:2}
.send:hover{filter:brightness(1.08)}
.send[disabled]{opacity:.38;cursor:not-allowed}

/* ---------- dock ---------- */
.dock{background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;overflow:hidden}
.dock-h{display:flex;align-items:center;gap:1px;padding:4px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.dock-h::-webkit-scrollbar{display:none}
.dtab{display:inline-flex;align-items:center;gap:4px;padding:8px 7px;font-size:11.5px;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap}
.dtab:hover{color:var(--ink)}
.dtab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.dtab .n{font:9.5px/1 var(--font-mono);background:var(--surface3);border-radius:4px;padding:2px 3px;color:var(--ink3)}
.dock-b{overflow-y:auto;padding:10px 12px;scrollbar-gutter:stable}
.dock-b::-webkit-scrollbar{width:9px}
.dock-b::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:3px solid transparent;background-clip:content-box}
.dock-f{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;align-items:center;background:var(--panel)}
.dock-sum{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);padding:2px 2px 9px}
.dock-sum .g{font:10.5px/1 var(--font-mono);color:var(--ink4)}
.dock-sum .cg{font:10.5px/1 var(--font-mono);color:var(--ink4);margin-left:auto;display:flex;gap:6px}
.diff{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden;margin-bottom:8px}
.diff-h{display:flex;align-items:center;gap:6px;padding:6px 9px;background:var(--surface2);font-size:11.5px}
.diff-h .f{font-family:var(--font-mono);font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diff-h .a{color:var(--green);font:10.5px/1 var(--font-mono);margin-left:auto}
.diff-h .d{color:var(--red);font:10.5px/1 var(--font-mono)}
.diff-line{display:grid;grid-template-columns:26px 12px minmax(0,1fr);font-family:var(--font-mono);font-size:11px;line-height:1.75;padding:0 0}
.diff-line .ln{text-align:right;color:var(--ink4);padding-right:6px;user-select:none;font-size:10px}
.diff-line .sg{text-align:center;user-select:none}
.diff-line .cd{overflow:hidden;text-overflow:ellipsis;white-space:pre;padding-right:8px}
.diff-line.add{background:var(--diff-add);color:var(--diff-add-ink)}
.diff-line.add .ln{color:var(--diff-add-ink);opacity:.7}
.diff-line.del{background:var(--diff-del);color:var(--diff-del-ink)}
.diff-line.del .ln{color:var(--diff-del-ink);opacity:.7}
.tree{display:grid;gap:1px;font-size:12px}
.tree-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:var(--r-xs);color:var(--ink2);width:100%;text-align:left}
.tree-row:hover{background:var(--hover)}
.tree-row.on{background:var(--surface3);color:var(--ink)}
.tree-row .n{font-family:var(--font-mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .d{margin-left:auto;font:10px/1 var(--font-mono);color:var(--ink4)}
.term{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 10px;font-family:var(--font-mono);font-size:11.5px;line-height:1.7;min-height:150px;max-height:340px;overflow:auto;white-space:pre-wrap;color:var(--ink2)}
.term .p{color:var(--accent)}
.term .ok{color:var(--green)}
.term .er{color:var(--red)}
.term-in{display:flex;gap:6px;margin-top:7px}
.term-in input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 8px;height:28px;font-family:var(--font-mono);font-size:11.5px;outline:none}
.term-in input:focus{border-color:var(--accent)}
.chat-mini{display:grid;gap:7px;margin-bottom:9px}
.bub{max-width:88%;padding:6px 10px;border-radius:var(--r-md);font-size:12px;line-height:1.55;background:var(--surface2);border:1px solid var(--line)}
.bub.me{justify-self:end;background:var(--accent);color:var(--on-accent);border-color:transparent}

/* ---------- statusbar ---------- */
.statusbar{height:var(--status);display:flex;align-items:center;gap:12px;padding:0 12px;border-top:1px solid var(--line);background:var(--bg2);font-size:10.5px;color:var(--ink3);font-family:var(--font-mono);overflow:hidden;white-space:nowrap}
.statusbar .grow{flex:1}
.statusbar b{font-weight:500;color:var(--ink2)}
.statusbar .warn{color:var(--amber)}

/* ---------- overlays ---------- */
.layer{position:fixed;inset:0;z-index:100;display:none}
.layer.on{display:block}
.layer .scrim{position:absolute;inset:0;background:rgba(16,16,14,.34);backdrop-filter:blur(1px)}
.palette{position:absolute;left:50%;top:14vh;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.palette .in{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line)}
.palette input{flex:1;border:0;background:transparent;outline:none;font-size:13.5px}
.pal-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 12px;width:100%;text-align:left;font-size:12.5px;color:var(--ink2)}
.pal-row:hover,.pal-row.sel{background:var(--accent-soft);color:var(--ink)}
.pal-row .k{font:10.5px/1 var(--font-mono);color:var(--ink4)}

  renderRail(); renderSide(); renderMain(); renderDock(); renderStatus(); renderLayer();
  if (keep){
    if (keep==='cmIn'){ var t = document.getElementById('cmIn'); if (t){ var p=S.composer; t.focus(); t.setSelectionRange(p.length,p.length); } }
    else focusKeep(keep);
  }
}
function go(p, last){
  S.page = p; S.last = last || ('切到「'+navLabel(p)+'」');
  S.sideOpen = false;
  render();
  var pw = $('#threadWrap'); if (pw && p==='chat' && S.chatTab==='dialog') pw.scrollTop = pw.scrollHeight;
}

/* ============ 事件 ============ */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  var t = el.getAttribute('data-t');
  if (act==='dummy') return;
  if (el.disabled) return;

  switch(act){
    case 'nav': go(el.getAttribute('data-k')); break;
    case 'theme': S.theme = S.theme==='dark'?'light':'dark'; S.last='切到「'+themeLabel()+'」'; render(); break;
    case 'setTheme': S.theme = el.getAttribute('data-t'); S.last='切到「'+themeLabel()+'」'; render(); break;
    case 'setDensity': S.density = el.getAttribute('data-t'); render(); toast('密度：'+(S.density==='compact'?'紧凑':'舒适')); break;
    case 'palette': S.palOpen = true; S.palQ=''; S.palIdx=0; renderLayer(); focusKeep('palQ'); break;
    case 'help': S.dlg='help'; renderLayer(); break;
    case 'layerClose': S.palOpen=false; S.dlg=null; renderLayer(); break;
    case 'sidebar':
      if (window.innerWidth<=980){ S.sideOpen = !S.sideOpen; $('#side').classList.toggle('open', S.sideOpen); }
      else { $('#app').classList.toggle('noside'); toast('侧栏收起来了，⌘B 能叫回来'); }
      break;
    case 'needToggle': S.needOpen = !S.needOpen; renderSide(); break;
    case 'needGo': {
      var n = NEEDS.filter(function(x){ return x.id===el.getAttribute('data-id'); })[0];
      if (n){ S.active = n.chat; S.chatTab='dialog'; S.page='chat'; S.last='从「需要你」跳进会话'; render();
        var wrap = $('#threadWrap'); if (wrap){ wrap.scrollTop = wrap.scrollHeight; }
        toast('跳到那条等你处理的事上');
      }
      break;
    }
    case 'wsToggle': { var id=el.getAttribute('data-id'); S.open[id] = S.open[id]===false; renderSide(); break; }
    case 'wsEdit': e.stopPropagation(); S.ws = el.getAttribute('data-id'); S.dlg='wsEdit'; renderLayer(); break;
    case 'newChat': {
      var nw = el.getAttribute('data-ws') || S.ws || 'w1';
      var nws = wsOf(nw) || WORKSPACES[0];
      S.active=null; S.page='chat'; S.chatTab='dialog'; S.composer=''; S.attach=[];
      S.newDraft = {ws:nws.id, dir:nws.dirs[0] || null};
      S.last='新建会话'; render(); break;
    }
    case 'openChat': S.active = el.getAttribute('data-id'); S.page='chat'; S.chatTab='dialog'; S.last='打开「'+(chatOf(S.active)||{}).title+'」'; render();
      var w2 = $('#threadWrap'); if (w2) w2.scrollTop = w2.scrollHeight; break;
    case 'plugOpen': {
      var p = PLUGINS.filter(function(x){ return x.id===el.getAttribute('data-id'); })[0];
      if (!p) break;
      S.pluginSel = p.id; S.page='plugin'; S.sideOpen=false;
      S.last = '打开插件「'+p.name+'」';
      render();
      toast('进到 '+p.name+' 的界面了');
      break;
    }
    case 'plugToggle': {
      var q = PLUGINS.filter(function(x){ return x.id===el.getAttribute('data-id'); })[0];
      q.on = !q.on; render(); toast(q.name+(q.on?' 已启用':' 已停用')); break;
    }
    case 'pinToggle': {
      e.stopPropagation();
      var pp = PLUGINS.filter(function(x){ return x.id===el.getAttribute('data-id'); })[0];
      pp.pin = !pp.pin; render();
      toast(pp.pin ? (pp.name+' 钉到固定了') : (pp.name+' 收进更多了'));
      break;
    }
    case 'moreToggle': S.moreOpen = !S.moreOpen; render(); break;
    case 'dirPick': S.dlg='dirPick'; S.dlgArg=null; renderLayer(); break;
    case 'dirPickChat': S.dlgArg = el.getAttribute('data-id'); S.dlg='dirPick'; renderLayer(); break;
    case 'pickWs': {
      var ctx = el.getAttribute('data-ctx'), wid = el.getAttribute('data-ws') || null;
      pickWsCtx(ctx, wid);
      S.last = wid ? '绑到工作区「'+(wsOf(wid)||{}).name+'」' : '改成不绑目录';
      render(); toast(wid ? '绑到「'+(wsOf(wid)||{}).name+'」' : '不绑目录了');
      break;
    }
    case 'pickDir': {
      var ctx2 = el.getAttribute('data-ctx'), wid2 = el.getAttribute('data-ws'), dp = el.getAttribute('data-dir');
      pickWsCtx(ctx2, wid2, dp);
      S.last = '选目录：'+shortPath(dp);
      if (S.dlg==='dirPick'){ S.dlg=null; S.dlgArg=null; }
      render(); toast('用 '+shortPath(dp));
      break;
    }
    case 'addDir': {
      var inp = document.getElementById('dirIn');
      var v = ((inp && inp.value) || '').trim();
      if (!v){ toast('先写一个目录路径'); if (inp) inp.focus(); break; }
      var ctx3 = el.getAttribute('data-ctx'), wid3 = el.getAttribute('data-ws');
      var w3 = wsOf(wid3); if (!w3) break;
      if (w3.dirs.indexOf(v) < 0) w3.dirs.push(v);
      pickWsCtx(ctx3, wid3, v);
      S.last = '加了目录 '+shortPath(v);
      if (S.dlg==='dirPick'){ S.dlg=null; S.dlgArg=null; }
      render(); toast('加进工作区并选中：'+shortPath(v));
      break;
    }
    case 'modePick': S.dlg='modePick'; S.dlgArg=null; renderLayer(); break;
    case 'pickMode': S.mode = el.getAttribute('data-k'); S.dlg=null; render(); toast('模式：'+modeLabel()); break;
    case 'modelPick': S.dlg='modelPick'; S.dlgArg=null; renderLayer(); break;
    case 'pickModel': S.model = el.getAttribute('data-k'); S.dlg=null; render(); toast('模型换成 '+S.model); break;
    case 'attachPick': S.dlg='attachPick'; S.dlgArg=null; renderLayer(); break;
    case 'attachAdd': {
      var what = el.getAttribute('data-k');
      if (S.attach.indexOf(what) < 0) S.attach.push(what);
      S.dlg=null; render(); toast('加进附件条：'+what);
      break;
    }
    case 'attachDel': S.attach.splice(+el.getAttribute('data-i'),1); render(); break;
    case 'toggleSub': S.subAgent=!S.subAgent; render(); toast('子代理 '+(S.subAgent?'开':'关')); break;
    case 'toggleDeep': S.deep=!S.deep; render(); toast('深入 '+(S.deep?'开':'关')); break;
    case 'chatMenu': {
      e.stopPropagation();
      S.dlgArg = el.getAttribute('data-id'); S.dlg='chatMenu'; renderLayer(); break;
    }
    case 'chatPin': {
      var cid = S.dlgArg, c0 = chatOf(cid);
      if (c0){
        S.chatTop[cid] = !S.chatTop[cid];
        var grp = CHATS.filter(function(x){ return x.ws===c0.ws; });
        var top = grp.filter(function(x){ return S.chatTop[x.id]; });
        var mid = grp.filter(function(x){ return !S.chatTop[x.id]; });
        CHATS = top.concat(mid, CHATS.filter(function(x){ return x.ws!==c0.ws; }));
      }
      S.dlg=null; render(); toast(S.chatTop[cid]?'置顶了':'取消置顶');
      break;
    }
    case 'chatRename': {
      S.dlgArg = el.getAttribute('data-id'); S.dlg='chatRename'; renderLayer(); focusKeep('rnIn'); break;
    }
    case 'saveRename': {
      var rnEl = document.getElementById('rnIn');
      var rv = ((rnEl && rnEl.value) || '').trim();
      var cc = chatOf(S.dlgArg);
      if (rv && cc){ cc.title = rv; toast('名字改好了'); }
      else toast('名字不能空着');
      S.dlg=null; render(); break;
    }
    case 'chatDel': {
      var delId = S.dlgArg;
      CHATS = CHATS.filter(function(x){ return x.id!==delId; });
      delete THREADS[delId];
      if (S.active===delId) S.active = (CHATS[0]||{}).id || null;
      S.dlg=null; render(); toast('删掉这个会话了（演示，不可撤销）'); break;
    }
    case 'botCard': {
      S.dlgArg = +el.getAttribute('data-i'); S.dlg='botCard'; renderLayer(); break;
    }
    case 'chatTab': {
      var k = el.getAttribute('data-k');
      if (!S.active && k!=='dialog'){ toast('新会话还没有这些记录，先发第一句'); break; }
      if (S.page!=='chat'){ S.page='chat'; }
      S.chatTab = k; S.last='切到「'+({dialog:'对话',trace:'轨迹',ctx:'上下文',team:'编队',stat:'统计'}[k])+'」';
      render(); break;
    }
    case 'fold': { var i=el.getAttribute('data-i'); S.folds[i]=!S.folds[i]; render(); break; }
    case 'tools': { var j=el.getAttribute('data-i'); S.toolsOpen[j]=!S.toolsOpen[j]; render(); break; }
    case 'crit': { var ck=el.getAttribute('data-k'); S.crit[ck]=!S.crit[ck]; render(); toast(S.crit[ck]?'勾上了':'取消勾选'); break; }
    case 'reportOpen': { var rk=el.getAttribute('data-k'); S.reportOpen[rk]=!S.reportOpen[rk]; render(); break; }
    case 'approval': {
      var ai=el.getAttribute('data-i'), v=el.getAttribute('data-v');
      S.approval[ai] = v; S.last = v==='deny'?'拒绝了一条命令':'批准了一条命令'; render();
      toast(v==='allow'?'已允许一次':v==='always'?'这类命令以后不再问':'已拒绝，没有执行');
      break;
    }
    case 'approvalReset': { S.approval[el.getAttribute('data-i')]='pending'; render(); break; }
    case 'copy': toast('复制了这一轮的正文'); break;
    case 'toast': toast(t||'原型里只做演示'); break;
    case 'dock': S.dock=!S.dock; render(); break;
    case 'dockTab': S.dockTab=el.getAttribute('data-k'); S.dock=true; S.last='右栏切到「'+({review:'审阅',files:'文件',term:'终端',tasks:'任务',side:'侧聊'}[S.dockTab])+'」'; render(); break;
    case 'fileSel': S.fileSel=+el.getAttribute('data-i'); render(); break;
    case 'stage': if(!S.diff.length){toast('没有可暂存的改动');break;} toast('全部暂存了 '+diffSum().n+' 个文件'); break;
    case 'revert': S.diff=[]; render(); toast('还原了所有改动'); break;
    case 'commit': if(!S.diff.length){toast('都提交过了');break;} S.diff=[]; render(); toast('提交了，说明留空用了默认文案'); break;
    case 'termRun': {
      var cmd = (S.termIn||'').trim(); if(!cmd) break;
      S.term.push(['p','$ '+cmd]); S.term.push(['ok', '演示模式：命令没有真的执行，退出码 0']); S.termIn=''; render();
      var o=document.getElementById('termOut'); if(o) o.scrollTop=o.scrollHeight; break;
    }
    case 'sideSend': {
      var txt=(S.sideIn||'').trim(); if(!txt) break;
      S.sideMsgs.push({me:true,t:txt}); S.sideMsgs.push({me:false,t:'（侧聊演示）这句只在这个分支里，主会话看不到。'});
      S.sideIn=''; render(); break;
    }
    case 'send': sendMsg(); break;
    case 'starter': S.composer = el.getAttribute('data-t'); S.last='挑了起手式'; render('cmIn'); break;
    case 'mcpProbe': toast('探测了一次：新起一个进程，3 个工具响应正常'); break;
    case 'mcpRestart': toast('重启了这条连接（会断开当前会话）'); break;
    case 'autoToggle': toast('启停立刻生效'); break;
    case 'setJump': toast('定位到设置里的分组'); break;
    case 'palRun': {
      var list = cmds().filter(function(c){ return !S.palQ || c.t.indexOf(S.palQ)>=0; });
      var c2 = list[+el.getAttribute('data-i')]; if (!c2) break;
      S.palOpen=false; renderLayer();
      if (c2.act==='nav') go(c2.k2);
      else if (c2.act==='plugOpen'){ S.pluginSel=c2.k2; S.page='plugin'; S.last='从命令面板打开插件'; render(); }
      else if (c2.act==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; render(); }
      else if (c2.act==='dock'){ S.dock=!S.dock; render(); }
      else if (c2.act==='newChat'){ var pw3=wsOf(S.ws)||WORKSPACES[0]; S.active=null; S.page='chat'; S.newDraft={ws:pw3.id, dir:pw3.dirs[0]||null}; render(); }
      else if (c2.act==='stage'){ toast('全部暂存了'); }
      else if (c2.act==='commit'){ S.diff=[]; render(); toast('提交了'); }
      break;
    }
  }
}, false);

function sendMsg(){
  var txt = (S.composer||'').trim();
  if (!txt && !(S.active && approvalPending())){ toast('先写点什么'); return; }
  if (!txt && S.active && approvalPending()){        // 「输入框空着按 Enter 也能允许」
    for (var k in S.approval) if (S.approval[k]==='pending'){ S.approval[k]='allow'; }
    threadOf(S.active).push({k:'bot', tx:['批准了。<span class="codec">npm run build -- --watch</span> 已经开始跑，输出在右栏「终端」。']});
    render(); toast('空着按 Enter 也算允许'); return;
  }
  if (!S.active){ createChatFromDraft(txt); return; }
  var th = threadOf(S.active);
  th.push({k:'user', t:txt, at:'刚刚'});
  th.push({k:'bot', fold:{dur:'2 秒', files:1, cmds:0},
    tx:['收到。这条在原型里不接真后端：<b>消息立刻进流</b>，任务卡、汇报卡、审批卡的口径不变。'],
    tools:[]});
  S.composer=''; S.attach=[]; S.last='发了一条消息';
  render(); toast('发出去了（演示）');
  var w=$('#threadWrap'); if(w) w.scrollTop=w.scrollHeight;
}
/* 新会话页发出第一句：把这个会话真的建出来，绑在选好的目录上 */
function createChatFromDraft(txt){
  var d = S.newDraft || {ws:null, dir:null};
  var id = 'n' + (Date.now() % 100000);
  var title = txt.length > 20 ? txt.slice(0,20)+'…' : txt;
  CHATS.unshift({id:id, ws:d.ws||null, title:title, when:'刚刚', add:0, del:0, rounds:1, steps:0, tok:'0', pct:0});
  if (d.ws && d.dir) S.chatDir[id] = d.dir;
  THREADS[id] = [
    {k:'user', t:txt, at:'刚刚'},
    {k:'bot', fold:{dur:'0.4 秒', files:0, cmds:0},
     tx:['会话建好了，放在 <b>'+esc(d.dir || '不绑目录')+'</b> 上。',
         '原型不接后端：这句只进本地演示流。要换目录点输入框那行的目录；要改名在左栏这一行点 ⋯。'], tools:[]}
  ];
  S.active = id; S.composer=''; S.attach=[]; S.page='chat'; S.chatTab='dialog';
  S.ws = d.ws || S.ws || 'w1';
  S.last = '新建会话「'+title+'」';
  render(); toast('新会话建好了');
  var w2=$('#threadWrap'); if(w2) w2.scrollTop=w2.scrollHeight;
}
function approvalPending(){
  var n=0; for (var k in S.approval) if (S.approval[k]==='pending') n++;
  return n>0;
}

document.addEventListener('input', function(e){
  var id = e.target.id;
  if (id==='cmIn'){ S.composer = e.target.value; var b=document.querySelector('[data-act="send"]'); if(b) b.disabled = !S.composer.trim(); }
  else if (id==='termIn') S.termIn = e.target.value;
  else if (id==='sideIn') S.sideIn = e.target.value;
  else if (id==='palQ'){ S.palQ = e.target.value; S.palIdx=0; renderLayer(); focusKeep('palQ'); }
}, false);

document.addEventListener('keydown', function(e){
  var meta = e.metaKey || e.ctrlKey;
  var tag = (e.target.tagName||'').toLowerCase();
  var inField = tag==='input' || tag==='textarea';
  /* 行内的小按钮（span 角色按钮）用 Enter / 空格也能开 */
  var actEl = (e.target && e.target.closest) ? e.target.closest('[data-act]') : null;
  if (actEl && actEl.tagName!=='BUTTON' && tag!=='input' && tag!=='textarea' && (e.key==='Enter' || e.key===' ')){
    e.preventDefault(); e.stopPropagation(); actEl.click(); return;
  }
  if (meta && e.key.toLowerCase()==='k'){ e.preventDefault(); S.palOpen=!S.palOpen; S.palQ=''; S.palIdx=0; renderLayer(); if(S.palOpen) focusKeep('palQ'); return; }
  if (meta && e.key.toLowerCase()==='b'){ e.preventDefault(); $('#app').classList.toggle('noside'); toast('侧栏开关'); return; }
  if (meta && e.key.toLowerCase()==='j'){ e.preventDefault(); S.dock=!S.dock; render(); return; }
  if (meta && e.key.toLowerCase()==='d'){ e.preventDefault(); S.split=!S.split; render(); toast(S.split?'进入分屏（演示）':'退出分屏'); return; }
  if (meta && e.key.toLowerCase()==='n'){ e.preventDefault();
    var nws2 = wsOf(S.ws) || WORKSPACES[0];
    S.active=null; S.page='chat'; S.chatTab='dialog'; S.composer=''; S.attach=[];
    S.newDraft = {ws:nws2.id, dir:nws2.dirs[0]||null};
    S.last='新建会话'; render(); return; }
  if (meta && e.key===','){ e.preventDefault(); go('settings'); return; }
  if (meta && e.shiftKey && e.key.toLowerCase()==='l'){ e.preventDefault(); S.theme=S.theme==='dark'?'light':'dark'; render(); return; }
  if (meta && e.key==='1'){ e.preventDefault(); go('chat'); return; }
  if (meta && e.key==='3'){ e.preventDefault(); go('automation'); return; }
  if (meta && e.key==='4'){ e.preventDefault(); go('ext'); return; }
  if (e.key==='Escape'){ if (S.palOpen||S.dlg){ S.palOpen=false; S.dlg=null; renderLayer(); } return; }
  if (!inField && e.key==='?'){ S.dlg='help'; renderLayer(); return; }
  if (S.palOpen){
    var list = cmds().filter(function(c){ return !S.palQ || c.t.indexOf(S.palQ)>=0; });
    if (e.key==='ArrowDown'){ e.preventDefault(); S.palIdx=Math.min(S.palIdx+1,list.length-1); renderLayer(); }
    else if (e.key==='ArrowUp'){ e.preventDefault(); S.palIdx=Math.max(S.palIdx-1,0); renderLayer(); }
    else if (e.key==='Enter'){ e.preventDefault(); var c3=list[S.palIdx]; if(c3){ S.palOpen=false; renderLayer(); if(c3.act==='nav') go(c3.k2); } }
    return;
  }
  if (S.dlg==='help' && e.key==='Enter'){ S.dlg=null; renderLayer(); return; }
  if (e.target.id==='termIn' && e.key==='Enter'){ document.querySelector('[data-act="termRun"]').click(); return; }
  if (e.target.id==='sideIn' && e.key==='Enter'){ document.querySelector('[data-act="sideSend"]').click(); return; }
  if (e.target.id==='cmIn'){
    if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); return; }
    if (e.key==='/' && !S.composer){ e.preventDefault(); toast('命令：/clear /compact /model /skill…'); }
  }
}, false);

/* 首次渲染 */
S.last = '打开融合版';
if (window.innerWidth <= 980){ S.dock = false; S.sideOpen = false; }
render();
(function(){ var w=$('#threadWrap'); if(w) w.scrollTop = w.scrollHeight; })();

/* 跨断点时把抽屉收起来，免得窄窗一打开就被右栏盖住 */
var _narrow = window.innerWidth <= 980;
window.addEventListener('resize', function(){
  var now = window.innerWidth <= 980;
  if (now !== _narrow){
    _narrow = now;
    S.dock = !now;
    S.sideOpen = false;
    $('#side').classList.remove('open');
    render();
  }
});
</script>
