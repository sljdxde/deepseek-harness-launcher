<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>dsh · 新界面融合版（现有外壳 + 工作台密度）</title>
<style>
/* ---------- tokens ---------- */
:root{
  --rail:56px; --side:272px; --dock-w:384px; --status:26px;
  --font-cjk:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --font:'Inter Variable','Inter',-apple-system,'Segoe UI Variable Text','Segoe UI',var(--font-cjk),system-ui,sans-serif;
  --font-mono:'JetBrains Mono Variable','JetBrains Mono','Cascadia Code','SF Mono',Menlo,Consolas,var(--font-cjk),monospace;
  --r-xs:6px; --r-sm:8px; --r:10px; --r-md:12px; --r-lg:12px; --r-xl:12px;
  --ease:cubic-bezier(.32,.72,0,1);
  --fast:.12s; --mid:.18s;
  --pad:16px; --gap:10px;
  --shadow:0 18px 44px rgba(24,20,12,.16),0 2px 6px rgba(24,20,12,.08);
  scrollbar-width:thin; scrollbar-color:var(--line2) transparent;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f1e9; --bg2:#eeeae0; --panel:#faf8f3; --surface:#fffdf8; --surface2:#f1ede3; --surface3:#e6e1d3;
  --line:rgba(27,28,25,.10); --line2:rgba(27,28,25,.18);
  --ink:#1b1c19; --ink2:#4c4d46; --ink3:#615f56; --ink4:#67645a;
  --accent:#3a55c8; --accent-soft:rgba(58,85,200,.10); --on-accent:#fff;
  --amber:#7a4d12; --amber-soft:rgba(150,96,26,.12);
  --green:#2c7458; --green-soft:rgba(44,116,88,.12);
  --red:#ab3f36; --red-soft:rgba(171,63,54,.12);
  --code-bg:#f6f2e8; --diff-add:#e9f3ea; --diff-add-ink:#256244; --diff-del:#fbecea; --diff-del-ink:#9c4338;
  --hover:rgba(27,28,25,.055); --hover2:rgba(27,28,25,.09); --sel:rgba(38,49,72,.06);
  --tip:#2c2c2e; --tip-ink:#fff;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121316; --bg2:#15171a; --panel:#17191e; --surface:#1b1d21; --surface2:#22252a; --surface3:#2b2e34;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --ink:#edebe3; --ink2:#b8b6ac; --ink3:#a5a399; --ink4:#9a978c;
  --accent:#93a8ff; --accent-soft:rgba(147,168,255,.13); --on-accent:#101216;
  --amber:#f0bd85; --amber-soft:rgba(224,167,106,.14);
  --green:#5ec9a6; --green-soft:rgba(94,201,166,.14);
  --red:#f18c81; --red-soft:rgba(241,140,129,.14);
  --code-bg:#14161a; --diff-add:rgba(94,201,166,.10); --diff-add-ink:#7fd8b8; --diff-del:rgba(241,140,129,.10); --diff-del-ink:#f0a79e;
  --hover:rgba(255,255,255,.06); --hover2:rgba(255,255,255,.10); --sel:rgba(255,255,255,.08);
  --tip:#33363c; --tip-ink:#f4f2ec;
  --shadow:0 22px 52px rgba(0,0,0,.52),0 2px 8px rgba(0,0,0,.38);
}
html[data-density="compact"]{ --pad:10px; --gap:6px; }

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink3)}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:16px;height:16px;flex:0 0 auto;stroke-width:1.7}

/* ---------- app grid ---------- */
.app{display:grid;grid-template-columns:var(--rail) var(--side) minmax(0,1fr) var(--dock-w);height:calc(100vh - var(--status))}
.app.nodock{grid-template-columns:var(--rail) var(--side) minmax(0,1fr) 0}
.app.noside{grid-template-columns:var(--rail) 0 minmax(0,1fr) var(--dock-w)}

/* ---------- rail ---------- */
.rail{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;overflow:visible;z-index:30}
.rail .spacer{flex:1}
.rail-btn{width:38px;height:38px;border-radius:var(--r);color:var(--ink3);display:grid;place-items:center;position:relative;transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
.rail-btn:hover{background:var(--hover);color:var(--ink)}
.rail-btn.on{background:var(--surface3);color:var(--ink)}
.rail-btn.on::before{content:"";position:absolute;left:-9px;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--accent)}
.rail-btn svg.ic{width:20px;height:20px}
.rail-badge{position:absolute;top:4px;right:4px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--on-accent);font:11px/1.5px var(--font-mono);text-align:center;padding:0 3px}
.rail-tip{position:absolute;left:calc(100% + 9px);top:50%;transform:translateY(-50%) translateX(-3px);padding:4px 8px;border-radius:var(--r-xs);background:var(--tip);color:var(--tip-ink);font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;z-index:90;transition:opacity var(--fast) var(--ease),transform var(--fast) var(--ease);box-shadow:0 8px 22px rgba(0,0,0,.26)}
.rail-btn:hover .rail-tip,.rail-btn:focus-visible .rail-tip{opacity:1;transform:translateY(-50%)}
.rail-sep{width:22px;height:1px;background:var(--line);margin:6px 0}
.rail-logo{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-bottom:8px;flex:0 0 auto}
.rail-logo svg.ic{width:16px;height:16px;stroke-width:1.7}
.rail-av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:600;margin-top:4px}

/* ---------- side ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;overflow:hidden}
.side-h{display:flex;align-items:center;gap:8px;padding:12px 12px 6px 16px;min-height:44px}
.side-h h2{font-size:14px;font-weight:600;letter-spacing:.2px}
.side-h .cnt{font:11px/1 var(--font-mono);color:var(--ink3);padding:3px 5px;border-radius:var(--r-xs);background:var(--surface2)}
.side-h .icon-btn{margin-left:auto}
.side-scroll{padding:0 8px 12px;overflow-y:auto;overscroll-behavior:contain}
.side-scroll::-webkit-scrollbar{width:8px}
.side-scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px;border:2px solid transparent;background-clip:content-box}
.side-foot{border-top:1px solid var(--line);padding:8px 12px;display:grid;gap:6px;background:var(--panel)}
.icon-btn{width:26px;height:26px;border-radius:var(--r-xs);display:grid;place-items:center;color:var(--ink3);transition:background var(--fast) var(--ease),color var(--fast) var(--ease);flex:0 0 auto}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg.ic{width:16px;height:16px}

.sec{margin-top:12px}
.sec-h{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.4px}
.sec-h .kbd{margin-left:auto}
.sec-h .n{font:11px/1 var(--font-mono);color:var(--ink4)}
.sec-h button{color:var(--ink3);display:grid;place-items:center;width:20px;height:20px;border-radius:6px}
.sec-h button:hover{background:var(--hover);color:var(--ink)}

/* 需要你 */
.need-wrap{margin:4px 0 6px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.need-h{display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:12px;font-weight:600;color:var(--ink2);width:100%;text-align:left}
.need-h:hover{background:var(--hover)}
.need-h .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:0 0 auto}
.need-h .n{margin-left:auto;font:11px/1 var(--font-mono);color:var(--amber);background:var(--amber-soft);padding:2px 5px;border-radius:6px}
.need-row{display:grid;grid-template-columns:12px minmax(0,1fr);gap:6px;padding:7px 9px 8px;border-top:1px solid var(--line);width:100%;text-align:left;align-items:start}
.need-row:hover{background:var(--hover)}
.need-row .bd{width:5px;height:5px;border-radius:50%;background:var(--amber);margin-top:6px}
.need-row .t{font-size:13px;line-height:1.4;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.need-row .s{font-size:11px;color:var(--ink3);margin-top:1px;display:flex;gap:5px;align-items:center}
.need-acts{grid-column:2;display:flex;gap:4px;margin-top:5px}

/* workspace */
.ws{margin:1px 0}
.ws-row{display:flex;align-items:center;gap:2px;padding:0;border-radius:var(--r-sm);width:100%;color:var(--ink2)}
.ws-main{display:flex;align-items:center;gap:7px;flex:1;min-width:0;padding:6px 8px;border-radius:var(--r-sm);background:none;border:0;font:inherit;color:inherit;text-align:left}
.ws-acts{display:none;gap:1px;padding-right:4px}
.ws-row:hover .ws-acts,.ws-row:focus-within .ws-acts{display:flex}
.ws-row:hover{background:var(--hover);color:var(--ink)}
.ws-row .caret{transition:transform var(--fast) var(--ease);color:var(--ink4)}
.ws-row.open .caret{transform:rotate(90deg)}
.ws-row .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-row .n{font:11px/1 var(--font-mono);color:var(--ink4)}
.ws-dirs{padding:2px 8px 6px 26px;display:grid;gap:2px}
.ws-dir{font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:5px;align-items:center}
.ws-dir svg.ic{width:12px;height:12px;color:var(--ink4)}

.chat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 6px;padding:0;border-radius:var(--r-sm);width:100%;position:relative}
.row-open{display:flex;align-items:center;min-width:0;padding:6px 0 0 10px;background:none;border:0;font:inherit;color:inherit;text-align:left}
.row-tail{display:flex;align-items:center;gap:2px;padding:6px 8px 0 0}
.chat-row:hover{background:var(--hover)}
.chat-row.on{background:var(--accent-soft)}
.chat-row.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent)}
.chat-row .t{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-row .m{font:11px/1.4 var(--font-mono);color:var(--ink4);white-space:nowrap;display:flex;align-items:center;gap:3px}
.pin{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:none;border:0;padding:0;color:var(--ink4);opacity:0;transition:opacity var(--fast) var(--ease),background var(--fast) var(--ease),color var(--fast) var(--ease)}
.pin svg.ic{width:12px;height:12px}
.chat-row:hover .pin,.chat-row:focus-within .pin,.pin:focus-visible{opacity:1}
.pin.on{opacity:1;color:var(--accent)}
.pin:hover{background:var(--hover2);color:var(--accent)}
.chat-row>.git,.chat-row>.sub{margin-left:10px}
.chat-row .git{display:flex;gap:4px;font:11px/1 var(--font-mono);grid-column:1;margin-top:1px}
.git-add{color:var(--green)} .git-del{color:var(--red)}
.chat-row .sub{grid-column:1;font-size:11px;color:var(--ink4);display:flex;gap:6px;align-items:center;margin-top:1px}

.side-new{display:flex;align-items:center;gap:7px;width:100%;padding:7px 9px;margin:4px 0 2px;border:1px dashed var(--line2);border-radius:var(--r-sm);color:var(--ink2);font-size:13px}
.side-new:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.side-new .kbd{margin-left:auto}

.kbd{font:11px/1 var(--font-mono);color:var(--ink3);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 5px;white-space:nowrap}
.chip .kbd{background:transparent;border-color:transparent;padding:0 0 0 2px;color:var(--ink4)}

.stack{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.stack .ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface3) 0);display:grid;place-items:center;font:11px/1 var(--font-mono);color:var(--ink2);position:relative}
.stack .ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--panel)}
.stack .ring b{position:relative;z-index:1;font-weight:600}
.stack .lbl{display:grid;line-height:1.25}}
.stack .lbl b{font-size:12px;font-weight:500;color:var(--ink2)}
.stack .lbl span{font:11px/1.25 var(--font-mono);color:var(--ink4)}

/* ---------- main ---------- */
.main{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-width:0;background:var(--bg);overflow:hidden}
.main>.topbar{grid-row:1}
.main>.tabs{grid-row:2}
.main>.thread-wrap{grid-row:3;min-height:0}
.main>.page{grid-row:2/-1;min-height:0}
.main>.tabs+.page{grid-row:3}
.main>.composer{grid-row:4}
.composer-stack{grid-row:4;display:flex;flex-direction:column;min-height:0}
.split-grid{display:grid;gap:1px;background:var(--line);min-height:0;overflow:hidden}
.split-grid>.pane{overflow-y:auto;min-width:0;background:var(--bg);scrollbar-gutter:stable}
.split-grid>.pane .page{overflow:visible;padding:14px}
.approval-dock{border-top:1px solid var(--amber);background:var(--amber-soft);padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.approval-dock .ad-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.approval-dock .ad-main b{font-size:12px;color:var(--amber)}
.approval-dock .ad-main code{font-family:var(--font-mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.approval-dock .ad-acts{display:flex;gap:4px;flex-wrap:wrap}
.run-strip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
.run-strip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
.queue-zone{border-top:1px solid var(--line);padding:6px 12px 2px;display:grid;gap:4px}
.queue-card{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r-sm);padding:5px 8px}
.queue-card .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-card .acts{display:flex;gap:2px}
.dock-handle{position:absolute;left:0;top:0;bottom:0;width:5px;cursor:col-resize;z-index:6}
.dock-handle:hover{background:var(--accent-soft)}
.dock{position:relative}
.set-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.set-tab{padding:8px 10px;font-size:12px;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap}
.set-tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.ov-row{display:flex;gap:6px;align-items:center;padding:2px 8px 6px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.ov-chip{display:inline-flex;gap:4px;align-items:center;padding:2px 6px;border-radius:999px;background:var(--surface2);border:0;font:inherit;color:inherit;cursor:pointer}
.ov-chip b{font-weight:600;color:var(--ink2)}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.topbar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);min-height:46px;background:var(--bg);flex-wrap:nowrap;overflow:hidden}
.topbar .ttl{font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch;display:flex;gap:6px;align-items:center;min-width:0;flex:0 1 auto}
.topbar .ttl .sep{color:var(--ink4)}
.topbar .crumb{color:var(--ink3);font-weight:400;white-space:nowrap;flex:0 0 auto}
.topbar .tl-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;flex:0 0 auto;padding:0 8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink2);font-size:12px;white-space:nowrap;transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),color var(--fast) var(--ease)}
.chip:hover{border-color:var(--line2);color:var(--ink);background:var(--surface2)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip svg.ic{width:14px;height:14px}
.chip.demo{background:var(--amber-soft);border-color:transparent;color:var(--amber);font-size:11px}
.chip.git{font-family:var(--font-mono);font-size:11px;gap:6px}

/* page */
.page{overflow-y:auto;padding:calc(var(--pad) + 6px) var(--pad) 24px;scrollbar-gutter:stable}
.page::-webkit-scrollbar{width:10px}
.page::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid transparent;background-clip:content-box}
.page-h{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.page-h h1{font-size:20px;font-weight:600;letter-spacing:-.2px}
.page-h p{font-size:13px;color:var(--ink3);max-width:62ch;margin-bottom:2px}
.page-h .acts{margin-left:auto;display:flex;gap:6px}

.btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink2);font-size:12px;white-space:nowrap;transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),color var(--fast) var(--ease)}
.btn:hover{background:var(--surface2);color:var(--ink);border-color:var(--line2)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:24px;padding:0 8px;font-size:12px;border-radius:var(--r-xs)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg.ic{width:14px;height:14px}
.btn.danger{color:var(--red)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px}
.card.dashed{border-style:dashed;border-color:var(--line2);background:transparent}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.col-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);margin:6px 0 8px}
.col-h .dot{width:6px;height:6px;border-radius:50%}
.col-h .n{font:11px/1 var(--font-mono);color:var(--ink4);margin-left:2px}
.col-h.need .dot{background:var(--amber)} .col-h.run .dot{background:var(--accent)} .col-h.idle .dot{background:var(--line2)}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 10px;margin-bottom:8px;transition:border-color var(--fast) var(--ease)}
.mini:hover{border-color:var(--line2)}
.mini .t{font-size:13px;line-height:1.4}
.mini .s{font-size:11px;color:var(--ink3);display:flex;gap:5px;align-items:center;margin-top:2px;flex-wrap:wrap}
.mini .s svg.ic{width:12px;height:12px}
.mini .acts{display:flex;gap:4px;margin-top:7px}
.bar{height:4px;border-radius:2px;background:var(--surface3);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s var(--ease)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--ink3);display:inline-flex;gap:3px;align-items:center}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.err{background:var(--red-soft);color:var(--red)}
.tag.wait{background:var(--amber-soft);color:var(--amber)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}

/* plugin cards */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:10px}
.pcard{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:9px;align-items:center;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);text-align:left;transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
.pcard:hover{border-color:var(--line2);background:var(--surface2)}
.pico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.pico.own{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pico svg.ic{width:16px;height:16px}
.pcard .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;line-height:1.4}}
.pcard .v{display:block;font-size:11px;color:var(--ink4);font-variant-numeric:tabular-nums;line-height:1.5}}
.pcard .d{display:block;font-size:11px;color:var(--ink3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .go{color:var(--ink4)}
.pcard:hover .go{color:var(--accent)}
.ic.flip{transform:scaleX(-1)}

/* 更多：默认折叠，点标题展开 */
.sec-tog{display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px;border-radius:var(--r-xs);font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.4px;text-align:left;transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
.sec-tog:hover{background:var(--hover);color:var(--ink2)}
.sec-tog .caret{color:var(--ink4);transition:transform var(--fast) var(--ease)}
.sec-tog.open .caret{transform:rotate(90deg)}
.sec-tog .n{font:11px/1 var(--font-mono);color:var(--ink4);margin-left:2px}
.sec-tog .hint{margin-left:auto;font-size:11px;font-weight:400;letter-spacing:0;color:var(--ink3)}
.sec-empty{padding:3px 8px 9px;font-size:11px;color:var(--ink3)}

/* 目录选择 */
.dsel{display:grid;gap:6px;width:100%;max-width:460px;margin-top:4px;text-align:left}
.dsel .cap{font-size:11px;color:var(--ink3)}
.dsel-ws{display:flex;gap:6px;flex-wrap:wrap}
.dchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--ink2);transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),color var(--fast) var(--ease)}
.dchip:hover{border-color:var(--line2);color:var(--ink)}
.dchip.on{border-color:transparent;background:var(--accent-soft);color:var(--accent);font-weight:500}
.dchip svg.ic{width:14px;height:14px}
.dchip .k{font:11px/1 var(--font-mono);opacity:.65}
.dlist{display:grid;gap:4px}
.drow{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:7px;align-items:center;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:12px;color:var(--ink2);width:100%;text-align:left;transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),color var(--fast) var(--ease)}
.drow:hover{border-color:var(--line2);color:var(--ink)}
.drow.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drow svg.ic{width:14px;height:14px}
.drow .p{font-family:var(--font-mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .k{font:11px/1 var(--font-mono);color:var(--ink4)}
.drow.on .k{color:var(--accent)}

/* 输入框上方的附件条 */
.attach{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 7px}
.atch{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 3px 0 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:11px;color:var(--ink2)}
.atch svg.ic{width:12px;height:12px;color:var(--ink4)}
.atch b{font:11px/1 var(--font-mono);font-weight:500}
.atch button{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:var(--ink4)}
.atch button:hover{background:var(--hover2);color:var(--ink)}
.atch button svg.ic{width:12px;height:12px}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:500}
.pill.dim{color:var(--ink3);background:transparent;border-style:dashed;cursor:default}
.pill.dim:hover{border-color:var(--line);color:var(--ink3)}

/* 插件详情 */
.phead{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.phead .pico{width:44px;height:44px;border-radius:12px}
.phead .pico svg.ic{width:22px;height:22px}
.phead h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.4}}
.phead .meta{font:12px/1.5 var(--font-mono);color:var(--ink3);margin-top:3px;overflow-wrap:anywhere}
.phead .d{font-size:12px;color:var(--ink3);margin-top:3px}
.pdetail{display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:12px;align-items:start}
.slot{border:1px dashed var(--line2);border-radius:var(--r-lg);padding:12px}
.slot-h{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);margin-bottom:9px}
.slot-h .tag{margin-left:auto}
.pnote{font-size:11px;color:var(--ink3);margin-top:9px;line-height:1.5}
.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.botc{display:grid;gap:3px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);text-align:left;transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
.botc:hover{border-color:var(--line2);background:var(--surface2)}
.botc .n{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.botc .n svg.ic{width:13px;height:13px;color:var(--ink3)}
.botc .n .tag{margin-left:auto}
.botc .s{font-size:11px;color:var(--ink3)}
.botc .t{font:11px/1.4 var(--font-mono);color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 小菜单 / 行内输入 */
.mlist{display:grid;gap:2px}
.mitem{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:8px 9px;border-radius:var(--r-sm);font-size:13px;color:var(--ink2);text-align:left}
.mitem:hover{background:var(--hover);color:var(--ink)}
.mitem svg.ic{width:14px;height:14px;color:var(--ink3)}
.mitem .k{font:11px/1 var(--font-mono);color:var(--ink3)}
.mitem.danger{color:var(--red)}
.mitem.danger:hover{background:var(--red-soft)}
.mitem.danger svg.ic{color:var(--red)}
.fld{display:grid;gap:6px}
.fld label{font-size:12px;color:var(--ink3)}
.fld input{height:32px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:0 9px;font-size:13px;outline:none}
.fld input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (max-width:1080px){ .pdetail{grid-template-columns:minmax(0,1fr)} }

/* thread */
.thread-wrap{overflow-y:auto;padding:14px 0 8px;scrollbar-gutter:stable}
.thread-wrap::-webkit-scrollbar{width:10px}
.thread-wrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid transparent;background-clip:content-box}
.thread{max-width:740px;margin:0 auto;padding:0 20px;display:grid;gap:14px}
.turn{display:grid;gap:10px}
.msg-user{justify-self:end;max-width:82%;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 4px var(--r-lg);padding:9px 13px;font-size:13px;line-height:1.5}
.msg-user .stamp{font:11px/1 var(--font-mono);color:var(--ink4);margin-top:5px;text-align:right}
.msg-bot{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
.msg-bot>.who{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin-top:1px;flex:0 0 auto}
.msg-bot>.who svg.ic{width:13px;height:13px;stroke-width:1.7}
.msg-bot .bd{min-width:0}
.msg-bot .hd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-bottom:4px}
.msg-bot .hd b{color:var(--ink2);font-weight:600;font-size:12px}
.msg-bot .tx{font-size:13px;line-height:1.5;color:var(--ink)}
.msg-bot .tx p+p{margin-top:8px}
.msg-bot .tx ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
.msg-bot .tx b{font-weight:600}
.msg-bot .tx code,.codec{font-family:var(--font-mono);font-size:12px;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:1px 5px;white-space:nowrap}
.msg-acts{display:flex;gap:2px;margin-top:4px;opacity:0;transition:opacity var(--fast) var(--ease)}
.msg-bot:hover .msg-acts,.msg-bot:focus-within .msg-acts,.msg-acts:focus-within{opacity:1}
@media (hover:none){.pin,.ws-row .more,.msg-acts{opacity:1}}
.is-stub{cursor:help;border-style:dashed}
.is-stub.btn.primary,.is-stub.btn{background:var(--surface2);color:var(--ink2);border:1px dashed var(--line2)}

/* fold line */
.fold{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);padding:3px 7px;border-radius:var(--r-xs);margin:2px 0 2px -2px}
.fold:hover{background:var(--hover);color:var(--ink2)}
.fold svg.ic{width:12px;height:12px;transition:transform var(--fast) var(--ease)}
.fold.open svg.ic{transform:rotate(90deg)}
.fold .d{color:var(--ink4)}

/* tools */
.tools{margin:6px 0 2px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.tools-h{display:flex;align-items:center;gap:7px;padding:7px 10px;font-size:12px;color:var(--ink2);width:100%;text-align:left}
.tools-h:hover{background:var(--hover)}
.tools-h .n{color:var(--ink4);font-family:var(--font-mono);font-size:11px}
.tool-row{display:grid;grid-template-columns:18px 52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);font-size:12px}
.tool-row .k{color:var(--ink3);font-family:var(--font-mono);font-size:11px;text-transform:none}
.tool-row .c{font-family:var(--font-mono);font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-row .d{font:11px/1 var(--font-mono);color:var(--ink4)}
.tool-row svg.ic{width:13px;height:13px;color:var(--ink4)}
.tool-row.bad .c{color:var(--red)}

/* plan card */
.plan{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:11px 12px;margin:8px 0 0}
.plan-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.plan-h .kbd{margin-left:auto}
.plan-step{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.plan-step .no{width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font:11px/1 var(--font-mono);color:var(--ink3)}
.plan-step .no svg.ic{width:12px;height:12px}
.plan-step.done .no{background:var(--green-soft);border-color:transparent;color:var(--green)}
.plan-step.doing .no{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.plan-step.doing .nm{color:var(--ink);font-weight:500}
.plan-step .nm{color:var(--ink2)}
.plan-step.next .nm{color:var(--ink3)}

/* bot cards: task / report / changed / approval */
.bcard{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;margin:2px 0}
.bcard-h{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink3)}
.bcard-h .who{color:var(--ink2);font-weight:600;white-space:nowrap;flex:0 0 auto}
.bcard-h .chg-sum{white-space:nowrap;flex:0 0 auto}
.bcard-h .r{margin-left:auto;display:flex;gap:5px;align-items:center}
.bcard-b{padding:11px 12px}
.bcard-b h4{font-size:14px;font-weight:600;margin-bottom:4px}
.bcard-b .sub{font-size:12px;color:var(--ink3)}
.report-tag{font:11px/1 var(--font-mono);letter-spacing:.4px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:3px 5px}
.prog-row{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px;color:var(--ink3)}
.prog-row .bar{flex:1;margin:0}
.crit{display:grid;gap:2px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.crit label{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:32px;padding:2px 0;font-size:12px;color:var(--ink2);cursor:pointer}
.crit input{appearance:none;width:18px;height:18px;border:1.5px solid var(--line2);border-radius:4px;display:grid;place-items:center;margin:0}
.crit input:checked{background:var(--accent);border-color:transparent}
.crit input:checked::after{content:"";width:6px;height:6px;border-radius:2px;background:var(--on-accent)}
.crit .who{font:11px/1 var(--font-mono);color:var(--ink4)}
.dyn{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3);display:grid;gap:3px}
.dyn b{color:var(--ink4);font:11px/1 var(--font-mono);font-weight:500;letter-spacing:.4px}
.chg-row{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;font-size:12px;border-bottom:1px solid var(--line)}
.chg-row:last-child{border-bottom:0}
.chg-row .f{font-family:var(--font-mono);font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chg-row svg.ic{width:14px;height:14px;color:var(--ink4)}
.chg-sum{font:11px/1 var(--font-mono);color:var(--ink4)}
.appr{border:1px solid var(--amber-soft);background:linear-gradient(0deg,var(--amber-soft),var(--amber-soft)),var(--surface);border-radius:var(--r-lg);overflow:hidden}
.appr-h{display:flex;align-items:center;gap:7px;padding:8px 12px;font-size:12px;color:var(--amber);font-weight:600;border-bottom:1px solid var(--amber-soft)}
.appr-b{padding:11px 12px}
.appr-b .cmd{font-family:var(--font-mono);font-size:12px;background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;margin:7px 0;overflow-x:auto;white-space:pre;color:var(--ink)}
.appr-b .why{font-size:12px;color:var(--ink2);line-height:1.5}
.appr-b .hint{font-size:11px;color:var(--ink4);margin-top:8px}
.appr-acts{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}
.appr.done{background:var(--surface);border-color:var(--line)}
.appr.done .appr-h{color:var(--green);border-color:var(--line)}
.appr.done .appr-b .hint{margin-top:6px}

/* empty state */
.empty{display:grid;justify-items:center;gap:10px;place-content:center;min-height:100%;padding:24px;text-align:center}
.empty .plus{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty h2{font-size:20px;font-weight:600}
.empty p{font-size:13px;color:var(--ink3);max-width:40ch}
.starters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:5px;width:100%;max-width:440px}
.starter{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:13px;color:var(--ink2);text-align:left;transition:border-color var(--fast) var(--ease)}
.starter:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.starter svg.ic{width:15px;height:15px;color:var(--ink3)}
.starter:hover svg.ic{color:var(--accent)}
.hintline{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink4);flex-wrap:wrap;justify-content:center}

/* tabs */
.tabs{display:flex;align-items:center;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg);scrollbar-width:none}
.tablist{display:flex;align-items:center;gap:2px;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:5px;padding:9px 8px;font-size:13px;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap;transition:color var(--fast) var(--ease)}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tab .n{font:11px/1 var(--font-mono);background:var(--surface3);color:var(--ink3);border-radius:6px;padding:2px 4px}

/* composer */
.composer{padding:8px 14px 12px;border-top:1px solid var(--line);background:var(--bg)}
.cm-pills{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--ink2)}
.pill:hover{border-color:var(--line2);color:var(--ink)}
.pill svg.ic{width:14px;height:14px}
.pill.warn{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.cm-box{border:1px solid var(--line2);border-radius:var(--r-lg);background:var(--surface);padding:9px 10px 8px;transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
.cm-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cm-box textarea{width:100%;border:0;background:transparent;resize:none;font-size:13px;line-height:1.5;min-height:40px;max-height:160px;outline:none;display:block;padding:2px 2px 6px}
.cm-box textarea::placeholder{color:var(--ink4)}
.cm-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cm-row .sep{width:1px;height:16px;background:var(--line)}
.cm-meta{margin-left:auto;display:flex;align-items:center;gap:8px;font:11px/1 var(--font-mono);color:var(--ink4)}
.cm-modelwrap{display:inline-flex;align-items:center;gap:2px;margin-left:2px;flex:0 0 auto}
.cm-row .grow{flex:1 1 auto}
.cm-row .cm-meta{margin-right:4px}
.cm-t{border:0;background:none;padding:2px 3px;border-radius:6px;font:inherit;font-size:13px;color:var(--ink3);cursor:pointer;white-space:nowrap}
.cm-t:hover{background:var(--hover2);color:var(--ink2)}
.cm-t.lev{color:var(--ink4)}
.cm-t.chev{width:24px;height:24px;padding:0;display:grid;place-items:center;color:var(--ink4)}
.cm-t.chev svg.ic{width:14px;height:14px}
.pop{position:fixed;z-index:130;min-width:240px;max-width:360px;max-height:56vh;overflow:auto;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.16);-webkit-backdrop-filter:blur(2px)}
.pop[hidden]{display:none}
.pop-search{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid var(--line);margin:-2px -2px 6px}
.pop-search svg.ic{width:14px;height:14px;color:var(--ink4)}
.pop-search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:13px;color:var(--ink);outline:none}
.pop-g{padding:6px 8px 2px;font-size:11px;color:var(--ink4)}
.pop-item{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:0 8px;border:0;border-radius:8px;background:none;font:inherit;font-size:13px;color:var(--ink);text-align:left;cursor:pointer}
.pop-item:hover,.pop-item:focus-visible{background:var(--hover2)}
.pop-item .chk{margin-left:auto;color:var(--accent);display:grid;place-items:center}
.pop-item .chk svg.ic{width:16px;height:16px}
.send{width:30px;height:30px;border-radius:var(--r-sm);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transition:filter var(--fast) var(--ease),opacity var(--fast) var(--ease)}
.send svg.ic{width:16px;height:16px;stroke-width:1.7}
.send:hover{filter:brightness(1.08)}
.send[disabled]{opacity:.38;cursor:not-allowed}

/* ---------- dock ---------- */
.dock{background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;overflow:hidden}
.dock-h{display:flex;align-items:center;gap:1px;padding:4px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.dock-h::-webkit-scrollbar{display:none}
.dtab{display:inline-flex;align-items:center;gap:4px;padding:8px 7px;font-size:12px;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap}
.dtab:hover{color:var(--ink)}
.dtab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.dtab .n{font:11px/1 var(--font-mono);background:var(--surface3);border-radius:4px;padding:2px 3px;color:var(--ink3)}
.dock-b{overflow-y:auto;padding:10px 12px;scrollbar-gutter:stable}
.dock-b::-webkit-scrollbar{width:9px}
.dock-b::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid transparent;background-clip:content-box}
.dock-f{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;align-items:center;background:var(--panel)}
.dock-sum{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);padding:2px 2px 9px}
.dock-sum .g{font:11px/1 var(--font-mono);color:var(--ink4)}
.dock-sum .cg{font:11px/1 var(--font-mono);color:var(--ink4);margin-left:auto;display:flex;gap:6px}
.diff{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden;margin-bottom:8px}
.diff-h{display:flex;align-items:center;gap:6px;padding:6px 9px;background:var(--surface2);font-size:12px}
.diff-h .f{font-family:var(--font-mono);font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diff-h .a{color:var(--green);font:11px/1 var(--font-mono);margin-left:auto}
.diff-h .d{color:var(--red);font:11px/1 var(--font-mono)}
.diff-line{display:grid;grid-template-columns:26px 12px minmax(0,1fr);font-family:var(--font-mono);font-size:11px;line-height:1.7;padding:0 0}
.diff-line .ln{text-align:right;color:var(--ink4);padding-right:6px;user-select:none;font-size:11px}
.diff-line .sg{text-align:center;user-select:none}
.diff-line .cd{overflow:hidden;text-overflow:ellipsis;white-space:pre;padding-right:8px}
.diff-line.add{background:var(--diff-add);color:var(--diff-add-ink)}
.diff-line.add .ln{color:var(--diff-add-ink);opacity:.7}
.diff-line.del{background:var(--diff-del);color:var(--diff-del-ink)}
.diff-line.del .ln{color:var(--diff-del-ink);opacity:.7}
.tree{display:grid;gap:1px;font-size:12px}
.tree-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:var(--r-xs);color:var(--ink2);width:100%;text-align:left}
.tree-row:hover{background:var(--hover)}
.tree-row.on{background:var(--surface3);color:var(--ink)}
.tree-row .n{font-family:var(--font-mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .d{margin-left:auto;font:11px/1 var(--font-mono);color:var(--ink4)}
.term{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 10px;font-family:var(--font-mono);font-size:12px;line-height:1.7;;min-height:150px;max-height:340px;overflow:auto;white-space:pre-wrap;color:var(--ink2)}
.term .p{color:var(--accent)}
.term .ok{color:var(--green)}
.term .er{color:var(--red)}
.term-in{display:flex;gap:6px;margin-top:7px}
.term-in input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 8px;height:28px;font-family:var(--font-mono);font-size:12px;outline:none}
.term-in input:focus{border-color:var(--accent)}
.chat-mini{display:grid;gap:7px;margin-bottom:9px}
.bub{max-width:88%;padding:6px 10px;border-radius:var(--r-md);font-size:12px;line-height:1.5;background:var(--surface2);border:1px solid var(--line)}
.bub.me{justify-self:end;background:var(--accent);color:var(--on-accent);border-color:transparent}

/* ---------- statusbar ---------- */
.statusbar{height:var(--status);display:flex;align-items:center;gap:12px;padding:0 12px;border-top:1px solid var(--line);background:var(--bg2);font-size:11px;color:var(--ink3);font-family:var(--font-mono);overflow:hidden;white-space:nowrap}
.statusbar .grow{flex:1}
.statusbar b{font-weight:500;color:var(--ink2)}
.statusbar .warn{color:var(--amber)}

/* ---------- overlays ---------- */
dialog#dlg{width:min(520px,calc(100vw - 28px));max-height:84vh;padding:0;margin:auto;border:1px solid var(--line2);border-radius:var(--r-lg);background:var(--panel);color:var(--ink);box-shadow:var(--shadow);overflow:hidden}
dialog#dlg[open]{display:flex;flex-direction:column}
dialog#dlg:modal{overscroll-behavior:contain}
dialog#dlg::backdrop{background:rgba(16,16,14,.34);backdrop-filter:blur(1px);overflow:hidden;overscroll-behavior:contain}
dialog#palette{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;color:var(--ink)}
dialog#palette::backdrop{background:transparent}
.pal-wrap{position:absolute;inset:0;background:rgba(16,16,14,.34);backdrop-filter:blur(1px)}
.palette{position:absolute;left:50%;top:14vh;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.palette .in{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line)}
.palette input{flex:1;border:0;background:transparent;outline:none;font-size:14px}
.pal-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 12px;width:100%;text-align:left;font-size:13px;color:var(--ink2)}
.pal-row:hover,.pal-row.sel{background:var(--accent-soft);color:var(--ink)}
.pal-row .k{font:11px/1 var(--font-mono);color:var(--ink4)}
.palette .foot{padding:7px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--ink4);display:flex;gap:10px;font-family:var(--font-mono)}
.dlg{display:flex;flex-direction:column;min-height:0;max-height:calc(84vh - 2px);overflow:hidden}
.dlg-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:14px;font-weight:600;margin:0}
.dlg-b{padding:14px;overflow:auto;display:grid;gap:12px}
.dlg-f{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--surface)}
.visually-hidden:where(:not(:focus-within,:active)){position:absolute!important;clip-path:inset(50%)!important;overflow:hidden!important;width:1px!important;height:1px!important;margin:-1px!important;padding:0!important;border:0!important;white-space:nowrap!important}
.skip{position:fixed;left:12px;top:-64px;z-index:300;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:8px;font-size:13px;transition:top var(--fast) var(--ease)}
.skip:focus{top:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--status) + 16px);transform:translate(-50%,10px);background:var(--tip);color:var(--tip-ink);padding:8px 13px;border-radius:var(--r);font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity var(--mid) var(--ease),transform var(--mid) var(--ease);z-index:200;pointer-events:none;display:flex;gap:7px;align-items:center;max-width:80vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.card-t{font-size:13px;font-weight:600;margin:0}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:7px 12px;font-size:12px;align-items:center}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;color:var(--ink)}
.set-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.set-row:last-child{border-bottom:0}
.set-row .lbl{display:grid;gap:1px}
.set-row .lbl span{font-size:11px;color:var(--ink3)}
.set-row .ctl{margin-left:auto;display:flex;gap:4px}
.seg-b{height:24px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r-xs);font-size:12px;color:var(--ink2);background:var(--surface)}
.seg-b.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:500}

/* ---------- responsive ---------- */
@media (max-width:1240px){ :root{--dock-w:340px} }
@media (max-width:1080px){ :root{--dock-w:300px; --side:248px} }
@media (max-width:980px){
  .app,.app.nodock,.app.noside{grid-template-columns:var(--rail) minmax(0,1fr)}
  .side{position:fixed;left:var(--rail);top:0;bottom:var(--status);width:280px;z-index:60;box-shadow:var(--shadow);transform:translateX(calc(-100% - var(--rail) - 4px));transition:transform var(--mid) var(--ease)}
  .side.open{transform:translateX(0)}
  .dock{position:fixed;right:0;top:0;bottom:var(--status);width:min(340px,92vw);z-index:60;box-shadow:var(--shadow);transform:translateX(102%);transition:transform var(--mid) var(--ease)}
  .dock.open{transform:translateX(0)}
  .app.nodock .dock{transform:translateX(102%)}
  .app.nodock .dock.open{transform:translateX(0)}
}
@media (max-width:1600px){
  .chip .lbl{display:none}
  .chip{padding:0 7px}
}
@media (max-width:700px){
  :root{--pad:12px}
  .thread{padding:0 12px}
  .topbar{gap:6px;padding:8px 10px}
  .topbar .ttl{max-width:16ch}
  .page{padding:14px 12px 20px}
  .starters{grid-template-columns:1fr}
  .msg-user{max-width:92%}
  .cm-row .opt2{display:none}
  .topbar .crumb,.topbar .ttl .sep{display:none}
}
@media (max-width:560px){
  .topbar .ttl .sep,.topbar .ttl .crumb-l2{display:none}
  .chip .lbl{display:none}
  .chip{padding:0 7px}
  .cm-meta .lbl{display:none}
  .cm-pills .pill.warn{display:none}
  .grid3{grid-template-columns:1fr}
  .dlg{width:calc(100vw - 20px)}
  .statusbar .opt{display:none}
}
@media (max-width:400px){
  :root{--rail:48px}
  .rail-btn{width:34px;height:34px}
  .rail-tip{display:none}
  .chip.git{display:none}
  .page-h h1{font-size:16px}
  .thread{padding:0 9px;gap:11px}
  .msg-bot{grid-template-columns:18px minmax(0,1fr);gap:8px}
  .msg-user{max-width:96%;font-size:13px}
  .cm-box textarea{min-height:34px;font-size:13px}
  .starters{gap:6px}
  .bcard-h,.bcard-b,.appr-b{padding-left:9px;padding-right:9px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
/* ---- v5: 侧栏三段 / 插件层级 / 插件管理页 / 对话框固定关闭键 ---- */
.dlg-h{position:relative;padding-right:46px}
.dlg-h > .icon-btn[data-act="layerClose"]{position:absolute;right:10px;top:9px;margin:0}
.sec-hh{display:flex;align-items:center;gap:2px;padding:2px 2px 3px}
.sec-title{display:flex;align-items:center;gap:5px;flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink2);padding:4px 6px;border-radius:6px;text-align:left}
.sec-title:hover{background:var(--hover)}
.sec-title .n{font:11px/1 var(--font-mono);color:var(--ink4)}
.sec-title.static{cursor:default}
.sec-acts{display:flex;gap:1px}
.sec-acts .icon-btn{width:24px;height:24px}
.sec-search{display:flex;gap:4px;padding:0 4px 6px}
.sec-search input{flex:1;min-width:0;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px;font-size:12px;color:var(--ink)}
.plug-list{display:grid;gap:1px}
.plug-row{display:flex;align-items:center;gap:2px;padding:0 6px 0 0;border-radius:8px;width:100%}
.plug-main{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:7px 0 7px 8px;background:none;border:0;font:inherit;color:inherit;text-align:left}
.plug-row:hover{background:var(--hover)}
.plug-row .pico{width:22px;height:22px;border-radius:6px}
.plug-row .pico svg.ic{width:14px;height:14px}
.plug-row .t{flex:1;min-width:0;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plug-row .ver{font:11px/1 var(--font-mono);color:var(--ink4)}
.plug-row .pin{opacity:0}
.plug-row:hover .pin,.plug-row:focus-within .pin,.plug-row .pin.on{opacity:1}
.sec-title.lg{font-size:14px;padding:6px 6px;color:var(--ink)}
.sec-title.lg .n{font-size:11px}
.sec-tog.big{font-size:14px;font-weight:600;padding:8px 6px;gap:6px}
.sec-tog.big .caret{width:12px;height:12px}
.sec-tog.big .n{font:11px/1 var(--font-mono);color:var(--ink4)}
.pm-body{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;align-items:start}
.pm-nav{display:grid;gap:2px;position:sticky;top:0}
.pm-nav button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--ink2);text-align:left}
.pm-nav button:hover{background:var(--hover)}
.pm-nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pm-nav .n{margin-left:auto;font:11px/1 var(--font-mono);color:var(--ink4)}
.pm-main{min-width:0;display:grid;gap:12px}
.pm-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pm-search{flex:1;min-width:200px;display:flex;align-items:center;gap:6px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px}
.pm-search input{flex:1;border:0;background:transparent;font-size:12px;color:var(--ink);outline:none}
.pm-cats{display:flex;gap:4px;flex-wrap:wrap}
.pm-cat{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink3)}
.pm-cat.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.pm-hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.pm-hero b{font-size:14px}
.pm-hero p{font-size:12px;color:var(--ink3);margin-top:2px}
.pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:10px}
.pm-card{display:flex;flex-direction:column;gap:8px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left}
.pm-card:hover{border-color:var(--line2);box-shadow:0 4px 14px rgba(20,22,30,.06)}
.pm-card-top{display:flex;align-items:center;gap:9px}
.pm-card-name{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-card-by{font-size:11px;color:var(--ink4)}
.pm-card-sum{font-size:12px;line-height:1.5;;color:var(--ink3);min-height:3em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pm-card-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--ink4);font-variant-numeric:tabular-nums}
.pm-card-meta .sp{flex:1}
.pm-install{height:26px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);border:0}
.pm-install.on{background:var(--surface2);color:var(--ink3);font-weight:400}
.pm-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.pm-row .grow{flex:1;min-width:0}
.pm-row b{font-size:13px}
.pm-row .sub{font-size:11px;color:var(--ink3)}
.dsh-mark{display:block}
/* ---- v6: 行内操作 / 右键菜单 / 插件管理补全 ---- */
.chat-row .row-acts{display:none;gap:1px;align-items:center;margin-left:2px}
.chat-row:hover .row-acts,.chat-row:focus-within .row-acts{display:flex}
.icon-btn.xs{width:24px;height:24px;border-radius:6px}
.icon-btn.xs svg.ic{width:14px;height:14px}
.icon-btn.xs.on{color:var(--accent)}
.ws-row .ws-acts{display:none;gap:1px;margin-left:auto}
.ws-row:hover .ws-acts,.ws-row:focus-within .ws-acts{display:flex}
.ctxmenu{position:fixed;inset:auto;margin:0;min-width:208px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px}
.ctxmenu button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:6px;font-size:13px;color:var(--ink2);text-align:left}
.ctxmenu button:hover,.ctxmenu button:focus-visible{background:var(--hover);color:var(--ink);outline:none}
.ctxmenu button[role="menuitem"]{outline-offset:-2px}
.ctxmenu button.danger{color:var(--red)}
.ctxmenu .sep{height:1px;background:var(--line);margin:4px 2px}
.ctxmenu .k{margin-left:auto;font-size:11px;color:var(--ink4)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg .seg-b{border:0;border-radius:0;height:26px}
.seg .seg-b.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pm-ai{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.pm-ai-hint{font-size:11px;color:var(--ink3);line-height:1.5}}
.pm-sorts{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.pm-sort{padding:5px 9px;border-radius:6px;font-size:12px;color:var(--ink3)}
.pm-sort.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* ===== v8 侧栏：对齐 dsh 的 32px 行 / 12px 圆角 / 动作浮层 ===== */
.side-h{padding:10px 12px 8px 14px}
.side-h h2{font-size:13px;font-weight:600}
.side-scroll{padding:2px 8px 10px;display:flex;flex-direction:column;gap:1px}
.side-scroll>*{flex:0 0 auto}
.vh{position:absolute!important;clip-path:inset(50%)!important;width:1px!important;height:1px!important;overflow:hidden!important;white-space:nowrap!important}
.side-empty{padding:8px 10px;font-size:12px;color:var(--ink3);line-height:1.5}}
.side-sec{margin-top:10px}
.side-sec:first-of-type{margin-top:2px}
.side-sec-h{height:32px;display:flex;align-items:center;gap:2px;padding:0 2px 0 4px}
.side-sec-title{display:flex;align-items:center;gap:4px;flex:1;min-width:0;height:26px;padding:0 6px;border-radius:8px;font-size:12px;font-weight:600;letter-spacing:.2px;color:var(--ink3);background:none;border:0;text-align:left;cursor:pointer}
.side-sec-title:hover{background:var(--hover);color:var(--ink2)}
.side-sec-title svg.ic{width:12px;height:12px}
.side-sec-title .n{font:11px/1 var(--font-mono);color:var(--ink4);margin-left:2px}
.side-sec-acts{display:flex;gap:0}
.side-sec-acts .icon-btn{width:26px;height:26px;position:relative}
.side-sec-acts .icon-btn svg.ic{width:14px;height:14px}
.side-sec-search{display:flex;gap:4px;padding:2px 4px 6px}
.side-sec-search input{flex:1;min-width:0;height:28px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;font-size:12px;color:var(--ink)}
.row{position:relative;display:flex;align-items:center;height:32px;padding:0 8px 0 9px;border-radius:12px;width:100%;box-sizing:border-box}
.row:hover{background:var(--hover)}
.row.is-on{background:var(--accent-soft)}
.row-main{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0;height:100%;background:none;border:0;padding:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.row .lead{flex:0 0 auto;width:16px;display:grid;place-items:center;color:var(--ink4)}
.row .lead svg.ic{width:14px;height:14px}
.row .lead.ws-lead{width:34px;display:flex;align-items:center;gap:4px}
.row .ttl{flex:1 1 auto;min-width:0;font-size:13px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ttl.w500{font-weight:500}
.row .meta{flex:0 0 auto;font:11px/1 var(--font-mono);color:var(--ink4);display:flex;align-items:center;gap:5px;transition:opacity var(--fast) var(--ease)}
.row:hover .meta,.row:focus-within .meta{opacity:0}
.row .gm{display:inline-flex;gap:4px;font-size:11px}
.row .when{white-space:nowrap}
.row .ga{color:var(--green);font-style:normal}
.row .gd{color:var(--red);font-style:normal}
.row .acts{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:1px;opacity:0;pointer-events:none;transition:opacity var(--fast) var(--ease)}

.need-hd:hover{background:var(--hover)}

.need-hd b{font-size:13px;font-weight:600;color:var(--ink)}
.need-hd .n{font:11px/1 var(--font-mono);color:var(--amber);background:var(--amber-soft);padding:3px 6px;border-radius:6px}
.need-hd .chev{margin-left:auto;width:14px;height:14px;color:var(--ink4)}
.need-sub{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;font-size:11px;font-weight:600;letter-spacing:.2px;color:var(--ink3);background:var(--surface2);border-top:1px solid var(--line)}
.need-sub .n{font:11px/1 var(--font-mono);color:var(--ink4)}
.row.flat{border-radius:0}
.ndot{width:6px;height:6px;border-radius:50%;display:inline-block}
.ndot.wait{background:var(--amber)}
.ndot.ok{background:var(--green)}
.side-foot{padding:10px 12px 12px}
.side-note{margin:8px 4px 0;font-size:12px;line-height:1.5;color:var(--ink3)}

.dlg-sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12px;color:var(--ink2);font-weight:600}
.dlg-sec-h .muted{font-weight:400}
.dlg-sec-note{margin-top:8px;font-size:11px;line-height:1.5;color:var(--ink3)}
.dlg .seg{width:100%}
.dlg .seg .seg-b{flex:1;height:30px;font-size:12px}
.dsh-model{padding:4px}
.drow{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 10px;border-radius:10px;background:none;border:0;font:inherit;color:var(--ink);text-align:left}
.drow+.drow{margin-top:2px}
.drow:not(.static){cursor:pointer}
.drow:not(.static):hover,.drow:not(.static):focus-visible{background:var(--hover2)}
.drow .dl{font-size:13px;color:var(--ink);flex:0 0 auto}
.drow .dv{margin-left:auto;font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.drow .dc{color:var(--ink4);flex:0 0 auto;display:grid;place-items:center}
.drow .dc svg.ic{width:14px;height:14px}
.drow .dc.rot svg.ic{transform:rotate(90deg)}
.drow.sub{min-height:38px;padding-left:14px;border-radius:8px}
.drow .dsub{margin-left:8px;font-size:11px;color:var(--ink3)}
.mi-slot{display:inline-block;width:16px;height:16px;flex:0 0 auto}

.dlg .drow:not(.static):hover{background:var(--hover2)}

.drow .icon-btn.info{width:20px;height:20px;color:var(--ink4)}
.drow .icon-btn.info svg.ic{width:14px;height:14px}

.row.child::before{display:none}

.row.child .lead{display:grid;width:16px}

.need-card .row .lead{width:16px}
.need-hd{height:36px;padding:0 8px 0 12px}
.need-sub{height:28px;padding:0 12px;font-size:11px}

.side-scroll{gap:0;padding:2px 8px 12px}
.side-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;margin:0 0 8px}
.side-card:last-child{margin-bottom:0}
.card-hd{display:flex;align-items:center;gap:4px;height:40px;padding:0 6px 0 10px}
.card-toggle{display:flex;align-items:center;gap:6px;flex:1;min-width:0;height:28px;padding:0 6px;border-radius:8px;background:none;border:0;font:inherit;text-align:left;cursor:pointer}
.card-toggle:hover{background:var(--hover)}
.card-toggle .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.card-toggle .dot.wait{background:var(--amber)}
.card-toggle .dot.done,.card-toggle .dot.ok{background:var(--green)}
.card-toggle .dot.accent{background:var(--accent)}
.card-toggle .dot.muted{background:var(--ink4)}
.card-toggle b{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.card-toggle .n{font:11px/1 var(--font-mono);padding:3px 6px;border-radius:6px;background:var(--surface2);color:var(--ink3)}
.card-toggle .n.wait{background:var(--amber-soft);color:var(--amber)}
.card-toggle .n.accent{background:var(--accent-soft);color:var(--accent)}
.card-toggle .chev{width:14px;height:14px;color:var(--ink4)}
.card-hd .acts{display:flex;gap:2px;margin-left:2px}
.card-chev{margin-left:auto;width:28px;height:28px;display:grid;place-items:center;background:none;border:0;border-radius:8px;color:var(--ink4);cursor:pointer;flex:0 0 auto}
.card-chev:hover{background:var(--hover);color:var(--ink2)}
.card-chev svg.ic{width:14px;height:14px}
.card-hd .acts .icon-btn{width:28px;height:28px;border-radius:8px;color:var(--ink3)}
.card-hd .acts .icon-btn svg.ic{width:16px;height:16px}

.card-body>.row{height:32px;padding:0 6px;border-radius:10px}

  } else {
    inner = null;
  }
  if (S.palOpen){
    if (inner == null){ if (pal.matches(':popover-open')) pal.hidePopover(); return; }
    if (!pal.matches(':popover-open')) pal.showPopover();
    pal.innerHTML = inner;
    restoreFocusIn(pal);
    return;
  }
  if (pal.matches(':popover-open')){ pal.hidePopover(); pal.innerHTML = ''; }
  if (inner == null){ if (dlg.open) dlg.close(); dlg.dataset.key = ''; return; }
  var key = S.dlg || '';
  if (S.dlg==='modelPick') key += '|'+S.model+'|'+S.reason+'|'+(S.reasonOpen?1:0)+'|'+(S.team?1:0);
  if (S.dlg==='reasonPick') key += '|'+S.reason;
  var label = (inner.match(/aria-label="([^"]*)"/) || [])[1] || '对话框';
  dlg.setAttribute('aria-label', label);
  if (dlg.dataset.key !== key){ dlg.dataset.key = key; dlg.innerHTML = inner; }
  if (!dlg.open) dlg.showModal();
  restoreFocusIn(dlg);
}

/* ============ 渲染 & 焦点保持 ============ */
function focusKeep(id){
  var el = document.getElementById(id);
  if (!el) return;
  var v = el.value;
  el.focus();
  try { el.setSelectionRange(v.length, v.length); } catch(e){}
}
function copyText(txt){
  function done(ok){ toast(ok ? '复制了这一轮的正文' : '复制失败：浏览器没给剪贴板权限'); }
  function fallback(){
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.setAttribute('readonly','');
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta); done(ok);
    } catch(e){ done(false); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ done(true); }, fallback);
  } else fallback();
}
function markStubs(){
  var els = document.querySelectorAll('[data-act="toast"]');
  for (var i=0;i<els.length;i++){
    var el = els[i];
    el.classList.add('is-stub');
    if (!el.title) el.title = '演示占位：' + (el.getAttribute('data-t') || '不接后端，实现见规格');
  }
}
function render(keep){
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.dataset.density = S.density;
  renderRail(); renderSide(); renderMain(); renderDock(); renderStatus(); renderLayer(); renderPop();
  markStubs();
  if (keep){
    if (keep==='cmIn'){ var t = document.getElementById('cmIn'); if (t){ var p=S.composer; t.focus(); t.setSelectionRange(p.length,p.length); } }
    else focusKeep(keep);
  }
}

  S.page = p; S.last = last || ('切到「'+navLabel(p)+'」');
  S.sideOpen = false;
  render();
  var pw = $('#threadWrap'); if (pw && p==='chat' && S.chatTab==='dialog') pw.scrollTop = pw.scrollHeight;
}

      if (S.queue.length){ deliver(S.queue.shift()); toast('这一轮结束，排队的一条自动发出'); }
      else { S.running=false; toast('已停止这一轮'); }
      render(); break;
    }
    case 'msgExport': exportTurn(+el.getAttribute('data-i')); break;
    case 'msgCtx': S.chatTab='ctx'; S.last='在上下文视图里看这一轮'; render(); toast('已切到上下文视图'); break;
    case 'msgBranch': branchFromTurn(+el.getAttribute('data-i')); break;
    case 'overview': S.dlg='overview'; renderLayer(); break;
    case 'setGroup': S.setGroup = el.getAttribute('data-k'); render(); break;
    case 'revertNative': S.dlg='revert'; renderLayer(); break;
    case 'copy': {
      var box = el.closest('.msg-bot') || el.closest('.turn');
      copyText(box ? (box.innerText || '').trim() : '');
      break;
    }
    case 'toast': toast(t||'原型里只做演示'); break;
    case 'dock': S.dock=!S.dock; render(); break;
    case 'dockTab': S.dockTab=el.getAttribute('data-k'); S.dock=true; S.last='右栏切到「'+({review:'审阅',files:'文件',term:'终端',tasks:'任务',side:'侧聊'}[S.dockTab])+'」'; render(); break;
    case 'fileSel': S.fileSel=+el.getAttribute('data-i'); render(); break;
    case 'stage': {
      if (!S.diff.length){ toast('没有可暂存的改动'); break; }
      var sn = 0;
      S.diff.forEach(function(f){ if (!f.staged){ f.staged = true; sn++; } });
      render(); toast(sn ? ('暂存了 '+sn+' 个文件') : '已经都暂存了');
      break;
    }
    case 'revert': S.diff=[]; render(); toast('还原了所有改动'); break;
    case 'commit': {
      var staged = S.diff.filter(function(f){ return f.staged; });
      if (!staged.length){ toast(S.diff.length ? '先暂存再提交' : '都提交过了'); break; }
      S.diff = S.diff.filter(function(f){ return !f.staged; });
      render(); toast('提交了 '+staged.length+' 个文件');
      break;
    }
    case 'termRun': {
      var cmd = (S.termIn||'').trim(); if(!cmd) break;
      S.term.push(['p','$ '+cmd]); S.term.push(['ok', '演示模式：命令没有真的执行，退出码 0']); S.termIn=''; render();
      var o=document.getElementById('termOut'); if(o) o.scrollTop=o.scrollHeight; break;
    }
    case 'sideSend': {
      var txt=(S.sideIn||'').trim(); if(!txt) break;
      S.sideMsgs.push({me:true,t:txt}); S.sideMsgs.push({me:false,t:'（侧聊演示）这句只在这个分支里，主会话看不到。'});
      S.sideIn=''; render(); break;
    }
    case 'send': sendMsg(); break;
    case 'starter': S.composer = el.getAttribute('data-t'); S.last='挑了起手式'; render('cmIn'); break;
    case 'mcpProbe': toast('探测了一次：新起一个进程，3 个工具响应正常'); break;
    case 'mcpRestart': toast('重启了这条连接（会断开当前会话）'); break;
    case 'autoToggle': {
      var au = AUTOS.filter(function(x){ return x.id===el.getAttribute('data-id'); })[0];
      if (au){ au.on = !au.on; render(); toast(au.name+(au.on?' 已启用':' 已停用')); }
      break;
    }
    case 'setJump': toast('定位到设置里的分组'); break;
    case 'palRun': {
      var list = cmds().filter(function(c){ return !S.palQ || c.t.indexOf(S.palQ)>=0; });
      var c2 = list[+el.getAttribute('data-i')]; if (!c2) break;
      S.palOpen=false; renderLayer();
      if (c2.act==='nav') go(c2.k2);
      else if (c2.act==='plugOpen'){ S.pluginSel=c2.k2; S.page='plugin'; S.last='从命令面板打开插件'; render(); }
      else if (c2.act==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; render(); }
      else if (c2.act==='dock'){ S.dock=!S.dock; render(); }
      else if (c2.act==='newChat'){ var pw3=wsOf(S.ws)||WORKSPACES[0]; S.active=null; S.page='chat'; S.newDraft={ws:pw3.id, dir:pw3.dirs[0]||null}; render(); }
      else if (c2.act==='stage'){ toast('全部暂存了'); }
      else if (c2.act==='commit'){ S.diff=[]; render(); toast('提交了'); }
      break;
    }
  }
}, false);

document.addEventListener('mousedown', function(e){
  var h = e.target.closest ? e.target.closest('.dock-handle') : null;
  if (!h) return;
  if (window.innerWidth <= 1080){ toast('窄窗下右栏是抽屉，先拉宽窗口再拖'); return; }
  e.preventDefault();
  var startX = e.clientX;
  var startW = $('#dock').getBoundingClientRect().width;
  function move(ev){
    var w = Math.max(320, Math.min(520, startW - (ev.clientX - startX)));
    S.dockW = Math.round(w);
    $('#app').style.setProperty('--dock-w', S.dockW+'px');
  }
  function up(){
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}, false);
document.addEventListener('dblclick', function(e){
  var h = e.target.closest ? e.target.closest('.dock-handle') : null;
  if (!h) return;
  S.dockW = 384;
  $('#app').style.removeProperty('--dock-w');
  toast('右栏宽度复位为 384');
}, false);

function deliver(txt){
  var th = threadOf(S.active);
  th.push({k:'user', t:txt, at:'刚刚'});
  th.push({k:'bot', fold:{dur:'2 秒', files:1, cmds:0},
    tx:['收到。这条在原型里不接真后端：<b>消息立刻进流</b>，任务卡、汇报卡、审批卡的口径不变。'],
    tools:[]});
  S.running = true;
  S.last = '发了一条消息';
}
function exportTurn(i){
  var m = threadOf(S.active)[i]; if (!m) return;
  var md = '# 本轮导出\n\n';
  if (m.k==='user') md += '**我** · '+m.at+'\n\n'+m.t+'\n';
  else if (m.k==='bot'){
    md += '**DeepSeek Harness**\n\n'+(m.tx||[]).join('\n\n')+'\n';
    if (m.tools && m.tools.length) md += '\n工具：'+m.tools.map(function(t){ return t.k+' '+t.c; }).join('、')+'\n';
  }
  else md += '```json\n'+JSON.stringify(m,null,2)+'\n```\n';
  var blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dsh-turn-'+(i+1)+'.md';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('导出了第 '+(i+1)+' 轮（Markdown）');
}
function branchFromTurn(i){
  var m = threadOf(S.active)[i];
  var src = chatOf(S.active);
  var raw = m ? (m.k==='user' ? m.t : (m.tx||[]).join(' ')) : '';
  var quote = String(raw).replace(/<[^>]+>/g,'').slice(0,80);
  var id = 'b' + (Date.now()%100000);
  CHATS.unshift({id:id, ws:S.ws||null, title:'分支 · '+((src&&src.title)||'').slice(0,12), when:'刚刚', add:0, del:0, rounds:1, steps:0, tok:'0', pct:0});
  THREADS[id] = [
    {k:'user', t:'从「'+((src&&src.title)||'')+'」第 '+(i+1)+' 轮分支出来：\n\n> '+quote, at:'刚刚'},
    {k:'bot', fold:{dur:'0.3 秒', files:0, cmds:0}, tx:['新会话建好了，引用带的是这一轮的原文。'], tools:[]}
  ];
  S.active = id; S.page='chat'; S.chatTab='dialog'; S.splitN=0;
  render(); toast('在新会话里从第 '+(i+1)+' 轮分支了');
}
function sendMsg(){
  var txt = (S.composer||'').trim();
  if (!txt && !(S.active && approvalPending())){ toast('先写点什么'); return; }
  if (!txt && S.active && approvalPending()){        // 「输入框空着按 Enter 也能允许」
    for (var k in S.approval) if (S.approval[k]==='pending'){ S.approval[k]='allow'; }
    threadOf(S.active).push({k:'bot', tx:['批准了。<span class="codec">npm run build -- --watch</span> 已经开始跑，输出在右栏「终端」。']});
    S.running = true;
    render(); toast('空着按 Enter 也算允许'); return;
  }
  if (!S.active){ createChatFromDraft(txt); return; }
  if (S.running){
    S.queue.push(txt); S.composer=''; S.attach=[];
    S.last = '排队一条消息'; render('cmIn');
    toast('这一轮在跑，先排队；点「插话」能立刻发');
    return;
  }
  deliver(txt);
  S.composer=''; S.attach=[];
  render(); toast('发出去了（演示）');
  var w=$('#threadWrap'); if(w) w.scrollTop=w.scrollHeight;
}
/* 新会话页发出第一句：把这个会话真的建出来，绑在选好的目录上 */
function createChatFromDraft(txt){
  var d = S.newDraft || {ws:null, dir:null};
  var id = 'n' + (Date.now() % 100000);
  var title = txt.length > 20 ? txt.slice(0,20)+'…' : txt;
  CHATS.unshift({id:id, ws:d.ws||null, title:title, when:'刚刚', add:0, del:0, rounds:1, steps:0, tok:'0', pct:0});
  if (d.ws && d.dir) S.chatDir[id] = d.dir;
  THREADS[id] = [
    {k:'user', t:txt, at:'刚刚'},
    {k:'bot', fold:{dur:'0.4 秒', files:0, cmds:0},
     tx:['会话建好了，放在 <b>'+esc(d.dir || '不绑目录')+'</b> 上。',
         '原型不接后端：这句只进本地演示流。要换目录点输入框那行的目录；要改名在左栏这一行点 ⋯。'], tools:[]}
  ];
  S.active = id; S.composer=''; S.attach=[]; S.page='chat'; S.chatTab='dialog';
  S.newTask = false;
  S.ws = d.ws || S.ws || 'w1';
  S.last = '新建会话「'+title+'」';
  render(); toast('新会话建好了');
  var w2=$('#threadWrap'); if(w2) w2.scrollTop=w2.scrollHeight;
}
function approvalPending(){
  var n=0; for (var k in S.approval) if (S.approval[k]==='pending') n++;
  return n>0;
}

document.addEventListener('input', function(e){
  var id = e.target.id;
  if (id==='cmIn'){ S.composer = e.target.value; var b=document.querySelector('[data-act="send"]'); if(b) b.disabled = !S.composer.trim(); }
  if (id==='popQ'){ S.modelQ = e.target.value; renderPop(); focusKeep('popQ'); }
  else if (id==='wsQ'){ S.wsQ = e.target.value; renderSide(); focusKeep('wsQ'); }
  else if (id==='pmQ'){ S.pmQ = e.target.value; render(); focusKeep('pmQ'); }
  else if (id==='pmAiQ'){ S.pmAiQ = e.target.value; render(); focusKeep('pmAiQ'); }
  else if (id==='termIn') S.termIn = e.target.value;
  else if (id==='sideIn') S.sideIn = e.target.value;
  else if (id==='palQ'){ S.palQ = e.target.value; S.palIdx=0; renderLayer(); focusKeep('palQ'); }
}, false);

document.addEventListener('keydown', function(e){
  var meta = e.metaKey || e.ctrlKey;
  var tag = (e.target.tagName||'').toLowerCase();
  var inField = tag==='input' || tag==='textarea';
  /* 行内的小按钮（span 角色按钮）用 Enter / 空格也能开 */
  var actEl = (e.target && e.target.closest) ? e.target.closest('[data-act]') : null;
  if (actEl && actEl.tagName!=='BUTTON' && tag!=='input' && tag!=='textarea' && (e.key==='Enter' || e.key===' ')){
    e.preventDefault(); e.stopPropagation(); actEl.click(); return;
  }
  if (meta && e.key.toLowerCase()==='k'){ e.preventDefault(); S.palOpen=!S.palOpen; S.palQ=''; S.palIdx=0; renderLayer(); if(S.palOpen) focusKeep('palQ'); return; }
  if (meta && e.key.toLowerCase()==='b'){ e.preventDefault(); $('#app').classList.toggle('noside'); toast('侧栏开关'); return; }
  if (meta && e.key.toLowerCase()==='j'){ e.preventDefault(); S.dock=!S.dock; render(); return; }
  if (meta && e.key.toLowerCase()==='d'){ e.preventDefault(); setSplit(nextSplitN()); return; }
  if (meta && e.key.toLowerCase()==='n'){ e.preventDefault();
    var nws2 = wsOf(S.ws) || WORKSPACES[0];
    S.active=null; S.page='chat'; S.chatTab='dialog'; S.composer=''; S.attach=[];
    S.newDraft = {ws:nws2.id, dir:nws2.dirs[0]||null};
    S.last='新建会话'; S.newTask=false; render(); return; }
  if (meta && e.key===','){ e.preventDefault(); go('settings'); return; }
  if (meta && e.shiftKey && e.key.toLowerCase()==='l'){ e.preventDefault(); S.theme=S.theme==='dark'?'light':'dark'; render(); return; }
  if (meta && e.key==='1'){ e.preventDefault(); go('chat'); return; }
  if (meta && e.key==='3'){ e.preventDefault(); go('automation'); return; }
  if (meta && e.key==='4'){ e.preventDefault(); go('ext'); return; }
  if (e.key==='Escape'){ if (S.ctx){ closeCtxMenu(); return; } if (S.palOpen||S.dlg){ closeOverlays(); return; } }
  var cmEl = document.getElementById('ctxmenu');
  if (cmEl && cmEl.matches(':popover-open') && ['ArrowDown','ArrowUp','Home','End'].indexOf(e.key) >= 0){
    e.preventDefault();
    var mi = [].slice.call(cmEl.querySelectorAll('[role="menuitem"]'));
    var cur = mi.indexOf(document.activeElement);
    var next = e.key==='Home' ? 0 : e.key==='End' ? mi.length-1 : (cur + (e.key==='ArrowDown'?1:-1) + mi.length) % mi.length;
    if (mi[next]){ mi.forEach(function(x){ x.tabIndex = -1; }); mi[next].tabIndex = 0; mi[next].focus(); }
    return;
  }
  if (!inField && e.key==='?'){ S.dlg='help'; renderLayer(); return; }
  if (S.palOpen){
    var list = cmds().filter(function(c){ return !S.palQ || c.t.indexOf(S.palQ)>=0; });
    if (e.key==='ArrowDown'){ e.preventDefault(); S.palIdx=Math.min(S.palIdx+1,list.length-1); renderLayer(); }
    else if (e.key==='ArrowUp'){ e.preventDefault(); S.palIdx=Math.max(S.palIdx-1,0); renderLayer(); }
    else if (e.key==='Enter'){ e.preventDefault(); var c3=list[S.palIdx]; if(c3){ S.palOpen=false; renderLayer(); if(c3.act==='nav') go(c3.k2); } }
    return;
  }
  if (S.dlg==='help' && e.key==='Enter'){ S.dlg=null; renderLayer(); return; }
  if (e.target.id==='termIn' && e.key==='Enter'){ document.querySelector('[data-act="termRun"]').click(); return; }
  if (e.target.id==='sideIn' && e.key==='Enter'){ document.querySelector('[data-act="sideSend"]').click(); return; }
  var tabEl = (e.target && e.target.closest) ? e.target.closest('.tabs') : null;
  if (tabEl && ['ArrowLeft','ArrowRight','Home','End'].indexOf(e.key) >= 0){
    e.preventDefault();
    var ts = [].slice.call(tabEl.querySelectorAll('[role="tab"]'));
    var ci = ts.indexOf(document.activeElement);
    var ni = e.key==='Home' ? 0 : e.key==='End' ? ts.length-1 : (ci + (e.key==='ArrowRight'?1:-1) + ts.length) % ts.length;
    if (ts[ni]){ ts[ni].focus(); ts[ni].click(); }
    return;
  }
  if (e.target.id==='cmIn'){
    if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); return; }
    if (e.key==='/' && !S.composer){ e.preventDefault(); toast('命令：/clear /compact /model /skill…'); }
  }
}, false);

/* ---- 原生 dialog / popover 接线 ---- */
var DLG = document.getElementById('dlg');
var PAL = document.getElementById('palette');
DLG.addEventListener('close', function(){ if (S.dlg){ S.dlg = null; } DLG.dataset.key = ''; });
PAL.addEventListener('toggle', function(e){ if (e.newState === 'closed' && S.palOpen){ S.palOpen = false; } });
/* closedby 兜底（Safari 等不支持时按指南用 pointerdown/pointerup 判定是否点在框外） */
if (!('closedBy' in HTMLDialogElement.prototype)) {
  var outside = function(e, d){ var r = d.getBoundingClientRect(); return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom; };
  var pressedOutside = false;
  DLG.addEventListener('pointerdown', function(e){ pressedOutside = outside(e, DLG); });
  DLG.addEventListener('pointerup', function(e){ if (pressedOutside && outside(e, DLG)) DLG.close(); });
}

document.addEventListener('pointerdown', function(e){
  if (!S.pop) return;
  var pop = $('#pop');
  if (pop && pop.contains(e.target)) return;
  if (e.target.closest && e.target.closest('[data-act="modelPop"],[data-act="reasonPop"]')) return;
  S.pop = null; renderPop();
});
document.addEventListener('keydown', function(e){
  if (e.key==='Escape' && S.pop){ S.pop=null; renderPop(); }
});

/* 首次渲染 */
S.last = '打开融合版';
if (window.innerWidth <= 980){ S.dock = false; S.sideOpen = false; }
render();
(function(){ var w=$('#threadWrap'); if(w) w.scrollTop = w.scrollHeight; })();

/* 跨断点时把抽屉收起来，免得窄窗一打开就被右栏盖住 */
var _narrow = window.innerWidth <= 980;
window.addEventListener('resize', function(){
  var now = window.innerWidth <= 980;
  if (now !== _narrow){
    _narrow = now;
    S.dock = !now;
    S.sideOpen = false;
    $('#side').classList.remove('open');
    if (now) $('#app').style.removeProperty('--dock-w');
    else if (S.dockW !== 384) $('#app').style.setProperty('--dock-w', S.dockW+'px');
    render();
  }
  if (S.splitN && splitMax() < S.splitN) setSplit(splitMax());
});
</script>
