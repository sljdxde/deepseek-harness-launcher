<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>侧栏改造原型 · DSH</title>
<!--
  原型：DSH Web 侧栏改造（紧凑版 + 内置最近会话 + 区块可拖动）
  三个变体，通过 ?variant=A|B|C 切换，底部浮动条 / 键盘 ← → 也能切。
  A 紧凑原生 · B 最近优先 · C 自由积木
  一次性原型：无构建、无依赖、状态只存 localStorage["dsh-proto-sidebar-v2"]。
-->
<style>
:root{
  --bg:#f9fafb; --panel:#fff; --ink:#0f1115; --ink2:#61666b; --ink3:#90959b;
  --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.14);
  --hov:rgba(38,49,72,.05); --sel:rgba(38,49,72,.075);
  --accent:#4176e6; --accent-soft:#edf3fe; --run:#4176e6; --warn:#d98a1a;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --r:10px; --r-sm:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--panel);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.ic{width:16px;height:16px;flex:none;display:block;overflow:visible}
#app{height:calc(100vh - 40px)}

/* ── shell ─────────────────────────────────────────── */
.shell{display:flex;height:100%;width:100%;--w:248px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);order:1}
.sb{order:0;width:var(--w);height:100%;flex:none;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;position:relative;z-index:3;min-width:0;overflow:hidden}
.shell[data-side="right"] .sb{order:2;border-right:0;border-left:1px solid var(--line)}
.shell[data-side="right"] .main{order:1}
.resizer{position:absolute;top:0;bottom:0;right:-3px;width:6px;cursor:col-resize;z-index:6;touch-action:none}
.resizer:after{content:"";position:absolute;top:0;bottom:0;left:2px;width:2px;background:transparent;transition:background .12s}
.resizer:hover:after{background:rgba(38,49,72,.16)}
.shell[data-side="right"] .resizer{right:auto;left:-3px}
.sb-hd{flex:none;padding:6px 8px 0}
.sb-scroll{flex:1;min-height:0;overflow:auto;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 12px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 12px),transparent);padding:2px 6px 6px;display:flex;flex-direction:column;gap:5px;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.14) transparent}
.sb-scroll::-webkit-scrollbar{width:7px;height:7px}
.sb-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:8px;border:2px solid var(--bg)}
.sb-scroll::-webkit-scrollbar-track{background:transparent}
.zone-stack{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.14) transparent}
.zone-stack::-webkit-scrollbar{width:7px}
.zone-stack::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:8px;border:2px solid var(--bg)}
.zone-stack::-webkit-scrollbar-track{background:transparent}
.sb-ft{flex:none;padding:4px 8px 8px;border-top:1px solid transparent}
.sb-ft .u-row{display:flex;align-items:center;gap:7px;height:34px;padding:0 6px;border-radius:9px;cursor:default}
.sb-ft .u-row:hover{background:var(--hov)}
.avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#dfe6f9,#d3d9e8);display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#3b4252;flex:none}
.u-name{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-gear{opacity:0;color:var(--ink2);display:grid;place-items:center;width:22px;height:22px;border-radius:6px}
.sb-ft .u-row:hover .u-gear{opacity:1;background:rgba(0,0,0,.05)}

/* ── brand ─────────────────────────────────────────── */
.brand{display:flex;align-items:center;gap:8px;height:40px;padding:0 4px 0 6px}
.brand-mark{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.brand-mark svg{width:23px;height:17px;color:var(--ink);flex:none}
.brand-word{font-weight:600;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap}
.brand-badge{font-size:8.5px;font-weight:700;letter-spacing:.04em;color:#fff;background:#0f1115;border-radius:4px;padding:2px 3.5px;line-height:1;display:inline-block;transform:translateY(-.5px)}
.brand-acts{display:flex;align-items:center;gap:1px;flex:none}
.brand-btn{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--ink2)}
.brand-btn:hover{background:var(--hov);color:var(--ink)}
.brand-btn .ic{width:15px;height:15px}

/* ── primitives ────────────────────────────────────── */
.row{display:flex;align-items:center;gap:6px;border-radius:7px;padding:0 6px;white-space:nowrap;cursor:default;min-width:0}
.row:hover{background:var(--hov)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.row .m{font-size:10.5px;color:var(--ink3);flex:none;font-variant-numeric:tabular-nums}
.row .ic{width:15px;height:15px;color:var(--ink2)}
.row-acts{display:none;align-items:center;gap:0;flex:none}
.row:hover .row-acts{display:flex}
.row-acts .ib{width:20px;height:20px;display:grid;place-items:center;border-radius:5px;color:var(--ink2)}
.row-acts .ib:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.mini-btn{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--ink2)}
.mini-btn:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.mini-btn .ic{width:14px;height:14px}

.dot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.dot.run{background:var(--run);box-shadow:0 0 0 0 rgba(65,118,230,.4);animation:pulse 1.8s infinite}
.dot.warn{background:var(--warn)}
.dot.unread{background:var(--run)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(65,118,230,.35)}70%{box-shadow:0 0 0 4px rgba(65,118,230,0)}100%{box-shadow:0 0 0 0 rgba(65,118,230,0)}}

/* ── new session ───────────────────────────────────── */
.new-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border-radius:10px;background:#fff;border:.5px solid rgba(0,0,0,.13);font-weight:500;font-size:13px;box-shadow:0 1px 1px rgba(0,0,0,.02)}
.new-btn:hover{background:#fdfdfd;border-color:rgba(0,0,0,.2)}
.new-btn .ic{width:15px;height:15px;color:var(--ink2)}
.kbd{font-size:10px;color:var(--ink3);border:1px solid var(--line2);border-radius:4px;padding:0 3px;line-height:14px}

/* ── sections / blocks ─────────────────────────────── */
.zone{display:flex;flex-direction:column;gap:4px;min-height:0}
.zone-stack{flex:1;overflow:auto;padding:0 0 2px}
.zone:empty{min-height:26px;border:1.5px dashed var(--line2);border-radius:9px;align-items:center;justify-content:center}
.zone:empty:after{content:attr(data-empty-hint);font-size:10.5px;color:var(--ink3)}
.block{position:relative;border-radius:10px;min-width:0}
.block-hd{display:flex;align-items:center;gap:2px;height:24px;padding:0 3px 0 2px;border-radius:8px;color:var(--ink2);user-select:none}
.block-hd:hover{background:var(--hov)}
.grip{width:16px;height:20px;flex:none;display:grid;place-items:center;color:var(--ink3);opacity:0;cursor:grab;touch-action:none;border-radius:5px}
.grip .ic{width:14px;height:14px}
.block:hover .grip,.block.is-source .grip{opacity:.75}
.grip:hover{background:rgba(0,0,0,.06);color:var(--ink2)}
.grip:active{cursor:grabbing}
.block-title{display:flex;align-items:center;gap:3px;flex:1;min-width:0;height:100%;font-size:11.5px;font-weight:600;letter-spacing:.01em;color:var(--ink2)}
.block-title .chev{width:13px;height:13px;opacity:.8;transition:transform .12s}
.block-title .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:9.5px;font-weight:600;color:var(--ink3);background:rgba(38,49,72,.065);border-radius:99px;padding:1px 4.5px;line-height:1.35;min-width:16px;text-align:center}
.block-hd .hd-acts{display:flex;align-items:center;gap:0;flex:none;opacity:0}
.block:hover .hd-acts{opacity:1}
.block-bd{padding:1px 0 2px}
.block-bd.flush{padding:0}

/* drag */
.block.is-source{opacity:.35;outline:1.5px dashed var(--line2);outline-offset:2px}
.block.is-source .grip{opacity:1}
.drag-clone{position:fixed;z-index:80;pointer-events:none;background:#fff;border:1px solid var(--line2);border-radius:11px;box-shadow:0 12px 32px rgba(15,17,21,.16),0 2px 6px rgba(15,17,21,.08);padding:2px 3px;overflow:hidden}
.drag-clone .grip{opacity:.6}
.dragging,.dragging *{cursor:grabbing!important;user-select:none!important}
.zone.drop-on{background:rgba(65,118,230,.035);outline:1.5px dashed rgba(65,118,230,.3);outline-offset:2px;border-radius:10px}
.drop-hint{position:fixed;z-index:81;pointer-events:none;background:#0f1115;color:#fff;font-size:11px;border-radius:7px;padding:4px 8px;box-shadow:0 6px 18px rgba(0,0,0,.2)}

/* ── rows: workspaces / sessions / recents ─────────── */
.ws-row{height:26px}
.ws-row .ws-chev{width:13px;height:13px;color:var(--ink3);transition:transform .12s}
.ws-row .row-acts{display:none}
.ws-sessions{padding:1px 0 2px 12px;position:relative;margin:0 0 1px}
.ws-sessions:before{content:"";position:absolute;left:7px;top:3px;bottom:3px;width:1px;background:var(--line)}
.s-row{height:24px;padding-left:5px;gap:5px}
.s-row .t{font-size:12px}
.s-row.on{background:var(--sel)}
.s-row.on .t{font-weight:500}
.s-row .dot{margin-left:-1px}
.overflow-row{height:22px;padding-left:8px;font-size:11px;color:var(--ink3);border-radius:6px;display:flex;align-items:center}
.overflow-row:hover{background:var(--hov);color:var(--ink2)}
.ws-row .folder{color:var(--ink3)}
.ws-row.open .folder{color:var(--ink)}

.rec-row{height:26px;gap:6px}
.rec-row .t{font-size:12.5px}
.rec-row .m{opacity:.9}
.rec-row.cur{background:var(--sel)}
.rec-row.cur .t{font-weight:500;color:var(--ink)}
.rec-row .dot{width:5px;height:5px}
.rec-group{font-size:10px;font-weight:600;color:var(--ink3);height:18px;display:flex;align-items:center;padding:0 6px;margin-top:2px;letter-spacing:.03em}

/* workspace chips (B) */
.chips{display:flex;flex-wrap:wrap;gap:3px;padding:2px 0 3px}
.chip-ws{display:flex;align-items:center;gap:4px;height:22px;padding:0 6px;border-radius:6px;background:rgba(38,49,72,.045);font-size:11px;color:var(--ink2);max-width:100%}
.chip-ws:hover{background:rgba(38,49,72,.08);color:var(--ink)}
.chip-ws.on{background:var(--accent-soft);color:#2b4fa8}
.chip-ws .n{font-size:9.5px;opacity:.6}
.chip-ws span.lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:112px}

/* panel grid (A / C) */
.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:1px 0}
.nav-row{display:flex;align-items:center;gap:5px;height:26px;padding:0 6px;border-radius:7px;font-size:12px;color:var(--ink);min-width:0}
.nav-row:hover{background:var(--hov)}
.nav-row .ic{width:15px;height:15px;color:var(--ink2)}
.nav-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-row.more{color:var(--ink2)}
/* icon rail (B) */
.rail{display:flex;align-items:center;gap:2px;padding:1px 2px}
.rail-btn{width:28px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--ink2)}
.rail-btn:hover{background:var(--hov);color:var(--ink)}
.rail-btn .ic{width:15px;height:15px}
.rail-sep{width:1px;height:14px;background:var(--line);margin:0 2px}
.rail-badge{position:relative}
.rail-badge .badge-dot{position:absolute;top:5px;right:4px;width:5px;height:5px;border-radius:50%;background:#d98a1a;box-shadow:0 0 0 1.5px var(--bg)}

/* tools rows */
.tool-row{height:26px;font-size:12.5px}
.tool-row .badge{font-size:9.5px;font-weight:600;color:#a86410;background:#fef5e7;border-radius:99px;padding:1px 5px;line-height:1.4}

/* ── dock (C) ──────────────────────────────────────── */
.dock-wrap{flex:none;position:relative;padding:4px 6px 2px;margin-top:auto}
.zone-dock{flex-direction:row!important;align-items:center;gap:4px;flex-wrap:wrap;padding:3px 0 0}
.zone-dock:empty{display:none}
.block.chip{flex:none;position:static}
.block.chip .block-hd{height:26px;padding:0 7px 0 2px;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:8px;gap:3px}
.block.chip .block-hd:hover{background:#fff;border-color:var(--line2)}
.block.chip .block-title{font-size:11.5px;flex:none}
.block.chip .grip{width:14px;opacity:.4}
.block.chip .cnt{font-size:9px}
.dock-pop{position:absolute;left:0;right:0;bottom:calc(100% - 2px);z-index:20;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 40px rgba(15,17,21,.16),0 2px 8px rgba(15,17,21,.06);padding:6px;display:none;max-height:min(56vh,460px);overflow:auto}
.block.chip.open .dock-pop{display:block}
.dock-pop .pop-hd{display:flex;align-items:center;gap:6px;height:24px;padding:0 6px 4px;font-size:11.5px;font-weight:600;color:var(--ink2)}

/* ── restore strip ─────────────────────────────────── */
.restore{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px;border-radius:7px;font-size:11px;color:var(--ink2);border:1px dashed var(--line2);background:transparent}
.restore:hover{background:var(--hov);color:var(--ink)}
.restore .ic{width:13px;height:13px}

/* ── sidebar variant tuning ────────────────────────── */
body[data-v="A"] .sb-hd{padding-top:3px}
body[data-v="A"] .brand{height:38px}
body[data-v="A"] .nav-grid .nav-row{height:25px}
body[data-v="A"] .sb-scroll{gap:4px;padding-bottom:2px}
body[data-v="A"] .rec-row{height:25px}
body[data-v="A"] .new-btn{height:30px;margin:2px 0 4px}
body[data-v="A"] .nav-wrap{padding:0 0 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
body[data-v="A"] .block{margin-top:0}

body[data-v="B"] .brand{height:36px}
body[data-v="B"] .new-btn{height:30px;margin:1px 0 5px}
body[data-v="B"] .search{display:flex;align-items:center;gap:5px;height:28px;padding:0 7px;border-radius:8px;background:#fff;border:.5px solid rgba(0,0,0,.1);margin:0 0 4px}
body[data-v="B"] .search .ic{width:14px;height:14px;color:var(--ink3);flex:none}
body[data-v="B"] .search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:12px;color:var(--ink);padding:0}
body[data-v="B"] .search input::placeholder{color:var(--ink3)}
body[data-v="B"] .sb-scroll{gap:6px}
body[data-v="B"] .block-hd{height:23px}
body[data-v="B"] .rec-row{height:24px}
body[data-v="B"] .rec-row .wsname{display:none;color:var(--ink3);font-size:10.5px;flex:none}
body[data-v="B"] .rec-row:hover .wsname{display:block}
body[data-v="B"] .rec-row:hover .m{display:none}
body[data-v="B"] .sb-ft{padding-top:2px}
body[data-v="B"] .tool-stack{display:flex;flex-direction:column}

body[data-v="C"] .block{background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:11px;padding:0 4px 2px}
body[data-v="C"] .block:hover{border-color:rgba(0,0,0,.1)}
body[data-v="C"] .block-hd{height:25px}
body[data-v="C"] .grip{opacity:.45}
body[data-v="C"] .sb-scroll{overflow:hidden;padding-bottom:0}
body[data-v="C"] .zone-stack{gap:6px;padding-top:1px;overflow:auto;flex:1;min-height:0;padding-right:3px}
body[data-v="C"] .sb-hd{padding-bottom:2px}
body[data-v="C"] .layout-row{display:flex;align-items:center;gap:4px;margin:0 0 4px}
body[data-v="C"] .layout-pill{display:flex;align-items:center;gap:4px;height:24px;padding:0 7px;border-radius:7px;background:rgba(38,49,72,.05);font-size:10.5px;color:var(--ink2)}
body[data-v="C"] .layout-pill .ic{width:12px;height:12px}
.txt-btn{height:22px;padding:0 7px;border-radius:6px;font-size:10.5px;color:var(--ink2);background:rgba(38,49,72,.055)}
.txt-btn:hover{background:rgba(38,49,72,.1);color:var(--ink)}
body[data-v="C"] .new-btn{height:30px}
body[data-v="C"] .nav-grid{grid-template-columns:1fr 1fr}

/* ── main pane ─────────────────────────────────────── */
.mhead{flex:none;border-bottom:1px solid var(--line);padding:0 0 0;user-select:none}
.mtitle-row{display:flex;align-items:center;gap:7px;height:40px;padding:2px 16px 0 18px}
.mtitle{font-size:14px;font-weight:600;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:1.5px 6px;white-space:nowrap;flex:none}
.mchip .ic{width:12px;height:12px;opacity:.8}
.mgrow{flex:1}
.mhead .brand-btn{color:var(--ink2)}
.mtabs{display:flex;align-items:flex-end;gap:20px;padding:0 18px;height:34px;font-size:13px;color:var(--ink2)}
.mtabs .tab{position:relative;padding:0 0 9px;cursor:pointer;white-space:nowrap}
.mtabs .tab:hover{color:var(--ink)}
.mtabs .tab.on{color:var(--ink);font-weight:500}
.mtabs .tab.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);border-radius:2px}
.mtabs .tab.more{color:var(--ink3)}
.mbody{flex:1;min-height:0;display:flex;flex-direction:column}
.conv{flex:1;min-height:0;overflow:auto;padding:14px 0 4px}
.conv-in{max-width:740px;margin:0 auto;padding:0 28px}
.umsg{display:flex;justify-content:flex-end;margin:2px 0 18px}
.umsg .bubble{background:#edf3fe;color:#101828;border-radius:18px;padding:9px 14px;max-width:78%;font-size:13.5px;line-height:1.55}
.amsg{font-size:13.8px;line-height:1.68;color:var(--ink);margin:0 0 14px}
.amsg p{margin:0 0 9px}
.amsg .ln{display:flex;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.amsg .ln:last-child{border-bottom:0}
.amsg .ln b{width:120px;flex:none;font-weight:600}
.amsg .ln span{color:var(--ink2)}
.tool-card{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin:10px 0 16px;font-size:12px;color:var(--ink2);background:#fcfcfd}
.tool-card .ic{width:14px;height:14px;color:var(--ink3)}
.tool-card code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink)}
.tool-card .ok{margin-left:auto;color:#2f9e44;font-size:11px}
.composer-wrap{flex:none;padding:6px 0 10px}
.composer{max-width:740px;margin:0 auto;padding:0 28px}
.cp-box{border:1px solid var(--line2);border-radius:14px;padding:11px 12px 8px;box-shadow:0 6px 18px rgba(15,17,21,.05),0 1px 2px rgba(15,17,21,.04);background:#fff}
.cp-box:hover{border-color:rgba(0,0,0,.2)}
.cp-input{color:var(--ink3);font-size:13.5px;padding:1px 2px 14px}
.cp-row{display:flex;align-items:center;gap:8px}
.cp-add{width:26px;height:26px;border-radius:50%;background:#f5f6f7;display:grid;place-items:center;color:var(--ink2)}
.cp-add .ic{width:14px;height:14px}
.cp-perm{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);padding:3px 7px;border-radius:7px}
.cp-perm:hover{background:var(--hov)}
.cp-perm .ic{width:13px;height:13px}
.cp-model{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);padding:3px 7px;border-radius:7px}
.cp-model:hover{background:var(--hov)}
.cp-model .ic{width:12px;height:12px;opacity:.7}
.cp-mic{width:26px;height:26px;display:grid;place-items:center;color:var(--ink2);border-radius:50%}
.cp-mic:hover{background:var(--hov)}
.cp-mic .ic{width:15px;height:15px}
.cp-send{width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px rgba(65,118,230,.3)}
.cp-send .ic{width:14px;height:14px}
.cp-meta{display:flex;justify-content:center;gap:14px;padding:8px 0 0;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.cp-meta .k{display:flex;align-items:center;gap:4px}

/* ── prototype chrome ──────────────────────────────── */
.proto-bar{position:fixed;left:0;right:0;bottom:0;height:40px;z-index:200;display:flex;align-items:center;justify-content:center;gap:2px;background:#0f1115;color:#fff;padding:0 12px;box-shadow:0 -1px 0 rgba(255,255,255,.08),0 -8px 24px rgba(0,0,0,.12);font-size:12px;user-select:none}
.pb-arrow{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#c9cdd4}
.pb-arrow:hover{background:rgba(255,255,255,.12);color:#fff}
.pb-arrow .ic{width:14px;height:14px}
.pb-label{display:flex;align-items:center;gap:6px;padding:0 8px;min-width:128px;justify-content:center}
.pb-label b{font-size:10px;background:rgba(255,255,255,.16);border-radius:5px;padding:1px 5px;font-weight:700}
.pb-label span{color:#e8eaee}
.pb-sep{width:1px;height:16px;background:rgba(255,255,255,.16);margin:0 3px}
.pb-mini{height:26px;padding:0 9px;border-radius:999px;color:#c9cdd4;font-size:11.5px}
.pb-mini:hover{background:rgba(255,255,255,.12);color:#fff}
.pb-kbd{font-size:10px;color:#8b9099;padding:0 6px 0 3px;letter-spacing:.06em}
.proto-hint{position:fixed;right:20px;top:96px;z-index:199;width:300px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 32px rgba(15,17,21,.14);padding:11px 12px 10px;font-size:11.5px;color:var(--ink2);display:none}
.proto-hint.on{display:block}
.proto-hint .x{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--ink3)}
.proto-hint .x:hover{background:var(--hov);color:var(--ink)}
.proto-hint .x .ic{width:12px;height:12px}
.ph-k{font-size:10.5px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.ph-name{font-size:12px;font-weight:600;color:var(--ink);margin:1px 0 4px}
.ph-desc{margin:0 0 7px;line-height:1.55}
.ph-list{margin:0;padding:0 0 0 2px;list-style:none}
.ph-list li{display:flex;gap:5px;padding:1.5px 0;line-height:1.45}
.ph-list li:before{content:"·";color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:52px;transform:translate(-50%,8px);z-index:210;background:#0f1115;color:#fff;font-size:11.5px;border-radius:8px;padding:6px 11px;box-shadow:0 8px 24px rgba(0,0,0,.24);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.menu{position:fixed;z-index:220;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 14px 38px rgba(15,17,21,.16),0 2px 8px rgba(15,17,21,.06);padding:4px;min-width:196px;font-size:12px}
.menu-note{font-size:10px;color:var(--ink3);line-height:1.45;padding:4px 7px 6px;border-bottom:1px solid var(--line);margin-bottom:3px}
.menu button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;height:26px;padding:0 7px;border-radius:6px;color:var(--ink)}
.menu button:hover{background:var(--hov)}
.menu button .ic{width:13px;height:13px;color:var(--ink2)}
.menu button.danger{color:#b4342b}
.menu button.danger .ic{color:#b4342b}
.menu .sep{height:1px;background:var(--line);margin:4px 3px}
</style>

<script>
(() => {

const BLOCK_META = {

const VARIANTS = {
  A:{key:'A', name:'紧凑原生', desc:'保留官方的工作区树，但只展开当前工作区；最近会话升为一等分区；面板入口改两列网格。', pts:['行高 24-26px，单行标题 + 右侧时间','分区可折叠、可上下拖动排序','侧栏右边缘可拖动调宽','最近会话是内置区块，不再需要底部浮层插件']},
  B:{key:'B', name:'最近优先', desc:'最近会话成为主列表（按时间分组），工作区默认折叠成一行；面板收成图标轨。密度最高。', pts:['首屏可看到 10+ 条最近会话','工作区默认收起，点开才占高度','搜索框即时过滤会话','剩余区块仍可拖动排序']},
  C:{key:'C', name:'自由积木', desc:'每个分区是一块积木：可在主栈内排序，也可拖到底部工具条压成一行入口；侧栏可整体靠右、可调宽。', pts:['主栈 / 底部工具条之间自由拖动','拖到工具条后变成一行入口，点开是浮层','侧栏可换边、可拖宽','积木可折叠、可移除（最近会话也能移除）']}
};
const REQUIRED = {A:['recent','workspace','tools'], B:['recent','workspace','panels'], C:['recent','workspace','panels','tools']};
const KEY = 'dsh-proto-sidebar-v2';

/* ───────────── state ───────────── */
function defaults(){
  return {v:'A', hint:true, vars:{
    A:{zones:{main:['recent','workspace','tools']}, collapsed:{}, removed:[], w:250, side:'left'},
    B:{zones:{main:['recent','workspace','panels']}, collapsed:{workspace:true}, removed:[], w:238, side:'left'},
    C:{zones:{stack:['recent','workspace','panels'], dock:['tools']}, collapsed:{}, removed:[], w:278, side:'left'}
  }};
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaults();
    const d = defaults(), s = JSON.parse(raw);
    if(!s || !s.vars) return d;
    d.v = VARIANTS[s.v] ? s.v : 'A';
    d.hint = s.hint !== false;
    for(const k of ['A','B','C']){
      const src = s.vars[k] || {};
      d.vars[k] = Object.assign(d.vars[k], {
        zones: src.zones || d.vars[k].zones,
        collapsed: src.collapsed || {},
        removed: Array.isArray(src.removed) ? src.removed : [],
        w: Math.min(380, Math.max(212, src.w || d.vars[k].w)),
        side: src.side === 'right' ? 'right' : 'left'
      });
    }
    return d;
  }catch(e){ return defaults(); }
}
let S = load();
const ui = {wsOpen:{A:0,B:null,C:0}, q:'', menu:null};

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function st(){ return S.vars[S.v]; }
function variant(){ return VARIANTS[S.v]; }

/* normalize: every block exactly once (zone or removed) */
function normalize(){
  for(const v of ['A','B','C']){
    const s = S.vars[v];
    const seen = new Set();
    for(const z of Object.keys(s.zones)) s.zones[z] = (s.zones[z]||[]).filter(id => {
      if(!REQUIRED[v].includes(id) || seen.has(id)) return false;
      seen.add(id); return true;
    });
    s.removed = [...new Set(s.removed)].filter(id => REQUIRED[v].includes(id) && !seen.has(id));
    const primary = Object.keys(s.zones)[0];
    for(const id of REQUIRED[v]){
      if(!seen.has(id) && !s.removed.includes(id)){
        (s.zones[primary] = s.zones[primary] || []).push(id);
        seen.add(id);
      }
    }
  }
}

/* ───────────── shell ───────────── */
const app = document.getElementById('app');
let shellEl = null;

function sidebarHTML(){
  const v = S.v, s = st();
  const head = v==='B' ? headB(s) : v==='C' ? headC(s) : headA(s);
  let body = '';
  if(v==='C'){
    body = `<div class="sb-scroll"><div class="zone zone-stack" data-zone="stack" data-dir="y" data-empty-hint="拖动积木到这里">${s.zones.stack.map(id=>blockHTML(id,'stack')).join('')}${restoreHTML()}</div></div>
      <div class="dock-wrap"><div class="zone zone-dock" data-zone="dock" data-dir="x" data-empty-hint="拖到这里收成入口">${(s.zones.dock||[]).map(id=>blockHTML(id,'dock')).join('')}</div></div>`;
  }else{
    body = `<div class="sb-scroll"><div class="zone zone-main" data-zone="main" data-dir="y">${s.zones.main.map(id=>blockHTML(id,'main')).join('')}${restoreHTML()}</div></div>`;
  }
  return `<aside class="sb">
    <div class="sb-hd">${head}</div>
    ${body}
    <div class="sb-ft"><div class="u-row" title="账号与设置"><span class="avatar">睡</span><span class="u-name">睡懒觉的薛定谔</span><button class="u-gear" title="设置">${ic('panel-left')}</button></div></div>

  </aside>`;
}

}

  return brandRow('') +
    `<button class="new-btn" data-act="new">${ic('new-chat')}新会话<span class="kbd">⌘N</span></button>

}

  return brandRow('') +
    `<div class="search">${ic('search')}<input id="q" placeholder="搜索会话" value="${ui.q.replace(/"/g,'&quot;')}" spellcheck="false"/><span class="kbd">⌘K</span></div>

function headC(s){
  return brandRow('') +

     <button class="new-btn" data-act="new">${ic('new-chat')}新会话</button>`;

function restoreHTML(){
  const s = st();
  return s.removed.map(id=>`<button class="restore" data-act="restore" data-block="${id}">${ic('archive')}${BLOCK_META[id].title} 已移除 · 恢复</button>`).join('');
}

/* ───────────── blocks ───────────── */
function blockHTML(id, zone){
  const s = st(), meta = BLOCK_META[id], col = !!s.collapsed[id];
  const count = id==='recent' ? RECENTS.length : id==='workspace' ? WORKSPACES.length : 0;
  const isDock = zone==='dock';
  const title = id==='recent'
    ? `<span class="ttl" title="内置区块：随安装包默认启用，仍可在插件管理中停用或卸载">${meta.title}</span>${count?`<span class="cnt">${count}</span>`:''}`
    : `<span class="ttl">${meta.title}</span>${count?`<span class="cnt">${count}</span>`:''}`;
  const chev = isDock ? '' : `<span class="chev">${ic(col?'chevron-right':'chevron-down')}</span>`;
  const head = `<div class="block-hd">
      <span class="grip" data-grip title="拖动排序">${ic('drag')}</span>
      <button class="block-title" data-act="${isDock?'dockpop':'collapse'}" data-block="${id}">${chev}${title}</button>

      <span class="hd-acts"><button class="mini-btn" data-act="menu" data-block="${id}" title="区块菜单">${ic('ellipsis')}</button></span>
    </div>`;
  if(isDock){
    return `<section class="block chip${col?' collapsed':''}" data-block="${id}" data-zone-kind="dock">${head}<div class="dock-pop" data-pop><div class="pop-hd">${meta.title}</div><div class="block-bd">${bodyHTML(id)}</div></div></section>`;
  }
  return `<section class="block" data-block="${id}">${head}${col?'':`<div class="block-bd">${bodyHTML(id)}</div>`}</section>`;
}
function headActions(id){
  if(id!=='workspace') return '';

    <button class="mini-btn" data-act="noop" title="搜索工作区">${ic('search')}</button>

    <button class="mini-btn" data-act="noop" title="新建工作区">${ic('plus')}</button>
  </span>`;
}

function bodyHTML(id){
  switch(id){
    case 'recent': return recentHTML();
    case 'workspace': return workspaceHTML();
    case 'panels': return panelsHTML();
    case 'tools': return toolsHTML();
    default: return '';
  }
}
function recentHTML(){
  if(S.v==='B'){
    const groups = [
      {label:'刚刚', items:RECENTS.slice(0,2)},
      {label:'今天', items:RECENTS.slice(2,6)},

}

}
function workspaceHTML(){

  const open = ui.wsOpen[S.v];
  return WORKSPACES.map((w,i)=>`

function wsSessions(w, inB){
  if(!w.sessions.length) return `<div class="ws-sessions"><div class="overflow-row" style="cursor:default">还没有会话</div></div>`;
  const limit = inB ? 4 : (S.v === 'C' ? 2 : 3);

/* ───────────── render ───────────── */
function render(){
  document.body.dataset.v = S.v;
  if(!shellEl){
    shellEl = document.createElement('div');
    shellEl.className = 'shell';
    app.replaceChildren(shellEl);
    shellEl.innerHTML = sidebarHTML() + mainHTML();
  }
  renderSide();
  updateBar();
}
function renderSide(){
  const s = st();
  shellEl.dataset.side = s.side;
  shellEl.style.setProperty('--w', s.w + 'px');
  const old = shellEl.querySelector(':scope > .sb');
  const tmp = document.createElement('div');
  tmp.innerHTML = sidebarHTML();
  const next = tmp.firstElementChild;
  if(old) old.replaceWith(next); else shellEl.prepend(next);
  wireSidebar();
}
function replaceSideBody(){
  // cheap re-render of sidebar while keeping scroll position
  const sc = shellEl.querySelector('.sb-scroll');
  const top = sc ? sc.scrollTop : 0;
  renderSide();
  const sc2 = shellEl.querySelector('.sb-scroll');
  if(sc2) sc2.scrollTop = top;
  const d = shellEl.querySelector('.zone-dock');
  if(d) d.scrollTop = 0;
}

/* ───────────── prototype bar / hint ───────────── */
function updateBar(){
  const v = variant();
  document.getElementById('pbKey').textContent = v.key;
  document.getElementById('pbName').textContent = v.name;
  const hint = document.getElementById('hint');
  hint.classList.toggle('on', !!S.hint);
  document.getElementById('phName').textContent = v.key + ' · ' + v.name;
  document.getElementById('phDesc').textContent = v.desc;
  document.getElementById('phList').innerHTML = v.pts.map(p=>`<li>${esc(p)}</li>`).join('');
}
function setVariant(k){
  if(!VARIANTS[k]) k = 'A';
  S.v = k; save();
  document.body.dataset.v = k;
  shellEl.dataset.side = st().side;
  renderSide();
  updateBar();
  const url = new URL(location.href);
  url.searchParams.set('variant', k);
  history.replaceState(null, '', url);
}
function cycle(d){
  const keys = ['A','B','C'];
  const i = keys.indexOf(S.v);
  setVariant(keys[(i + d + keys.length) % keys.length]);
}

/* ───────────── sidebar wiring ───────────── */
function wireSidebar(){
  wireDrag();
  shellEl.querySelectorAll('[data-act="wstoggle"]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('.row-acts')) return;
      const i = +el.dataset.i;
      ui.wsOpen[S.v] = ui.wsOpen[S.v] === i ? null : i;
      replaceSideBody();
    });
  });
  const q = shellEl.querySelector('#q');
  if(q){
    q.addEventListener('input', ()=>{
      ui.q = q.value.trim().toLowerCase();
      shellEl.querySelectorAll('[data-q]').forEach(row=>{
        row.style.display = (!ui.q || row.dataset.q.includes(ui.q)) ? '' : 'none';
      });
    });
  }
  const rz = shellEl.querySelector('.resizer');
  if(rz){
    rz.addEventListener('pointerdown', e=>{
      e.preventDefault();
      const s = st();
      const startX = e.clientX, startW = s.w;
      const dir = s.side === 'right' ? -1 : 1;
      const move = ev=>{
        s.w = Math.min(380, Math.max(212, Math.round(startW + (ev.clientX - startX) * dir)));
        shellEl.style.setProperty('--w', s.w + 'px');
      };
      const up = ()=>{ save(); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
  }
}

/* drag: reorder between zones */
let dragState = null;
function wireDrag(){
  shellEl.querySelectorAll('[data-grip]').forEach(g=>{
    g.addEventListener('pointerdown', ev=>{
      if(ev.button !== 0) return;
      ev.preventDefault();
      const block = g.closest('[data-block]');
      if(!block) return;
      startDrag(ev, block);
    });
  });
}
function startDrag(ev, block){
  const r = block.getBoundingClientRect();
  const clone = block.cloneNode(true);
  clone.classList.add('drag-clone');
  clone.classList.remove('is-source');
  clone.style.width = r.width + 'px';
  clone.style.left = r.left + 'px';
  clone.style.top = r.top + 'px';
  document.body.appendChild(clone);
  block.classList.add('is-source');
  document.body.classList.add('dragging');
  const hintEl = document.createElement('div');
  hintEl.className = 'drop-hint';
  hintEl.textContent = '松手放到这里';
  hintEl.style.display = 'none';
  document.body.appendChild(hintEl);
  dragState = {block, clone, hintEl, offX: ev.clientX - r.left, offY: ev.clientY - r.top, moved:false, sx:ev.clientX, sy:ev.clientY, targetZone:null, drawer:false};
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragUp);
  window.addEventListener('pointercancel', onDragUp);
}
function zoneRects(){
  return [...shellEl.querySelectorAll('[data-zone]')].map(z=>({z, r:z.getBoundingClientRect()}));
}
function onDragMove(ev){
  const d = dragState; if(!d) return;
  if(!d.moved && Math.hypot(ev.clientX-d.sx, ev.clientY-d.sy) < 4) return;
  d.moved = true;
  d.clone.style.left = (ev.clientX - d.offX) + 'px';
  d.clone.style.top = (ev.clientY - d.offY) + 'px';
  const rects = zoneRects();
  let target = null;
  for(const o of rects){
    const pad = o.z.dataset.zone === 'dock' ? 10 : 6;
    if(ev.clientX >= o.r.left - pad && ev.clientX <= o.r.right + pad && ev.clientY >= o.r.top - pad && ev.clientY <= o.r.bottom + pad){ target = o; break; }
  }
  shellEl.querySelectorAll('[data-zone]').forEach(z=>z.classList.toggle('drop-on', !!target && z === target.z));
  if(target){
    const z = target.z;
    const kids = [...z.querySelectorAll(':scope > [data-block]')].filter(k=>k!==d.block);
    let ref = null;
    for(const k of kids){
      const kr = k.getBoundingClientRect();
      if(z.dataset.dir === 'x'){
        if(ev.clientX < kr.left + kr.width/2){ ref = k; break; }
      }else{
        if(ev.clientY < kr.top + kr.height/2){ ref = k; break; }
      }
    }
    z.insertBefore(d.block, ref);
    d.targetZone = z.dataset.zone;
    d.hintEl.style.display = 'none';
  }else{
    d.targetZone = null;
    d.hintEl.style.display = 'block';
    d.hintEl.textContent = shellEl.dataset.side === 'right' ? '拖回侧栏内' : '拖回侧栏内';
    d.hintEl.style.left = (ev.clientX + 14) + 'px';
    d.hintEl.style.top = (ev.clientY + 16) + 'px';
  }
}
function onDragUp(){
  const d = dragState; if(!d) return;
  dragState = null;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragUp);
  window.removeEventListener('pointercancel', onDragUp);
  d.clone.remove(); d.hintEl.remove();
  document.body.classList.remove('dragging');
  d.block.classList.remove('is-source');
  shellEl.querySelectorAll('[data-zone]').forEach(z=>z.classList.remove('drop-on'));
  if(!d.moved){ replaceSideBody(); return; }
  // commit order from DOM
  const s = st();
  for(const z of shellEl.querySelectorAll('[data-zone]')){
    s.zones[z.dataset.zone] = [...z.querySelectorAll(':scope > [data-block]')].map(el=>el.dataset.block);
  }
  if(s.zones.dock && !s.zones.dock.length) delete s.zones.dock;
  save();
  replaceSideBody();
}

/* ───────────── menus ───────────── */
function openMenu(blockId, anchor){
  closeMenu();
  const s = st(), inDock = s.zones.dock ? s.zones.dock.includes(blockId) : false;
  const meta = BLOCK_META[blockId];
  const note = blockId==='recent' ? `<div class="menu-note">内置区块 · 默认随安装启用，可从这里移除，也可在插件管理中停用/卸载。</div>` : '';
  const items = [
    {a:'m-collapse', t: s.collapsed[blockId] ? '展开' : '收起', i:'chevron-down'},
    ...(blockId!=='recent' || true ? [{a:'m-move', t: inDock ? '移回主栈' : '移到底部工具条', i:'dock'}] : []),
    {sep:true},
    {a:'m-remove', t: blockId==='recent' ? '移除最近会话' : `移除${meta.title}区块`, i:'trash', danger:true}
  ];
  const menu = document.createElement('div');
  menu.className = 'menu';
  menu.innerHTML = note + items.map(it=> it.sep ? '<div class="sep"></div>' :
    `<button data-act="${it.a}" data-block="${blockId}" class="${it.danger?'danger':''}">${ic(it.i)}<span>${it.t}</span></button>`).join('');
  document.getElementById('menuRoot').appendChild(menu);
  const r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = Math.min(window.innerWidth - mw - 10, r.right - mw);
  let top = r.bottom + 4;
  if(top + mh > window.innerHeight - 10) top = r.top - mh - 4;
  menu.style.left = Math.max(8, left) + 'px';
  menu.style.top = Math.max(8, top) + 'px';
  ui.menu = menu;
  for(const b of menu.querySelectorAll('button')) b.addEventListener('click', ev=>{
    ev.stopPropagation();
    const act = b.dataset.act, id = b.dataset.block;
    closeMenu();
    onMenuAction(act, id);
  });
}
function closeMenu(){ if(ui.menu){ ui.menu.remove(); ui.menu = null; } }
function onMenuAction(act, id){
  const s = st();
  if(act==='m-collapse'){ s.collapsed[id] = !s.collapsed[id]; save(); replaceSideBody(); }
  else if(act==='m-move'){
    const inDock = s.zones.dock ? s.zones.dock.includes(id) : false;
    if(S.v!=='C'){ toast('这个方案没有底部工具条，换成 C 自由积木再试'); return; }
    if(inDock){
      delete s.zones.dock;
      s.zones.stack.push(id);
      toast('已放回主栈');
    }else{
      s.zones.stack = s.zones.stack.filter(x=>x!==id);
      s.zones.dock = s.zones.dock || [];
      s.zones.dock.push(id);
      toast('已收进底部工具条');
    }
    save(); replaceSideBody();
  }
  else if(act==='m-remove'){
    s.removed.push(id);
    for(const z of Object.keys(s.zones)) s.zones[z] = s.zones[z].filter(x=>x!==id);
    if(s.zones.dock && !s.zones.dock.length) delete s.zones.dock;
    save(); replaceSideBody();
    toast(id==='recent' ? '已移除最近会话 · 内置插件仍在，可恢复' : '已移除区块 · 可恢复');
  }
}

/* ───────────── toast ───────────── */
let toastTimer = null;
function toast(t){
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('on'), 2200);
}

/* ───────────── actions ───────────── */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  // close popovers / menu on outside click
  if(!e.target.closest('.block.chip')){
    shellEl.querySelectorAll('.block.chip.open').forEach(b=>b.classList.remove('open'));
  }
  if(ui.menu && !e.target.closest('.menu')) closeMenu();
  if(!t) return;
  const act = t.dataset.act, id = t.dataset.block;
  if(act==='prev') return cycle(-1);
  if(act==='next') return cycle(1);
  if(act==='reset'){
    const v = S.v; const def = defaults().vars[v];
    S.vars[v] = JSON.parse(JSON.stringify(def));
    ui.wsOpen[v] = def.collapsed.workspace ? null : 0;
    save(); renderSide(); toast('已重置当前方案的布局');
    return;
  }
  if(act==='help'){ S.hint = !S.hint; save(); updateBar(); return; }
  if(act==='new'){ toast('原型：这里只是示意，不创建会话'); return; }
  if(act==='noop'){ return; }
  if(act==='flip'){
    const s = st(); s.side = s.side === 'left' ? 'right' : 'left'; save();
    shellEl.dataset.side = s.side; renderSide(); toast(s.side==='right' ? '侧栏已移到右侧' : '侧栏已回到左侧');
    return;
  }
  if(act==='menu'){ openMenu(id, t); return; }
  if(act==='dockpop'){
    const b = t.closest('.block.chip');
    if(b){ const was = b.classList.contains('open'); shellEl.querySelectorAll('.block.chip.open').forEach(x=>x.classList.remove('open')); if(!was) b.classList.add('open'); }
    return;
  }
  if(act==='restore'){
    const s = st();
    s.removed = s.removed.filter(x=>x!==id);
    const primary = Object.keys(s.zones)[0];
    (s.zones[primary] = s.zones[primary] || []).push(id);
    save(); replaceSideBody(); toast('已恢复');
    return;
  }
  if(act==='m-collapse' || act==='m-move' || act==='m-remove'){ onMenuAction(act, id); return; }
});

/* keyboard */
window.addEventListener('keydown', e=>{
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); cycle(-1); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); cycle(1); }
  else if(e.key === 'Escape'){ closeMenu(); shellEl.querySelectorAll('.block.chip.open').forEach(b=>b.classList.remove('open')); }
});

/* boot */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
normalize();
const qv = new URLSearchParams(location.search).get('variant');
if(qv && VARIANTS[qv]) S.v = qv;
else if(qv) S.v = qv.toUpperCase();
if(!VARIANTS[S.v]) S.v = 'A';
render();
window.__proto = {S, ui, setVariant, st, renderSide, save, normalize};
})();
</script>
