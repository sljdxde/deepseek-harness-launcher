<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>侧栏排版 v3 · 参考 magpie</title>
<!--
  原型 v3：按 magpie/internal/gui 的应用侧栏语言重做 DSH 侧栏排版。
  一次性原型，无构建、无依赖；状态只在内存里，刷新回到默认。
  三个待验证点：① 分组标题与行内容同一左参考线；② 行高/分组间距收紧；
  ③ 收起「最近会话」时「工作区」弹性变高；④ 面板 10 个时滚动而不挤掉工作区。
-->
<style>
:root{
  --bg:#f4f4f6; --card:#fff; --line:#e3e3e8; --line2:#ececf0;
  --ink:#1c1c21; --ink2:#4b4b53; --ctl:#63636b; --muted:#85858d; --faint:#b9b9c2;
  --pill:#f1f1f4; --sel:color-mix(in srgb, var(--ink) 6.5%, transparent);
  --accent:#4f46e5;
  --edge: 0 1px 2px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1a1a1e; --card:#232327; --line:#333339; --line2:#2c2c32; --ink:#ededf1; --ink2:#b9b9c1; --ctl:#a1a1aa; --muted:#8b8b94; --faint:#56565f; --pill:#2d2d33; --sel:color-mix(in srgb, var(--ink) 9%, transparent); --accent:#a5b4fc; --edge: inset 0 .5px 0 rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.3); }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
svg.ic{width:16px;height:16px;flex:none;display:block}
#app{height:calc(100vh - 40px)}
.shell{display:flex;height:100%}
/* ───────────── 侧栏 ───────────── */
.sb{width:280px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--bg);border-right:.5px solid var(--line)}
.sb-brand{flex:none;display:flex;align-items:center;gap:8px;height:46px;padding:0 8px 0 6px}
.sb-mark{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.sb-mark svg{width:22px;height:17px;color:var(--ink);flex:none}
.sb-word{font-size:13.5px;font-weight:600;letter-spacing:.01em}
.sb-badge{font-size:8px;font-weight:700;letter-spacing:.05em;color:var(--card);background:var(--ink);border-radius:4px;padding:2px 4px;line-height:1}
.sb-acts{display:flex;align-items:center;gap:2px;flex:none}
.sb-icon{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.sb-icon:hover{background:var(--pill);color:var(--ink)}
.sb-icon svg{width:15px;height:15px}
.sb-new{flex:none;display:flex;align-items:center;justify-content:center;gap:7px;height:32px;margin:2px 10px 10px;border-radius:8px;background:var(--card);box-shadow:var(--edge);font-size:13px;font-weight:500;color:var(--ink)}
.sb-new:hover{box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.16)}
.sb-new svg{width:15px;height:15px;color:var(--muted)}
.sb-stack{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:0 10px 10px;scrollbar-width:none}
.sb-stack::-webkit-scrollbar{width:0;height:0}
/* 分组 */
.group{position:relative;display:flex;flex-direction:column;min-width:0}
.group.workspace{flex:1;min-height:170px}
.group.ws-open .ws-body{overflow:auto;scrollbar-width:none;padding-bottom:0}
.group.ws-open .ws-body::-webkit-scrollbar{width:0;height:0}
.group.workspace:not([data-open="false"]) .ws-body{mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);}
.group-hd{display:flex;align-items:center;gap:6px;padding:14px 8px 4px;min-height:22px;user-select:none}
.group:first-child .group-hd{padding-top:8px}
.group-title{display:flex;align-items:center;gap:4px;min-width:0;height:18px;font-size:11px;font-weight:500;letter-spacing:.04em;color:var(--muted)}
.group-title:hover{color:var(--ink2)}
.group-caret{width:12px;height:12px;display:grid;place-items:center;opacity:.55}
.group-caret svg{width:11px;height:11px}
.group-count{font-size:11px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.group-grip{width:16px;height:18px;display:grid;place-items:center;color:var(--muted);opacity:0;cursor:grab;border-radius:5px;font-size:12px;line-height:1}
.group:hover .group-grip{opacity:.7}
.group-grip:hover{background:var(--pill);color:var(--ink);opacity:1}
.group-acts{display:flex;align-items:center;gap:0;margin-right:-2px}
.group-acts .sb-icon{width:24px;height:24px;border-radius:6px}
.group-acts .sb-icon svg{width:14px;height:14px}
/* 行 */
.row{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;cursor:default;min-width:0;color:var(--ctl)}
.row:hover{color:var(--ink)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.row .m{font-size:11px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.row.is-current{background:var(--sel);color:var(--ink)}
.row.is-current .t{font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:transparent}
.dot.run{background:var(--accent);animation:pulse 1.8s infinite}
.dot.on{background:var(--ink)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 35%,transparent)}70%{box-shadow:0 0 0 4px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ws-body{display:flex;flex-direction:column;min-height:0}
.ws-row{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;min-width:0;color:var(--ctl)}
.ws-row:hover{color:var(--ink)}
.ws-row .chev{width:12px;height:12px;display:grid;place-items:center;color:var(--faint);flex:none}
.ws-row .chev svg{width:11px;height:11px}
.ws-row svg.folder{width:15px;height:15px;color:var(--muted);flex:none}
.ws-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.ws-row .n{font-size:11px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.ws-sessions{position:relative;margin:1px 0 2px 16px;padding-left:8px;display:flex;flex-direction:column;gap:1px}
.ws-sessions::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:1px;background:var(--line)}
.s-row{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;min-width:0;color:var(--ctl)}
.s-row:hover{color:var(--ink)}
.s-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.s-row .m{font-size:11px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.s-row .dot{margin-left:-2px}
.s-row.is-current{background:var(--sel);color:var(--ink)}
.s-row.is-current .t{font-weight:500}
.ws-more{display:flex;align-items:center;height:24px;padding:0 10px;font-size:11px;color:var(--faint)}
.ws-more:hover{color:var(--ink2)}
/* 面板：主行 30px */
.panel-list{display:flex;flex-direction:column;gap:1px;max-height:190px;overflow:auto;padding:0 0 4px;scrollbar-width:none;mask-image:linear-gradient(to bottom,#000 calc(100% - 10px),transparent);-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 10px),transparent)}
.panel-list::-webkit-scrollbar{width:0;height:0}
.panel-row{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:7px;min-width:0;font-size:13px;color:var(--ctl);width:100%}
.panel-row:hover{background:var(--pill);color:var(--ink)}
.panel-row svg{width:16px;height:16px;color:var(--muted);flex:none}
.panel-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-row.is-active{background:var(--card);box-shadow:var(--edge);color:var(--ink);font-weight:500}
.panel-row.is-active svg{color:var(--ink)}
/* 底部 */
.dock{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:.5px solid var(--line2);min-height:40px}
.dock .chip{display:flex;align-items:center;gap:3px;height:24px;padding:0 10px 0 2px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:11.5px;font-weight:500;color:var(--ctl)}
.dock .chip:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 22%,transparent)}
.dock .hint{font-size:11px;color:var(--muted)}
.sb-foot{flex:none;border-top:.5px solid var(--line2);padding:8px 10px 10px}
.u-row{display:flex;align-items:center;gap:7px;height:28px;padding:0 6px;border-radius:6px}
.u-row:hover{background:var(--pill)}
.avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#dfe6f9,#d3d9e8);display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#3b4252;flex:none}
.u-name{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-more{color:var(--faint);font-size:12px}
/* ───────────── 主区（演示） ───────────── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--card);border-left:.5px solid var(--line)}
.mhead{flex:none;border-bottom:.5px solid var(--line);padding:0}
.mtitle-row{display:flex;align-items:center;gap:7px;height:40px;padding:2px 16px 0 18px}
.mtitle{font-size:14px;font-weight:600;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);border:.5px solid var(--line);border-radius:6px;padding:1.5px 6px;white-space:nowrap;flex:none}
.mchip svg{width:12px;height:12px;opacity:.8}
.mgrow{flex:1}
.mtabs{display:flex;align-items:flex-end;gap:20px;padding:0 18px;height:34px;font-size:13px;color:var(--ink2)}
.mtabs .tab{position:relative;padding:0 0 9px;cursor:pointer;white-space:nowrap}
.mtabs .tab.on{color:var(--ink);font-weight:500}
.mtabs .tab.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);border-radius:2px}
.mbody{flex:1;min-height:0;display:flex;flex-direction:column}
.conv{flex:1;min-height:0;overflow:auto;padding:14px 0 4px}
.conv-in{max-width:760px;margin:0 auto;padding:0 28px}
.umsg{display:flex;justify-content:flex-end;margin:2px 0 18px}
.umsg .bubble{background:#edf3fe;color:#101828;border-radius:18px;padding:9px 14px;max-width:78%;font-size:13.5px;line-height:1.55}
@media (prefers-color-scheme: dark){ .umsg .bubble{background:#26314a;color:#e7eaf3} }
.amsg{font-size:13.8px;line-height:1.68;color:var(--ink);margin:0 0 14px}
.amsg p{margin:0 0 9px}
.amsg .ln{display:flex;gap:12px;padding:6px 0;border-bottom:.5px solid var(--line);font-size:13px}
.amsg .ln:last-child{border-bottom:0}
.amsg .ln b{width:118px;flex:none;font-weight:600}
.amsg .ln span{color:var(--ink2)}
.amsg code{font-family:var(--code);font-size:11.5px;background:var(--pill);border-radius:4px;padding:1px 4px}
.tool-card{display:flex;align-items:center;gap:8px;border:.5px solid var(--line);border-radius:10px;padding:8px 10px;margin:10px 0 16px;font-size:12px;color:var(--ink2);background:var(--bg)}
.tool-card svg{width:14px;height:14px;color:var(--muted)}
.tool-card code{font-family:var(--code);font-size:11.5px;color:var(--ink)}
.tool-card .ok{margin-left:auto;color:#189a58;font-size:11px}
.composer-wrap{flex:none;padding:6px 0 10px}
.composer{max-width:760px;margin:0 auto;padding:0 28px}
.cp-box{border:.5px solid var(--line);border-radius:14px;padding:11px 12px 8px;box-shadow:0 6px 18px rgba(15,17,21,.05),0 1px 2px rgba(15,17,21,.04);background:var(--card)}
.cp-input{color:var(--muted);font-size:13.5px;padding:1px 2px 14px}
.cp-row{display:flex;align-items:center;gap:8px}
.cp-add{width:26px;height:26px;border-radius:50%;background:var(--pill);display:grid;place-items:center;color:var(--ink2)}
.cp-add svg{width:14px;height:14px}
.cp-perm{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);padding:3px 7px;border-radius:7px}
.cp-perm svg{width:13px;height:13px}
.cp-model{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);padding:3px 7px;border-radius:7px}
.cp-model svg{width:12px;height:12px;opacity:.7}
.cp-mic{width:26px;height:26px;display:grid;place-items:center;color:var(--ink2);border-radius:50%}
.cp-mic svg{width:15px;height:15px}
.cp-send{width:28px;height:28px;border-radius:50%;background:#4176e6;display:grid;place-items:center;color:#fff}
.cp-send svg{width:14px;height:14px}
.cp-meta{display:flex;justify-content:center;gap:14px;padding:8px 0 0;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cp-meta svg{width:12px;height:12px;opacity:.7}
/* ───────────── 原型工具条 ───────────── */
.proto-bar{position:fixed;left:0;right:0;bottom:0;height:40px;z-index:200;display:flex;align-items:center;gap:6px;padding:0 14px;background:#111112;color:#fafafa;font-size:12px;box-shadow:0 -1px 0 rgba(255,255,255,.08)}
.proto-tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#8b8b94;margin-right:8px}
.proto-sep{width:1px;height:16px;background:#333;margin:0 4px}
.proto-btn{height:26px;padding:0 10px;border-radius:999px;color:#c9c9d1;font-size:11.5px;display:flex;align-items:center;gap:5px}
.proto-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.proto-btn.on{background:#fff;color:#111}
.proto-btn b{font-weight:600}
.proto-right{margin-left:auto;color:#6f6f78;font-size:11px}
</style>
</head>
<body>
<div id="app"></div>
<div class="proto-bar">
  <span class="proto-tag">原型 v3 · 参考 magpie</span>
  <span class="proto-sep"></span>
  <button class="proto-btn" data-act="recent">最近会话：<b id="stRecent">展开</b></button>
  <button class="proto-btn" data-act="panels">面板：<b id="stPanels">4 个</b></button>
  <button class="proto-btn" data-act="reset">重置</button>
  <span class="proto-right">拖动把手在插件里已实现；这里只看排版</span>
</div>

  </aside>`;
}
function mainHTML() {
  return `<main class="main">

        <span class="mtitle">侧栏排版优化 · 参考 magpie</span>

          <div class="ln"><b>弹性</b><span>工作区是唯一可伸缩分组：收起最近会话，它立刻占满剩余高度</span></div>
          <div class="ln"><b>面板 10 个</b><span>主行列表封顶 190px，内部滚动 + 底部渐隐，标签右侧显示总数</span></div>
          <p style="margin-top:10px">底部工具条可以切「最近会话 展开/收起」和「面板 4/10」，看两种情况下的高度分配。</p>
        </div>
        <div class="tool-card">${ic('browse')}<code>prototypes/sidebar-v3/index.html</code><span class="ok">原型 · 仅排版</span></div>
      </div></div>

          <div class="cp-input">发消息或创建任务，/ 调用指令，@ 文件或对话</div>
          <div class="cp-row">
            <span class="cp-add">${ic('plus')}</span>
            <span class="cp-perm">${ic('user')}完全权限</span>

            <span class="cp-model">deepseek-v4-flash High ${ic('chevron-down')}</span>

      </div></div>
    </div>
  </main>`;
}
function render() {
  $('#app').innerHTML = `<div class="shell">${sidebarHTML()}${mainHTML()}</div>`;
  $$('.panel-list, .ws-body').forEach((el) => { el.scrollTop = 0; });
  $('#stRecent').textContent = state.recentOpen ? '展开' : '收起';
  $('#stPanels').textContent = state.panels + ' 个';
}
document.addEventListener('click', (event) => {
  const target = event.target.closest('[data-act]');
  if (!target) return;
  const act = target.dataset.act;
  if (act === 'toggle' && target.dataset.group === 'recent') {
    state.recentOpen = !state.recentOpen;
    render();
  } else if (act === 'recent') {
    state.recentOpen = !state.recentOpen;
    render();
  } else if (act === 'panels') {
    state.panels = state.panels === 4 ? 10 : 4;
    render();
  } else if (act === 'reset') {
    state.recentOpen = true;
    state.panels = 4;
    render();
  }
});
render();
})();
</script>
</body>
</html>
