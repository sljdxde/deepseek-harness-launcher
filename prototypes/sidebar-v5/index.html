<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>侧栏排版 v5 · 克制的四档字号</title>
<!--
  原型 v5：克制优先。
  排版纪律（整份文件只允许这四档字号）：
    L0 14px/650  品牌名（只此一处）
    L1 13px/650  分组标题：最近会话 / 工作区 / 面板（墨色 + 发丝线）
    L2 12.5px/400 行文字：会话名 / 工作区名 / 面板名
    L3 11px/500  辅助信息：时间 / 计数 / 折叠说明（等宽数字）
  颜色纪律：文字只有三级（墨 / 中灰 / 浅灰），强调色只给「运行中」状态点。
  结构纪律：三个分组共享同一套语言——发丝线标题 + 无卡片扁平列表 + 发丝分隔行。
  面板：默认 4 个，其余折叠；标题右侧「管理」图标开关控制哪些展示。
-->
<style>
:root{
  /* 文字三级 + 边框两级，没有第五种 */
  --t1:#16161a;   /* 墨：分组标题、选中行 */
  --t2:#4c4c54;   /* 中灰：行文字 */
  --t3:#8c8c95;   /* 浅灰：时间、计数 */
  --bg:#f5f5f6;   /* 侧栏底 */
  --card:#fff;    /* 唯一的面板容器 */
  --l1:#e6e6ea;   /* 发丝线 */
  --l2:#eeeef1;   /* 更淡的分隔 */
  --hov:rgba(22,22,26,.045);
  --sel:rgba(22,22,26,.065);
  --accent:#4f46e5;
  --edge:0 1px 2px rgba(0,0,0,.05),0 0 0 .5px rgba(0,0,0,.07);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  /* ── 字号令牌：全文件只允许这四个值（L0 品牌 / L1 分组标题 / L2 行文字 / L3 辅助信息） ── */
  --fs-l0:14px;   /* 品牌名 */
  --fs-l1:13px;   /* 分组标题 */
  --fs-l2:12px; /* 行文字 */
  --fs-l3:11px;   /* 时间 / 计数 / 说明 */
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
@media (prefers-color-scheme: dark){
  :root{
    --t1:#ededf1; --t2:#b6b6be; --t3:#86868f;
    --bg:#1b1b1f; --card:#242428;
    --l1:#323238; --l2:#2b2b31;
    --hov:rgba(255,255,255,.055); --sel:rgba(255,255,255,.085);
    --accent:#a5b4fc;
    --edge:0 1px 2px rgba(0,0,0,.3),inset 0 .5px 0 rgba(255,255,255,.07);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#fff;color:var(--t1);font:12.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
svg.ic{width:16px;height:16px;flex:none;display:block}
#app{height:calc(100vh - 38px)}
.shell{display:flex;height:100%}

/* ───────── 侧栏 ───────── */
.sb{width:288px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--bg);border-right:.5px solid var(--l1)}
.sb-brand{flex:none;display:flex;align-items:center;gap:8px;height:46px;padding:0 8px 0 6px}
.sb-mark{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.sb-mark svg{width:22px;height:17px;color:var(--t1);flex:none}
.sb-name{font-size:var(--fs-l0);font-weight:650;letter-spacing:-.012em}          /* L0 */
.sb-badge{font-size:var(--fs-l3);font-weight:700;letter-spacing:.05em;color:var(--bg);background:var(--t1);border-radius:3.5px;padding:1.5px 4px;line-height:1}
.sb-acts{display:flex;align-items:center;gap:1px;flex:none}
.ib{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--t3);flex:none;transition:background .15s,color .15s}
.ib:hover{background:var(--hov);color:var(--t1)}
.ib svg{width:15px;height:15px}
.ib.sm{width:22px;height:22px}
.ib.sm svg{width:13px;height:13px}

.sb-new{flex:none;display:flex;align-items:center;justify-content:center;gap:7px;height:32px;margin:2px 10px 14px;border-radius:8px;background:var(--card);box-shadow:var(--edge);font-size:var(--fs-l2);font-weight:500;color:var(--t1)}
.sb-new:hover{box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.13)}
.sb-new svg{width:15px;height:15px;color:var(--t3)}

.sb-stack{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:0 10px 12px;scrollbar-width:none}
.sb-stack::-webkit-scrollbar{width:0;height:0}

/* ───────── 分组（L1 标题） ───────── */
.group{position:relative;display:flex;flex-direction:column;min-width:0}
.group.workspace{flex:1;min-height:170px;overflow:hidden}
.group:not(.workspace){flex:none}
.group-hd{display:flex;align-items:center;gap:8px;height:26px;padding:0 2px 0 0;margin-top:14px;user-select:none}
.group:first-child .group-hd{margin-top:2px}
.group-title{flex:none;display:flex;align-items:center;gap:5px;flex:none;height:26px;font-size:var(--fs-l1);font-weight:650;letter-spacing:-.008em;color:var(--t1);white-space:nowrap}   /* L1 */
.group-title:hover{color:var(--t1)}
.group-caret{width:11px;height:11px;display:grid;place-items:center;color:var(--t3);opacity:.75;margin-left:-1px}
.group-caret svg.ic{width:10px;height:10px}
.group-count{font-size:var(--fs-l3);font-weight:500;color:var(--t3);font-variant-numeric:tabular-nums;flex:none}   /* L3 */
.group-rule{flex:1;height:.5px;background:var(--l1);border-radius:1px}
.group-acts{display:flex;align-items:center;gap:0;flex:none}
.group-grip{width:16px;height:20px;display:grid;place-items:center;color:var(--t3);opacity:0;cursor:grab;border-radius:5px;font-size:var(--fs-l2);line-height:1;flex:none}
.group:hover .group-grip{opacity:.7}
.group-grip:hover{background:var(--hov);color:var(--t1);opacity:1}

/* ───────── 行（L2 文字 / L3 辅助） ───────── */
.row{flex:none;display:flex;align-items:center;gap:7px;height:26px;padding:0 8px;border-radius:6px;cursor:default;min-width:0;color:var(--t2);transition:background .15s,color .15s}
.row:hover{background:var(--hov);color:var(--t1)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-l2)}   /* L2 */
.row .m{font-size:var(--fs-l3);font-weight:500;color:var(--t3);flex:none;font-variant-numeric:tabular-nums}    /* L3 */
.row.is-current{background:var(--sel);color:var(--t1)}
.row.is-current .t{font-weight:500}
.dot{width:5px;height:5px;border-radius:50%;flex:none;background:transparent}
.dot.run{background:var(--accent);animation:pulse 1.8s infinite}
.dot.on{background:var(--t1)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,70,229,.35)}70%{box-shadow:0 0 0 4px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* 工作区 */
.ws-body{display:flex;flex-direction:column;min-height:0}
.group.workspace .ws-body{flex:1;min-height:0;overflow:auto}
.ws-body{scrollbar-width:thin;scrollbar-color:var(--l1) transparent}
.ws-body::-webkit-scrollbar{width:4px}
.ws-body::-webkit-scrollbar-thumb{background:var(--l1);border-radius:4px}
.ws-row{flex:none;display:flex;align-items:center;gap:7px;height:26px;padding:0 8px;border-radius:6px;min-width:0;color:var(--t2)}
.ws-row:hover{background:var(--hov);color:var(--t1)}
.ws-row .chev{width:11px;height:11px;display:grid;place-items:center;color:var(--t3);opacity:.6;flex:none}
.ws-row .chev svg.ic{width:10px;height:10px}
.ws-row>svg.ic{width:15px;height:15px;color:var(--t3);flex:none}
.ws-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-l2)}   /* L2 */
.ws-row .n{font-size:var(--fs-l3);font-weight:500;color:var(--t3);flex:none;font-variant-numeric:tabular-nums}    /* L3 */
.ws-sessions{position:relative;margin:1px 0 2px 15px;padding-left:9px;display:flex;flex-direction:column}
.ws-sessions:before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:.5px;background:var(--l1)}
.s-row{flex:none;display:flex;align-items:center;gap:7px;height:25px;padding:0 8px;border-radius:6px;min-width:0;color:var(--t2)}
.s-row:hover{background:var(--hov);color:var(--t1)}
.s-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-l2)}   /* L2 */
.s-row .m{font-size:var(--fs-l3);font-weight:500;color:var(--t3);flex:none;font-variant-numeric:tabular-nums}    /* L3 */
.s-row.is-current{background:var(--sel);color:var(--t1)}
.s-row.is-current .t{font-weight:500}
.ws-more{flex:none;display:flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:var(--fs-l3);font-weight:500;color:var(--t3)}
.ws-more:hover{background:var(--hov);color:var(--t2)}

/* ───────── 面板：白卡 + 发丝分隔 ───────── */
.panel-card{position:relative}
.panel-rows{display:flex;flex-direction:column;max-height:min(26vh,220px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--l1) transparent}
.panel-rows::-webkit-scrollbar{width:4px}
.panel-rows::-webkit-scrollbar-thumb{background:var(--l1);border-radius:4px}
.panel-row{flex:none;display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;min-width:0;font-size:var(--fs-l2);color:var(--t2);width:100%;position:relative;transition:background .15s,color .15s}   /* L2 */
.panel-row + .panel-row:before{content:"";position:absolute;left:8px;right:8px;top:0;height:.5px;background:var(--l2)}
.panel-row:hover{background:var(--hov);color:var(--t1)}
.panel-row svg.ic{width:15px;height:15px;color:var(--t3);flex:none}
.panel-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-row .chev{width:12px;height:12px;color:var(--t3);opacity:0;transition:opacity .15s;flex:none}
.panel-row .chev svg.ic{width:11px;height:11px}
.panel-row:hover .chev{opacity:1}
.panel-row.is-active{color:var(--t1)}
.panel-row.is-active span{font-weight:600}
.panel-row.is-active svg.ic{color:var(--t2)}
/* 折叠行 */
.panel-fold{display:flex;align-items:center;justify-content:center;height:28px;width:100%;border-top:.5px solid var(--l2);font-size:var(--fs-l3);font-weight:500;color:var(--t3)}   /* L3 */
.panel-fold:hover{background:var(--hov);color:var(--t2)}
.panel-fold .lbl{padding:2px 8px;border-radius:5px}
.panel-fold:hover .lbl{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.panel-fold .lbl{display:flex;align-items:center;gap:4px}
.panel-fold .lbl svg.ic{width:11px;height:11px}
/* 管理浮层 */
.panel-manage{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:40;background:var(--card);border-radius:11px;box-shadow:0 16px 44px rgba(20,22,30,.16),0 2px 8px rgba(20,22,30,.06),0 0 0 .5px rgba(20,22,30,.09);padding:5px;max-height:300px;overflow:auto}
.pm-head{display:flex;align-items:center;gap:8px;padding:6px 6px 7px 8px;font-size:var(--fs-l3);font-weight:600;letter-spacing:.03em;color:var(--t3)}
.pm-head .x{margin-left:auto;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--t3)}
.pm-head .x:hover{background:var(--hov);color:var(--t1)}
.pm-head .x svg.ic{width:11px;height:11px}
.pm-row{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:7px;font-size:var(--fs-l2);color:var(--t2)}
.pm-row:hover{background:var(--hov);color:var(--t1)}
.pm-row svg.ic{width:15px;height:15px;color:var(--t3)}
.pm-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{flex:none;width:28px;height:16px;border-radius:999px;background:var(--l1);position:relative;transition:background .16s;cursor:pointer}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.22);transition:transform .16s}
.sw.on{background:var(--t1)}
.sw.on:after{transform:translateX(12px)}
@media (prefers-color-scheme: dark){ .sw:after{background:#d6d6dc} }

/* 底部 */
.dock{flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;border-top:.5px solid var(--l1);min-height:38px}
.dock .hint{font-size:var(--fs-l3);font-weight:500;color:var(--t3)}
.sb-foot{flex:none;border-top:.5px solid var(--l1);padding:6px 10px 8px}
.u-row{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px;border-radius:6px}
.u-row:hover{background:var(--hov)}
.avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#dfe6f9,#d3d9e8);display:grid;place-items:center;font-size:var(--fs-l3);font-weight:600;color:#3b4252;flex:none}
.u-name{font-size:var(--fs-l2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t2)}
.u-more{color:var(--t3);font-size:var(--fs-l2)}

/* ───────── 主区 ───────── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border-left:.5px solid var(--l1)}
@media (prefers-color-scheme: dark){ .main{background:#1f1f23} }
.mhead{flex:none;border-bottom:.5px solid var(--l1)}
.mtitle-row{display:flex;align-items:center;gap:8px;height:40px;padding:2px 16px 0 18px}
.mtitle{font-size:var(--fs-l1);font-weight:600;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-l3);color:var(--t3);border:.5px solid var(--l1);border-radius:5px;padding:1px 6px;white-space:nowrap;flex:none}
.mchip svg{width:12px;height:12px}
.mgrow{flex:1}
.mtabs{display:flex;align-items:flex-end;gap:20px;padding:0 18px;height:34px;font-size:var(--fs-l2);color:var(--t3)}
.mtabs .tab{position:relative;padding:0 0 9px;cursor:pointer;white-space:nowrap}
.mtabs .tab.on{color:var(--t1);font-weight:500}
.mtabs .tab.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);border-radius:2px}
.mbody{flex:1;min-height:0;display:flex;flex-direction:column}
.conv{flex:1;min-height:0;overflow:auto;padding:16px 0 4px}
.conv-in{max-width:720px;margin:0 auto;padding:0 28px}
.umsg{display:flex;justify-content:flex-end;margin:2px 0 18px}
.umsg .bubble{background:var(--hov);color:var(--t1);border-radius:16px;padding:9px 14px;max-width:78%;font-size:var(--fs-l2);line-height:1.6}
.amsg{font-size:var(--fs-l2);line-height:1.65;color:var(--t1);margin:0 0 14px}
.amsg p{margin:0 0 10px}
.amsg .ln{display:flex;gap:14px;padding:7px 0;border-bottom:.5px solid var(--l1);font-size:var(--fs-l2)}
.amsg .ln:last-child{border-bottom:0}
.amsg .ln b{width:104px;flex:none;font-weight:600}
.amsg .ln span{color:var(--t2)}
.amsg code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:var(--fs-l3);background:var(--hov);border-radius:4px;padding:1px 5px}
.composer-wrap{flex:none;padding:6px 0 12px}
.composer{max-width:720px;margin:0 auto;padding:0 28px}
.cp-box{border:.5px solid var(--l1);border-radius:14px;padding:11px 13px 9px;box-shadow:0 6px 18px rgba(15,17,21,.05);background:#fff}
@media (prefers-color-scheme: dark){ .cp-box{background:#242428} }
.cp-input{color:var(--t3);font-size:var(--fs-l2);padding:1px 2px 14px}
.cp-row{display:flex;align-items:center;gap:8px}
.cp-add{width:26px;height:26px;border-radius:50%;background:var(--hov);display:grid;place-items:center;color:var(--t2)}
.cp-add svg{width:14px;height:14px}
.cp-perm{display:flex;align-items:center;gap:5px;font-size:var(--fs-l3);color:var(--t2);padding:3px 7px;border-radius:7px}
.cp-perm svg{width:13px;height:13px}
.cp-model{display:flex;align-items:center;gap:5px;font-size:var(--fs-l3);color:var(--t2);padding:3px 7px;border-radius:7px}
.cp-model svg{width:12px;height:12px;opacity:.7}
.cp-mic{width:26px;height:26px;display:grid;place-items:center;color:var(--t2);border-radius:50%}
.cp-mic svg{width:15px;height:15px}
.cp-send{width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff}
.cp-send svg{width:14px;height:14px}
.cp-meta{display:flex;justify-content:center;gap:14px;padding:8px 0 0;font-size:var(--fs-l3);font-weight:500;color:var(--t3);font-variant-numeric:tabular-nums}
/* 原型工具条 */
.proto-bar{position:fixed;left:0;right:0;bottom:0;height:38px;z-index:200;display:flex;align-items:center;gap:6px;padding:0 14px;background:#16161a;color:#f5f5f6;font-size:var(--fs-l2)}
.proto-tag{font-size:var(--fs-l3);letter-spacing:.08em;text-transform:uppercase;color:#8c8c95;margin-right:10px}
.proto-sep{width:1px;height:15px;background:#333338;margin:0 4px}
.proto-btn{height:25px;padding:0 10px;border-radius:999px;color:#c3c3ca;font-size:var(--fs-l3)}
.proto-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.proto-right{margin-left:auto;color:#6d6d76;font-size:var(--fs-l3)}
</style>
</head>
<body>
<div id="app"></div>
<div class="proto-bar">
  <span class="proto-tag">v5 · 四档字号</span>
  <span class="proto-sep"></span>
  <button class="proto-btn" data-act="recent">最近会话：<b id="stRecent">展开</b></button>
  <button class="proto-btn" data-act="reset">重置</button>

  { key: 'pm', t: '插件管理', icon: 'plugin' },
  { key: 'archive', t: '归档管理', icon: 'archive' },
  { key: 'skills', t: '技能市场', icon: 'sparkle' },
  { key: 'usage', t: '用量统计', icon: 'clock' },
  { key: 'theme', t: '主题', icon: 'context' },
  { key: 'keys', t: '快捷键', icon: 'ellipsis' }
];
const FOLD_AT = 4;
const state = {
  recentOpen: true,
  panelsExpanded: false,
  manageOpen: false,
  visible: new Set(ALL_PANELS.map((p) => p.key))
};
const shownPanels = () => ALL_PANELS.filter((p) => state.visible.has(p.key));

function groupHeader(id, title, count, extra = '') {
  const open = id === 'recent' ? state.recentOpen : true;
  return `<div class="group-hd">
    <button class="group-title" data-act="toggle" data-group="${id}">
      ${title}<span class="group-caret">${ic(open ? 'chevron-down' : 'chevron-right')}</span>
    </button>
    <span class="group-count">${count}</span>
    <span class="group-rule"></span>
    ${extra}
    <span class="group-grip" title="拖动排序">≡</span>
  </div>`;
}
function recentHTML() {
  if (!state.recentOpen) return '';
  return `<div class="group-bd">${RECENTS.map((r, i) => `
    <div class="row${i === 0 ? ' is-current' : ''}">
      <span class="dot${r.st === 'run' ? ' run' : ''}"></span>
      <span class="t">${esc(r.t)}</span><span class="m">${r.tm}</span>
    </div>`).join('')}</div>`;
}
function workspaceHTML() {
  return `<div class="group-bd ws-body">
    ${WORKSPACES.map((w, i) => `
      <div class="ws-row">
        <span class="chev">${ic(i === 0 ? 'chevron-down' : 'chevron-right')}</span>
        ${ic('folder')}
        <span class="t">${esc(w.n)}</span><span class="n">${w.cnt}</span>
      </div>
      ${i === 0 ? `<div class="ws-sessions">
        ${w.sessions.map((s) => `<div class="s-row${s.st === 'run' ? ' is-current' : ''}">
          <span class="dot${s.st === 'run' ? ' run' : ''}"></span>
          <span class="t">${esc(s.t)}</span><span class="m">${s.tm}</span></div>`).join('')}
        <div class="ws-more">展开其余 2 个会话</div>
      </div>` : ''}`).join('')}
  </div>`;
}
function panelsHTML() {
  const list = shownPanels();
  const canFold = list.length > FOLD_AT;
  const rows = canFold && !state.panelsExpanded ? list.slice(0, FOLD_AT) : list;
  const rest = list.length - FOLD_AT;
  return `<div class="panel-card">
    <div class="panel-rows">
      ${rows.map((p, i) => `
        <button class="panel-row${i === 0 ? ' is-active' : ''}">
          ${ic(p.icon)}<span>${esc(p.t)}</span><span class="chev">${ic('chevron-right')}</span>
        </button>`).join('')}
    </div>
    ${canFold ? `<button class="panel-fold" data-act="fold">
      <span class="lbl">${state.panelsExpanded ? '收起' : `显示其余 ${rest} 个`} ${ic(state.panelsExpanded ? 'chevron-up' : 'chevron-down')}</span>
    </button>` : ''}
    ${state.manageOpen ? manageHTML() : ''}
  </div>`;
}
function manageHTML() {
  return `<div class="panel-manage" data-manage>
    <div class="pm-head"><span>管理面板</span><button class="x" data-act="closeManage">${ic('close')}</button></div>
    ${ALL_PANELS.map((p) => `
      <div class="pm-row">
        ${ic(p.icon)}<span>${esc(p.t)}</span>
        <button class="sw${state.visible.has(p.key) ? ' on' : ''}" data-act="togglePanel" data-key="${p.key}" role="switch" aria-checked="${state.visible.has(p.key)}" aria-label="${esc(p.t)}"></button>
      </div>`).join('')}
  </div>`;
}
function sidebarHTML() {
  return `<aside class="sb">
    <div class="sb-brand">
      <div class="sb-mark">${ic('brand')}<span class="sb-name">deepseek</span><span class="sb-badge">HARNESS</span></div>
      <div class="sb-acts">
        <button class="ib" title="重置布局">${ic('refresh')}</button>
        <button class="ib" title="收起侧栏">${ic('panel-left')}</button>
      </div>
    </div>
    <button class="sb-new">${ic('plus')}新会话</button>
    <div class="sb-stack">
      <section class="group">
        ${groupHeader('recent', '最近会话', RECENTS.length)}
        ${recentHTML()}
      </section>
      <section class="group workspace" data-open="true">
        ${groupHeader('workspace', '工作区', WORKSPACES.length, `<span class="group-acts">
          <button class="ib sm" title="搜索工作区">${ic('search')}</button>
          <button class="ib sm" title="筛选">${ic('filter')}</button>
          <button class="ib sm" title="新建工作区">${ic('plus')}</button>
        </span>`)}
        ${workspaceHTML()}
      </section>
      <section class="group" style="position:relative">
        ${groupHeader('panels', '面板', shownPanels().length, `<span class="group-acts">
          <button class="ib sm" data-act="manage" title="管理面板">${ic('filter')}</button>
        </span>`)}
        ${panelsHTML()}
      </section>
    </div>
    <div class="dock"><span class="hint">拖动分组到这里可收成入口</span></div>
    <div class="sb-foot">
      <div class="u-row"><span class="avatar">睡</span><span class="u-name">睡懒觉的薛定谔</span><span class="u-more">⋯</span></div>
    </div>
  </aside>`;
}
function mainHTML() {
  return `<main class="main">
    <div class="mhead">
      <div class="mtitle-row">
        <span class="mtitle">侧栏排版 v5 · 克制的四档字号</span>
        <span class="mchip">${ic('user')}智能体团队</span>
        <span class="mchip">${ic('sparkle')}标准模式</span>
        <span class="mgrow"></span>
        <button class="ib">${ic('ellipsis')}</button>
        <button class="ib">${ic('panel-left')}</button>
      </div>
      <div class="mtabs"><span class="tab on">对话</span><span class="tab">轨迹</span><span class="tab">上下文</span><span class="tab">编队</span><span class="tab">统计</span><span class="tab">⋯</span></div>
    </div>
    <div class="mbody">
      <div class="conv"><div class="conv-in">
        <div class="umsg"><div class="bubble">之前的问题是字号太多档，这版只留四档，每档只有一个职责。</div></div>
        <div class="amsg">
          <p>排版纪律：</p>
          <div class="ln"><b>L0 · 14/650</b><span>只有左上角品牌名用这一档</span></div>
          <div class="ln"><b>L1 · 13/650</b><span>三个分组标题，墨色 + 发丝线，比行文字更醒目</span></div>
          <div class="ln"><b>L2 · 12/400</b><span>所有行文字：会话名、工作区名、面板名</span></div>
          <div class="ln"><b>L3 · 11/500</b><span>只有时间、计数、折叠说明这类辅助信息，等宽数字</span></div>
          <p style="margin-top:10px">颜色同理只有三级（墨 / 中灰 / 浅灰），强调色只留给「运行中」状态点。面板默认 4 个、其余折叠，标题右侧的漏斗图标管理显示哪些。</p>
        </div>
      </div></div>
      <div class="composer-wrap"><div class="composer">
        <div class="cp-box">
          <div class="cp-input">发消息或创建任务，/ 调用指令，@ 文件或对话</div>
          <div class="cp-row">
            <span class="cp-add">${ic('plus')}</span>
            <span class="cp-perm">${ic('user')}完全权限</span>
            <span class="mgrow"></span>
            <span class="cp-model">deepseek-v4-flash High ${ic('chevron-down')}</span>
            <span class="cp-mic">${ic('mic')}</span>
            <span class="cp-send">${ic('send')}</span>
          </div>
        </div>
        <div class="cp-meta"><span>4 轮 139 步</span><span>152 tok/s</span><span>32.5M tok · 缓存命中 99%</span><span>42%</span></div>
      </div></div>
    </div>
  </main>`;
}
function render() {
  $('#app').innerHTML = `<div class="shell">${sidebarHTML()}${mainHTML()}</div>`;
  $('#stRecent').textContent = state.recentOpen ? '展开' : '收起';
}
document.addEventListener('click', (event) => {
  const inside = event.target.closest('[data-manage]');
  if (!inside && state.manageOpen) { state.manageOpen = false; render(); }
  const target = event.target.closest('[data-act]');
  if (!target) return;
  const act = target.dataset.act;
  if (act === 'toggle' && target.dataset.group === 'recent') { state.recentOpen = !state.recentOpen; render(); }
  else if (act === 'recent') { state.recentOpen = !state.recentOpen; render(); }
  else if (act === 'fold') { state.panelsExpanded = !state.panelsExpanded; render(); }
  else if (act === 'manage') { state.manageOpen = !state.manageOpen; render(); }
  else if (act === 'closeManage') { state.manageOpen = false; render(); }
  else if (act === 'togglePanel') {
    const key = target.dataset.key;
    if (state.visible.has(key)) state.visible.delete(key); else state.visible.add(key);
    render();
  } else if (act === 'reset') {
    state.recentOpen = true; state.panelsExpanded = false; state.manageOpen = false;
    state.visible = new Set(ALL_PANELS.map((p) => p.key));
    render();
  }
});
render();
})();
</script>
</body>
</html>
