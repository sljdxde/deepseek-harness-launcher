<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>插件中心 · 布局重构原型（解决贴边 + 分类可操作）</title>
<style>
:root{
  --bg:#f7f8fa;--stage:#eceef2;--card:#fff;--card2:#f6f7f9;--pill:#eef1f5;
  --line:#e3e6ec;--line2:#edf0f4;--fg:#0f1115;--fg2:#404650;--muted:#7c838d;--faint:#a4aab3;
  --accent:#3b82f6;--accent-fg:#fff;--accent-soft:#eaf2ff;
  --ok:#12915f;--ok-soft:#e6f6ee;--warn:#c47b12;--warn-soft:#fdf1de;
  --violet:#7c5cd6;--violet-soft:#f1ecfe;--teal:#0f8f86;--teal-soft:#e3f6f4;
  --rose:#c2467a;--rose-soft:#fdeaf2;--cyan:#1b7fa8;--cyan-soft:#e6f4fa;
  --danger:#dc322f;--danger-soft:#fdecec;
  --shadow:0 24px 80px rgba(0,0,0,.3);
  --ease:cubic-bezier(.25,.1,.25,1);
}
*{box-sizing:border-box}
body{margin:0;font:13px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg)}
.top{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{font-size:15px;margin:0}.top .sub{font-size:11px;color:var(--muted)}
.wrap{max-width:1420px;margin:0 auto;padding:22px}
.legend{font-size:12px;color:var(--muted);margin:0 0 14px}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:18px;align-items:center}

/* ── 面板：1240×900 或全屏 ── */
.page{width:min(1240px,100%);height:900px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;overflow:hidden}
.page.full{width:100%;height:calc(100vh - 44px);border-radius:0}
.rail{width:180px;flex:none;border-right:1px solid var(--line2);background:var(--card2);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.rail .cap{font-size:10.5px;letter-spacing:.06em;color:var(--faint);padding:6px 12px 8px}
.ri{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--fg2);font:inherit;font-size:13px;cursor:pointer;text-align:left;width:100%}
.ri:hover{background:var(--pill)}.ri.on{background:#fff;color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.05)}
.ri .n{margin-left:auto;font-size:11px;color:var(--faint)}
.ri.hot{color:var(--accent)}
.rail .grow{flex:1}

/* ── 关键：内容区用 flex 列，gap 24px，所有区块都是直接子元素 ──
   不再有「一个无样式 div 包住全部」的中间层——那是贴边的根因。 */
.main{flex:1;min-width:0;overflow-y:auto;padding:26px 30px 40px;display:flex;flex-direction:column;gap:24px}
.block{flex:none}

/* 区块标题 */
.bh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bh h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0}
.bh .date{font-size:12px;color:var(--muted)}
.bh .sp{flex:1}
.find{display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;background:var(--pill);color:var(--muted);width:240px}
.find input{border:0;background:none;outline:none;font:inherit;font-size:12.5px;color:var(--fg);min-width:0;flex:1}
.icon{display:inline-flex;flex:none;color:var(--muted)}
.tool{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:var(--pill);color:var(--muted);cursor:pointer}
.tool:hover{color:var(--fg);background:var(--pill)}

/* ── 搜索：白底真输入框 ── */
.searchbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;transition:border-color .15s,box-shadow .15s}
.searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.badge{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:5px;white-space:nowrap}
.searchbar input{flex:1;min-width:0;border:0;outline:none;background:none;font:inherit;font-size:13.5px;color:var(--fg)}
.searchbar input::placeholder{color:var(--muted)}
.go{background:var(--accent);color:var(--accent-fg);border:0;border-radius:9px;height:34px;padding:0 20px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap}
.go.off{opacity:.45}

/* ── 推荐位 ── */
.hero{display:flex;gap:18px;padding:22px 24px;border:1px solid var(--line);border-radius:14px;background:radial-gradient(120% 150% at 100% 0%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 58%),#fff}
.tile{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.hero .tag{font-size:11.5px;font-weight:700;color:var(--accent)}
.hero .name{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px}
.verified{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-size:11.5px;font-weight:600}
.hero .desc{font-size:13px;color:var(--fg2);margin:8px 0 0;max-width:800px}
.stats{display:flex;gap:32px;margin-top:14px}
.stats b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}

/* ── 双榜：两张卡之间 16px（.main 的 gap 之外再加） ── */
.boards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.board{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.board .h{display:flex;align-items:baseline;gap:8px;padding:13px 16px 10px}
.board .h h3{font-size:13.5px;font-weight:700;margin:0}
.board .h .sub{font-size:11px;color:var(--muted)}
.brow{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 16px;border-top:1px solid var(--line2)}
.brow:hover{background:var(--card2)}
.rk{width:18px;text-align:center;font-weight:800;color:var(--faint);font-variant-numeric:tabular-nums}
.brow:nth-child(-n+4) .rk{color:var(--warn)}
.brow .who{flex:1;min-width:0}
.brow .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .sub{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-s{background:var(--accent);color:#fff;border:0;border-radius:8px;font:inherit;font-size:12px;font-weight:600;padding:6px 13px;cursor:pointer}
.done{color:var(--ok);font-size:12px;font-weight:600;white-space:nowrap}

/* ── 分类区：可操作的分段 + 折叠展开 ── */
.cats{display:flex;flex-direction:column;gap:12px}
.catline{display:flex;align-items:flex-start;gap:12px}
.catlist{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0}
.catchip{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:17px;background:#fff;color:var(--fg2);font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;transition:all .14s var(--ease)}
.catchip:hover{border-color:var(--accent);color:var(--accent)}
.catchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.catchip .n{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.catchip.on .n{color:rgba(255,255,255,.75)}
.catchip.more{border-style:dashed;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.catchip.more .chev{transition:transform .18s}
.catchip.more.open .chev{transform:rotate(180deg)}
.catmore{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 0 4px}
.selects{display:flex;gap:10px;flex:none}
select{border:1px solid var(--line);background:#fff;border-radius:9px;height:34px;font:inherit;font-size:12px;color:var(--fg2);padding:0 8px}

/* ── 分类分区 ── */
.sec{display:flex;flex-direction:column;gap:12px}
.sech{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sech h3{font-size:14px;font-weight:700;margin:0}
.sech .n{font-size:11.5px;color:var(--muted)}
.sech .all{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer}
.cardgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:1100px){.cardgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.pcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.pcard .t{display:flex;align-items:center;gap:10px;min-width:0}
.pcard .t .who{flex:1;min-width:0}
.pcard .nm{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .by{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .sum{font-size:12px;color:var(--fg2);line-height:1.5;margin:0;min-height:3em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:5px;font-size:10.5px;font-weight:600}
.c-brand{background:var(--accent-soft);color:var(--accent)}.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-warn{background:var(--warn-soft);color:var(--warn)}.c-violet{background:var(--violet-soft);color:var(--violet)}
.c-teal{background:var(--teal-soft);color:var(--teal)}.c-rose{background:var(--rose-soft);color:var(--rose)}
.c-cyan{background:var(--cyan-soft);color:var(--cyan)}
.moreline{display:flex;justify-content:center;padding-top:2px}
.moreline button{border:0;background:none;color:var(--accent);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:8px 16px;border-radius:9px}
.moreline button:hover{background:var(--accent-soft)}
.hint{font-size:11px;color:var(--faint);text-align:center}
</style>
</head>
<body>
<div class="top"><h1>插件中心 · 布局重构原型</h1><span class="sub">点击切换「窗口/全屏」对比 · 结构与间距按前端 UI 规范重做</span></div>
<div class="wrap">
<p class="legend">核心修正：① 内容区直接放区块，区块之间由父级 gap 24px 统一控制——不再有中间 wrapper 吃掉间距；② 分类条可点、可折叠展开、带数量，选中态清晰。下面两个面板结构相同，仅宽度不同。</p>
<div class="stage">
  <div style="display:flex;gap:10px">
    <button class="go" onclick="document.querySelectorAll('.page').forEach(p=>p.classList.remove('full'))">窗口形态</button>
    <button class="go" style="background:var(--pill);color:var(--fg)" onclick="document.querySelectorAll('.page').forEach(p=>p.classList.add('full'))">全屏形态</button>
  </div>

  <!-- 面板模板：两个尺寸同结构 -->
  <div class="page" id="p1"></div>
  <div class="page full" id="p2"></div>
</div>
</div>

<script>
const I={
  compass:'<circle cx="8" cy="8" r="6"/><path d="M10.8 5.2 9.2 9.2 5.2 10.8 6.8 6.8Z"/>',
  cube:'<path d="M8 1.8 13.8 4.8v6.4L8 14.2 2.2 11.2V4.8Z"/><path d="M2.2 4.8 8 7.8l5.8-3M8 7.8v6.4"/>',
  download:'<path d="M8 2.5v7.5M8 10l2.8-2.8M8 10 5.2 7.2"/><path d="M2.5 13.5h11"/>',
  server:'<rect x="2.5" y="2.5" width="11" height="4.5" rx="1.2"/><rect x="2.5" y="9" width="11" height="4.5" rx="1.2"/><path d="M5 4.75h.01M5 11.25h.01M10 4.75h1.5M10 11.25h1.5"/>',
  search:'<circle cx="6.5" cy="6.5" r="4.5"/><path d="m10.2 10.2 3.8 3.8"/>',
  refresh:'<path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/>',
  sparkle:'<path d="M8 1.8l1.1 2.9 2.9 1.1-2.9 1.1L8 9.8 6.9 6.9 4 5.8l2.9-1.1Z"/><path d="M12.4 10.4l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6Z"/>',
  chev:'<path d="m4 6 4 4 4-4"/>',
  layers:'<path d="M8 2.2 13.8 5 8 7.8 2.2 5Z"/><path d="m2.2 8 5.8 2.8L13.8 8"/><path d="m2.2 10.5 5.8 2.8 5.8-2.8"/>',
  eye:'<path d="M1.5 8S3.8 3.8 8 3.8 14.5 8 14.5 8 12.2 12.2 8 12.2 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="1.8"/>',
  chart:'<path d="M3 13.5V9.5M8 13.5V4M13 13.5V6.5"/>',
  branch:'<circle cx="5" cy="3.5" r="1.7"/><circle cx="5" cy="12.5" r="1.7"/><circle cx="11.5" cy="5" r="1.7"/><path d="M5 5.2v5.6M11.5 6.7c0 3-2.9 4.8-6.5 4.8"/>',
  palette:'<circle cx="8" cy="8" r="6"/><circle cx="6" cy="6" r="1"/><circle cx="10" cy="6" r="1"/><path d="M8 14c0-2 1.5-2.5 3-2.5"/>',
  gear:'<circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.9 3.9l1.4 1.4M10.7 10.7l1.4 1.4M12.1 3.9l-1.4 1.4M5.3 10.7l-1.4 1.4"/>',
  globe:'<circle cx="8" cy="8" r="6"/><path d="M2 8h12"/><path d="M8 2c2.2 2.4 2.2 9.6 0 12-2.2-2.4-2.2-9.6 0-12Z"/>',
  shield:'<path d="M8 1.5 13.5 3.5v4c0 3.6-2.3 6-5.5 7-3.2-1-5.5-3.4-5.5-7v-4Z"/><path d="m5.8 7.7 1.6 1.6 2.8-3"/>',
};
function ico(name,size=14){const p=I[name]||I.gear;return `<span class="icon"><svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${p}</svg></span>`}

const CATS=[
  {id:'ui',label:'界面',n:2272,cls:'c-brand',ic:'palette'},
  {id:'tools',label:'工具',n:1559,cls:'c-teal',ic:'gear'},
  {id:'session',label:'会话',n:872,cls:'c-violet',ic:'layers'},
  {id:'workflow',label:'工作流',n:674,cls:'c-warn',ic:'branch'},
  {id:'dev',label:'开发',n:642,cls:'c-cyan',ic:'gear'},
  {id:'usage',label:'用量',n:611,cls:'c-rose',ic:'chart'},
  {id:'model',label:'模型',n:575,cls:'c-cyan',ic:'cube'},
  {id:'memory',label:'记忆',n:484,cls:'c-rose',ic:'layers'},
  {id:'theme',label:'主题',n:413,cls:'c-violet',ic:'palette'},
  {id:'skill',label:'技能',n:403,cls:'c-teal',ic:'gear'},
  {id:'notify',label:'通知',n:377,cls:'c-ok',ic:'bell'},
  {id:'fun',label:'娱乐',n:369,cls:'c-warn',ic:'sparkle'},
  {id:'remote',label:'远程',n:329,cls:'c-cyan',ic:'globe'},
  {id:'security',label:'安全',n:292,cls:'c-ok',ic:'shield'},
  {id:'browser',label:'浏览器',n:223,cls:'c-cyan',ic:'globe'},
  {id:'docs',label:'文档',n:210,cls:'c-brand',ic:'layers'},
  {id:'vision',label:'视觉',n:202,cls:'c-rose',ic:'eye'},
  {id:'git',label:'Git',n:200,cls:'c-warn',ic:'branch'},
];
function card(name,author,desc,cls,ic,meta){
  return `<div class="pcard"><div class="t">${ico(ic,18)}<div class="who"><div class="nm">${name}</div><div class="by">${author}</div></div><button class="btn-s">安装</button></div><p class="sum">${desc}</p><div class="meta"><span class="chip ${cls}">${meta[0]}</span><span>★ ${meta[1]}</span><span>↓ ${meta[2]}</span></div></div>`
}
function board(title,sub,rows){
  return `<div class="board"><div class="h"><h3>${title}</h3><span class="sub">${sub}</span></div>${rows.map((r,i)=>`<div class="brow"><span class="rk">${i+1}</span>${ico(r[4],16)}<div class="who"><div class="nm">${r[0]}</div><div class="sub">${r[1]}</div></div>${r[5]?`<span class="done">✓ 已安装</span>`:`<button class="btn-s">安装</button>`}</div>`).join('')}</div>`
}
function panelHTML(id){
  const pinned=CATS.slice(0,8),rest=CATS.slice(8);
  return `
  <aside class="rail"><div class="cap">插件中心</div>
    <button class="ri on">${ico('compass',16)}发现</button>
    <button class="ri">${ico('cube',16)}内置<span class="n">6</span></button>
    <button class="ri">${ico('download',16)}已安装<span class="n">7</span></button>
    <button class="ri">${ico('server',16)}插件源<span class="n">1</span></button>
    <div class="grow"></div>
    <button class="ri hot">${ico('download',16)}2 个可更新</button>
  </aside>
  <div class="main">
    <!-- 区块 1：标题 -->
    <div class="block bh"><h2>本周推荐</h2><span class="date">每周日更新推荐位</span><span class="sp"></span>
      <label class="find">${ico('search',13)}<input placeholder="搜索插件和作者…"></label>
      <button class="tool">${ico('refresh',14)}</button>
    </div>
    <!-- 区块 2：搜索 -->
    <form class="block searchbar" onsubmit="return false">
      <span style="color:var(--accent)">${ico('sparkle',16)}</span><span class="badge">AI 搜索</span>
      <input placeholder="描述你想要的插件，例如「把会话导出成 Markdown」">
      <button class="go off">找插件</button>
    </form>
    <!-- 区块 3：推荐位 -->
    <div class="block hero"><div class="tile">${ico('chart',26)}</div>
      <div style="flex:1;min-width:0">
        <div class="tag">今日推荐</div>
        <div class="name">dsh-market <span class="verified">${ico('shield',12)} dsh 社区</span></div>
        <p class="desc">在 DeepSeek Harness 设置页内浏览、搜索并安装社区插件：支持分类筛选、一键更新与停用，以及主题切换与配置备份。</p>
        <div class="stats"><div><b>82.5k/周</b><span>上周下载</span></div><div><b>1.1k</b><span>星标</span></div><div><b>界面</b><span>类型</span></div><div><b>v0.2.36</b><span>版本</span></div></div>
      </div>
    </div>
    <!-- 区块 4：双榜（内部 gap 16） -->
    <div class="block boards">
      ${board('下载最多','npm 上周',[
        ['dsh-market','市场 · ↓82.5k/周 · ★1.1k','', '', 'chart',1],
        ['modlens','视觉 · ↓63.8k/周 · ★3.2k','', '', 'eye',0],
        ['DSH-better-sidebar','界面 · ↓39.7k/周 · ★2.2k','', '', 'palette',0],
        ['dsh-vision-router','模型 · ↓21.7k/周 · ★775','', '', 'chart',0],
        ['dsh-vision-toolkit','工具 · ↓17.2k/周 · ★714','', '', 'gear',0],
      ])}
      ${board('星标最多','GitHub 上',[
        ['OpenViking#examples','记忆 · ★29.6k','', '', 'layers',0],
        ['hindsight#coding-agents','记忆 · ★20.2k','', '', 'layers',0],
        ['archify#integrations','工作流 · ★14.3k','', '', 'branch',0],
        ['ouroboros#integrations','工作流 · ★5.6k','', '', 'branch',0],
        ['mirage#dsh','开发 · ★3.5k','', '', 'cube',0],
      ])}
    </div>
    <!-- 区块 5：分类 + 分区（内部 gap 12） -->
    <div class="block cats">
      <div class="catline"><div class="catlist">
        <button class="catchip on">全部<span class="n">11338</span></button>
        ${pinned.map(c=>`<button class="catchip">${c.label}<span class="n">${c.n}</span></button>`).join('')}
        <button class="catchip more" onclick="this.classList.toggle('open');var m=document.getElementById('catmore${id}');m.style.display=m.style.display==='flex'?'none':'flex'">全部 ${CATS.length} 类 <span class="chev">${ico('chev',12)}</span></button>
